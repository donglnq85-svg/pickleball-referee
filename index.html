<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,select,button{font:inherit}input,select{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px;background:#fff}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px;padding:12px}.secondary{background:#f2f4f7;color:#344054}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:none;font-size:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center}.menu{width:100%;border:0;border-bottom:1px solid #eaecf0;background:#fff;padding:19px 2px;text-align:left;font-weight:650;font-size:17px}.menu span{float:right}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:15px;margin:15px 0}.scorecall strong{display:block;font-size:38px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin:12px 0}.team{border:1px solid #e4e7ec;border-radius:16px;padding:13px 7px}.team.active{border:2px solid #155eef}.score{display:block;font-size:66px;font-weight:800}.players{font-size:12px;color:#667085}.serve{font-size:11px;color:#155eef}.rally{display:grid;gap:10px;margin:15px 0}.rally button{min-height:66px;border:0;border-radius:15px;font-weight:750}.won{background:#155eef;color:white}.lost,.tools button{background:#f2f4f7;color:#344054}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{height:52px;border:0;border-radius:12px;font-weight:650}.status{text-align:center;font-size:13px;color:#475467;margin:10px}.actions{display:grid;gap:10px;margin-top:18px}.games{display:flex;gap:7px}.pill{background:#f2f4f7;padding:7px;border-radius:9px}.winner{text-align:center}.winner strong{font-size:52px}.courtWrap{margin:18px 0}.viewLabel{text-align:center;font-size:12px;font-weight:800;color:#155eef;margin-bottom:8px}.court{position:relative;width:100%;aspect-ratio:1.55/1;background:#2377bd;border:5px solid #dbe4ee;border-radius:12px;overflow:hidden}.court:before{content:'';position:absolute;top:0;bottom:0;left:50%;width:5px;background:#172b4d;box-shadow:0 0 0 2px #fff}.court:after{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:#fff}.nvzL,.nvzR{position:absolute;top:0;bottom:0;width:20%;border-left:3px solid white;border-right:3px solid white}.nvzL{left:30%}.nvzR{left:50%}.pos{position:absolute;z-index:3;width:72px;text-align:center;transform:translate(-50%,-50%)}.dot{width:38px;height:38px;border-radius:50%;margin:auto;display:grid;place-items:center;color:white;font-weight:800;border:3px solid white;box-shadow:0 2px 6px #0004}.red{background:#e5484d}.blue{background:#2878e8}.pos small{display:block;background:white;color:#101828;border-radius:7px;padding:3px;margin-top:3px;font-size:9px;font-weight:700}.a1{left:14%;top:27%}.a2{left:14%;top:73%}.b1{left:86%;top:27%}.b2{left:86%;top:73%}.ref{position:relative;text-align:center;margin-top:8px}.ref:before{content:'▲';display:block;color:#101828;font-size:18px}.ref b{font-size:12px}.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.side{border:1px solid #e4e7ec;border-radius:12px;padding:10px;text-align:center;font-size:12px}.hint{background:#f2f4f7;border-radius:12px;padding:13px;font-size:13px;color:#475467;margin-top:14px}</style></head><body><div id="app"></div><script>(function(){var app=document.getElementById('app'),s={screen:'login',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,rightA:0,rightB:0,game:1,games:[],stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy',win:11}};function B(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+(b||'home')+'">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function serverName(){return names(s.serving)[s.serverPlayer]}function call(){return s.serving==='A'?s.a+' – '+s.b+' – '+s.serverNo:s.b+' – '+s.a+' – '+s.serverNo}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,rightA:s.rightA,rightB:s.rightB}))}function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p>'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><p class="muted">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><h3>Điều hành trận đấu</h3>'+B('Tạo trận đấu','create')+'</div><button class="menu" data-a="positions">Sơ đồ vị trí đứng VĐV <span>›</span></button></main>';else if(s.screen==='positions')h='<main class="app">'+top('Vị trí VĐV','match')+'<p class="muted">Hướng nhìn đúng theo vị trí trọng tài đứng giữa sân, bên ngoài đường biên.</p><div class="courtWrap"><div class="viewLabel">HƯỚNG NHÌN CỦA TRỌNG TÀI ↑</div><div class="court"><div class="nvzL"></div><div class="nvzR"></div><div class="pos a1"><div class="dot red">A1</div><small>'+s.match.a1+'</small></div><div class="pos a2"><div class="dot red">A2</div><small>'+s.match.a2+'</small></div><div class="pos b1"><div class="dot blue">B1</div><small>'+s.match.b1+'</small></div><div class="pos b2"><div class="dot blue">B2</div><small>'+s.match.b2+'</small></div></div><div class="ref"><b>TRỌNG TÀI · GIỮA SÂN</b></div></div><div class="sides"><div class="side"><b>ĐỘI A</b><br>Bên trái trọng tài</div><div class="side"><b>ĐỘI B</b><br>Bên phải trọng tài</div></div><div class="hint"><b>Quy ước hiển thị</b><br>Sơ đồ luôn cố định theo góc nhìn của trọng tài: Đội A ở bên trái màn hình, Đội B ở bên phải màn hình. Vị trí trên/dưới tương ứng hai ô giao bóng mà trọng tài quan sát.</div></main>';else if(s.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân</label><input id="court" value="'+s.match.court+'"><label>Đội A · VĐV 1</label><input id="a1" value="'+s.match.a1+'"><label>Đội A · VĐV 2</label><input id="a2" value="'+s.match.a2+'"><label>Đội B · VĐV 1</label><input id="b1" value="'+s.match.b1+'"><label>Đội B · VĐV 2</label><input id="b2" value="'+s.match.b2+'">'+B('Bắt đầu trận','start')+'</main>';else if(s.screen==='match')h='<main class="app">'+top('Điều hành trận')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+call()+'</strong></div><div class="teams"><div class="team '+(s.serving==='A'?'active':'')+'"><b>ĐỘI A</b><div class="players">'+s.match.a1+'<br>'+s.match.a2+'</div><strong class="score">'+s.a+'</strong></div><div class="team '+(s.serving==='B'?'active':'')+'"><b>ĐỘI B</b><div class="players">'+s.match.b1+'<br>'+s.match.b2+'</div><strong class="score">'+s.b+'</strong></div></div><div class="status"><b>'+serverName()+'</b> đang giao bóng</div><div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="positions">Vị trí VĐV</button></div><div class="actions">'+B('Kết thúc trận','home','danger')+'</div></main>';app.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(['home','create','match','positions'].indexOf(a)>=0){s.screen=a}else if(a==='start'){['court','a1','a2','b1','b2'].forEach(function(k){s.match[k]=document.getElementById(k).value||s.match[k]});s.screen='match'}else if(a==='win'){snap();if(s.serving==='A')s.a++;else s.b++}else if(a==='lose'){snap();if(s.serverNo===1)s.serverNo=2;else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1}}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
