<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081a30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}body{overscroll-behavior:none}button,input{font:inherit;touch-action:manipulation}.screen{max-width:430px;width:100%;height:100dvh;margin:auto;overflow:hidden;background:#0b1f3a;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.splash,.login,.home{justify-content:center}.splash{text-align:center;align-items:center;background:#081a30}.logo{width:86px;height:86px;border:3px solid #5b8cff;border-radius:25px;display:grid;place-items:center;font-size:42px;margin-bottom:20px}.brand{font-size:27px;font-weight:950}.muted{color:#b8c6d9;font-size:12px}.maker{margin-top:12px;color:#8fa8c7;font-size:11px;font-weight:700;letter-spacing:.04em}.maker strong{color:#dbe7ff;font-weight:900}.loginBox{text-align:center}.loginBox h1{margin:0 0 8px}.primary{width:100%;height:56px;border:0;border-radius:14px;background:#155eef;color:#fff;font-size:17px;font-weight:900}.loginBox .primary{margin-top:24px}.loginMaker{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;color:#8fa8c7;font-size:11px}.login{position:relative}.homeHead{text-align:center;margin-bottom:22px}.homeHead h1{margin:0 0 6px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{aspect-ratio:1/1;border-radius:18px;border:1px solid #5b8cff;background:#155eef;color:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}.mode strong{font-size:20px;line-height:1.05}.mode small{font-size:11px;color:#dbe7ff;margin-top:7px}.mode.off{background:#132b49;border-color:#52677f;color:#8394aa}.mode.off small{color:#8394aa}.top{height:46px;display:flex;align-items:center;gap:6px}.back{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:30px}.top h2{font-size:20px;margin:0}.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:#d7e0ec}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg.two{grid-template-columns:1fr 1fr}.seg button{height:45px;border:1px solid #52677f;border-radius:10px;background:#fff;color:#101828;font-weight:800}.seg button.on{border:2px solid #5b8cff;background:#eaf1ff;color:#155eef}.input{width:100%;height:48px;border:1px solid #52677f;border-radius:11px;background:#fff;color:#101828;padding:10px 12px}.rule{background:#132b49;border:1px solid #52677f;border-radius:11px;padding:10px;color:#d7e0ec;font-size:11px;line-height:1.35;margin:3px 0 7px}.setupTitle{margin:4px 0 2px;font-size:14px;color:#dbe7ff;font-weight:900}</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),s={screen:'splash',type:'double',sets:1,winPoints:11,maxPoints:11,startA:0,startB:0};function render(){if(s.screen==='splash')A.innerHTML='<main class="screen splash"><div class="logo">◉</div><div class="brand">PICKLEBALL REFEREE</div><div class="muted">Trợ lý điều hành dành cho trọng tài</div><div class="maker">A product by <strong>THOC Software</strong></div></main>';else if(s.screen==='login')A.innerHTML='<main class="screen login"><div class="loginBox"><div class="logo" style="margin:0 auto 18px">◉</div><h1>Đăng nhập</h1><div class="muted">Chế độ trải nghiệm · chưa cần tài khoản</div><button class="primary" data-a="enter">Vào ứng dụng</button></div><div class="loginMaker">Developed by <strong>THOC Software</strong></div></main>';else if(s.screen==='home')A.innerHTML='<main class="screen home"><div class="homeHead"><h1>PICKLEBALL REFEREE</h1><div class="muted">Chọn chế độ làm việc</div></div><div class="modeGrid"><button class="mode" data-a="quick"><strong>Tạo trận nhanh</strong><small>Trận giao lưu thông thường</small></button><button class="mode off"><strong>Giải đấu</strong><small>Sắp ra mắt</small></button></div></main>';else A.innerHTML='<main class="screen"><div class="top"><button class="back" data-a="home">‹</button><h2>Thiết lập trận đấu</h2></div><div class="body"><div class="field"><label>Hình thức thi đấu</label><div class="seg two"><button data-a="double" class="'+(s.type==='double'?'on':'')+'">Đánh đôi</button><button data-a="single" class="'+(s.type==='single'?'on':'')+'">Đánh đơn</button></div></div><div class="field"><label>Số set</label><div class="seg"><button data-a="set1" class="'+(s.sets===1?'on':'')+'">1 set</button><button data-a="set3" class="'+(s.sets===3?'on':'')+'">3 set</button><button data-a="set5" class="'+(s.sets===5?'on':'')+'">5 set</button></div></div><div class="setupTitle">THỂ THỨC TÍNH ĐIỂM</div><div class="row"><div class="field"><label>Điểm thắng</label><input class="input" id="win" type="number" min="1" value="'+s.winPoints+'"></div><div class="field"><label>Điểm tối đa</label><input class="input" id="max" type="number" min="1" value="'+s.maxPoints+'"></div></div><div class="rule">'+(s.maxPoints===s.winPoints?'Chạm '+s.winPoints+' điểm là thắng. Không yêu cầu cách 2.':'Từ '+s.winPoints+' điểm phải cách 2. Nếu trận kéo dài, chạm '+s.maxPoints+' điểm là thắng.')+'</div><div class="row"><div class="field"><label>Điểm bắt đầu · Đội A</label><input class="input" id="startA" type="number" min="0" value="'+s.startA+'"></div><div class="field"><label>Điểm bắt đầu · Đội B</label><input class="input" id="startB" type="number" min="0" value="'+s.startB+'"></div></div></div><button class="primary" data-a="continue">Tiếp tục</button></main>'}function read(){var w=document.getElementById('win'),m=document.getElementById('max'),a=document.getElementById('startA'),b=document.getElementById('startB');if(w)s.winPoints=Math.max(1,+w.value||11);if(m)s.maxPoints=Math.max(s.winPoints,+m.value||s.winPoints);if(a)s.startA=Math.max(0,+a.value||0);if(b)s.startB=Math.max(0,+b.value||0)}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='enter')s.screen='home';else if(a==='quick')s.screen='setup';else if(a==='home')s.screen='home';else if(a==='double'||a==='single')s.type=a;else if(/^set[135]$/.test(a))s.sets=+a.slice(3);else if(a==='continue')read();render()});document.addEventListener('change',function(e){if(['win','max','startA','startB'].includes(e.target.id)){read();render()}});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});render();setTimeout(function(){s.screen='login';render()},1300)})();</script></body></html>
