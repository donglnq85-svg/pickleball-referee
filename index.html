<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overscroll-behavior:none}.app{max-width:430px;height:100dvh;margin:auto;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));overflow:hidden;display:grid;grid-template-rows:auto auto auto auto auto auto minmax(64px,1fr) minmax(130px,1.45fr) minmax(48px,.62fr);gap:7px}h2,p{margin-top:0}button{font:inherit}.top h2{font-size:23px;line-height:1.1;margin:0}.setScore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;border:1px solid #e4e7ec;border-radius:11px;padding:5px 10px;font-size:13px;font-weight:800}.setScore strong{font-size:21px;color:#155eef}.setScore span{color:#667085;font-size:11px}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:13px;padding:7px}.scorecall small{font-size:11px}.scorecall strong{display:block;font-size:34px;line-height:1.05}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:13px;padding:6px}.team.active{border:2px solid #155eef}.team b{font-size:13px}.score{display:block;font-size:43px;line-height:1;font-weight:800}.players{font-size:11px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{text-align:center;font-size:13px;margin:0}.courtWrap{width:100%;padding:0 0 7px}.court{position:relative;width:100%;aspect-ratio:2.2/1;background:#f0f6ff;border:2px solid #155eef;border-radius:8px;margin:0 0 24px}.net{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#101828;z-index:2}.nvzL,.nvzR{position:absolute;top:0;bottom:0;width:15.91%;background:rgba(21,94,239,.05)}.nvzL{right:50%;border-left:2px solid #8fb4ef}.nvzR{left:50%;border-right:2px solid #8fb4ef}.centerL,.centerR{position:absolute;top:50%;height:2px;background:#8fb4ef}.centerL{left:0;right:65.91%}.centerR{left:65.91%;right:0}.swapCourt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#155eef;color:#fff;font-size:24px;font-weight:900}.p{position:absolute;width:82px;text-align:center;transform:translate(-50%,-50%);z-index:3}.ball{position:relative;width:36px;height:36px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:11px;font-weight:800}.server .ball{background:#155eef;color:#fff;border-color:#155eef}.receiver .ball{border:3px solid #12b76a}.serveDot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fdb022;border:2px solid #fff;top:50%;transform:translateY(-50%)}.serveDot.toRight{right:-8px}.serveDot.toLeft{left:-8px}.p small{display:block;background:#fff;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.al{left:13%;top:72%}.ar{left:13%;top:28%}.bl{left:87%;top:28%}.br{left:87%;top:72%}.ref{position:absolute;left:50%;bottom:-21px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#101828;border:2px solid #fff;display:grid;place-items:center;z-index:7}.refIcon{position:relative;width:16px;height:18px}.refIcon:before{content:"";position:absolute;left:5px;top:0;width:6px;height:6px;border-radius:50%;background:#fff}.refIcon:after{content:"TT";position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:7px;line-height:9px;font-weight:900;color:#101828;background:#fff;border-radius:5px;padding:0 2px}.historyTools,.rally,.teamBreaks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.historyTools button{height:44px;border:1px solid #d0d5dd;background:#fff;border-radius:10px;font-weight:800;color:#155eef}.historyTools button:disabled{color:#98a2b3}.rally{height:100%}.rally button{height:100%;min-height:60px;border:0;border-radius:13px;font-size:14px;font-weight:800;padding:6px}.won{background:#155eef;color:#fff}.lost{background:#f2f4f7;color:#155eef}.teamBreaks{height:100%}.breakCol{border:1px solid #e4e7ec;border-radius:11px;padding:5px;display:grid;grid-template-rows:auto 1fr}.breakTitle{text-align:center;font-size:12px;font-weight:800;color:#667085}.breakBtns{display:grid;grid-template-rows:1fr 1fr;gap:4px}.breakBtns button{border:1px solid #d0d5dd;background:#fff;border-radius:9px;font-size:12px;font-weight:750;color:#475467}.breakBtns button.used{background:#f2f4f7;color:#98a2b3;text-decoration:line-through}.medicalIcon{color:#d92d20}.cancel{width:100%;height:100%;min-height:42px;border:1px solid #f04438;border-radius:10px;background:#fff;color:#d92d20;font-weight:800}.modal{position:fixed;inset:0;background:rgba(16,24,40,.48);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.dialog{width:100%;max-width:394px;background:#fff;border-radius:18px;padding:20px}.dialog p{font-size:14px;color:#667085}.dialogActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogActions button,.btn{height:52px;border-radius:12px;font-weight:750}.keep{border:1px solid #d0d5dd;background:#fff}.confirmCancel,.btn{border:0;background:#155eef;color:#fff}.confirmCancel{background:#d92d20}.timerNum{text-align:center;font-size:64px;font-weight:850;margin:18px 0}@media(max-height:760px){.app{gap:4px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom));grid-template-rows:auto auto auto auto auto auto minmax(44px,.7fr) minmax(88px,1.15fr) minmax(34px,.42fr)}.top h2{font-size:19px}.setScore{padding:2px 8px}.setScore strong{font-size:17px}.scorecall{padding:4px}.scorecall strong{font-size:29px}.score{font-size:36px}.players{font-size:9px}.status{font-size:11px}.court{margin-bottom:19px}.ball{width:31px;height:31px}.ref{width:26px;height:26px;bottom:-18px}.refIcon{transform:scale(.88)}.historyTools button{height:34px;font-size:12px}.rally button{min-height:44px;font-size:11px}.breakBtns button{font-size:10px}.cancel{min-height:32px;font-size:12px}}</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),timer=null,s={a:0,b:0,sets:3,setA:0,setB:0,currentSet:1,winPoints:11,startA:0,startB:0,matchOver:false,pendingSetWinner:'',serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],redo:[],confirmCancel:false,timerType:'',timerTeam:'',timerLeft:0,used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}},match:{a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rn(){return names(s.serving)[s.serverPlayer]}function rt(){return s.serving==='A'?'B':'A'}function rec(){return {team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function player(t,i,pos){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i,left=(s.sideA==='left'?t==='A':t==='B');return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'"><div class="ball">'+t+(i+1)+(sv?'<span class="serveDot '+(left?'toRight':'toLeft')+'"></span>':'')+'</div><small>'+names(t)[i]+'</small></div>'}function stateObj(){return {a:s.a,b:s.b,setA:s.setA,setB:s.setB,currentSet:s.currentSet,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}}function snap(){s.stack.push(JSON.stringify(stateObj()));s.redo=[]}function undo(){if(!s.stack.length)return;s.redo.push(JSON.stringify(stateObj()));Object.assign(s,JSON.parse(s.stack.pop()))}function redo(){if(!s.redo.length)return;s.stack.push(JSON.stringify(stateObj()));Object.assign(s,JSON.parse(s.redo.pop()))}function court(){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=t=>t==='A'?s.rightA:s.rightB,ti=t=>t===l?1-ri(t):ri(t),bi=t=>1-ti(t);return '<div class="courtWrap"><div class="court"><div class="nvzL"></div><div class="nvzR"></div><div class="centerL"></div><div class="centerR"></div><div class="net"></div>'+player(l,ti(l),'ar')+player(l,bi(l),'al')+player(r,ti(r),'bl')+player(r,bi(r),'br')+'<button class="swapCourt" data-a="swap">⇄</button><div class="ref"><span class="refIcon"></span></div></div><div class="historyTools"><button data-a="undo" '+(!s.stack.length?'disabled':'')+'>↶ Hoàn tác</button><button data-a="redo" '+(!s.redo.length?'disabled':'')+'>↷ Làm lại</button></div></div>'}function teamCard(t){return '<div class="team '+(s.serving===t?'active':'')+'"><b>ĐỘI '+t+'</b><div class="players">'+names(t).join(' · ')+'</div><strong class="score">'+(t==='A'?s.a:s.b)+'</strong></div>'}function sync(){var t=rt(),sr=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=t==='A'?s.rightA:s.rightB;s.receiverPlayer=sr?rr:1-rr}function target(){return s.winPoints}function setWon(t){var sc=t==='A'?s.a:s.b,op=t==='A'?s.b:s.a;return sc>=target()&&sc-op>=2}function checkSet(t){if(!setWon(t))return;s.pendingSetWinner=t}function nextSet(){var t=s.pendingSetWinner;s.pendingSetWinner='';if(t==='A')s.setA++;else s.setB++;var need=Math.floor(s.sets/2)+1;if((t==='A'?s.setA:s.setB)>=need){s.matchOver=true;return}s.currentSet++;s.a=s.startA;s.b=s.startB;s.stack=[];s.redo=[];s.used={A:{timeout:false,medical:false},B:{timeout:false,medical:false}};s.sideA=s.sideA==='left'?'right':'left';s.serving=t==='A'?'B':'A';s.serverNo=2;s.serverPlayer=0;s.rightA=0;s.rightB=0;sync()}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function startTimer(team,type,sec){if(s.used[team][type])return;s.used[team][type]=true;clearInterval(timer);s.timerTeam=team;s.timerType=type;s.timerLeft=sec;render();timer=setInterval(()=>{if(s.timerLeft>0){s.timerLeft--;render()}else clearInterval(timer)},1000)}function stopTimer(){clearInterval(timer);timer=null;s.timerType='';s.timerTeam='';s.timerLeft=0;render()}function breakCol(t){function b(type,label){var u=s.used[t][type],icon=type==='timeout'?'⏱':'<span class="medicalIcon">✚</span>';return '<button class="'+(u?'used':'')+'" '+(u?'disabled':'data-a="'+type+t+'"')+'>'+icon+' '+label+(u?' · Đã dùng':'')+'</button>'}return '<div class="breakCol"><div class="breakTitle">ĐỘI '+t+'</div><div class="breakBtns">'+b('timeout','Time-out (1 phút)')+b('medical','Y tế (3 phút)')+'</div></div>'}function render(){var left=s.sideA==='left'?'A':'B',right=left==='A'?'B':'A',h='<main class="app"><div class="top"><h2>Điều hành trận</h2></div>'+(s.sets>1?'<div class="setScore"><div>ĐỘI A <strong>'+s.setA+'</strong></div><span>SET · '+s.currentSet+'/'+s.sets+'</span><div><strong>'+s.setB+'</strong> ĐỘI B</div></div>':'')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+(s.serving==='A'?s.a+' – '+s.b:s.b+' – '+s.a)+' – '+s.serverNo+'</strong></div><div class="teams">'+teamCard(left)+teamCard(right)+'</div><div class="status"><b>'+rn()+'</b> GIAO → <b>'+rec().name+'</b> ĐỠ</div>'+court()+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="teamBreaks">'+breakCol(left)+breakCol(right)+'</div><button class="cancel" data-a="cancelMatch">Huỷ trận đấu</button></main>';if(s.pendingSetWinner)h+='<div class="modal"><div class="dialog"><h3>Đội '+s.pendingSetWinner+' thắng Set '+s.currentSet+'</h3><p>Tỷ số set hiện tại: '+s.a+' – '+s.b+'.</p><button class="btn" data-a="nextSet">'+(((s.pendingSetWinner==='A'?s.setA:s.setB)+1)>=Math.floor(s.sets/2)+1?'Kết thúc trận':'Bắt đầu set tiếp theo')+'</button></div></div>';if(s.matchOver)h+='<div class="modal"><div class="dialog"><h3>Kết thúc trận</h3><p>Đội '+(s.setA>s.setB?'A':'B')+' thắng trận · Tỷ số Set '+s.setA+' – '+s.setB+'.</p><button class="btn" data-a="closeResult">Xác nhận</button></div></div>';if(s.timerType)h+='<div class="modal"><div class="dialog"><h3>Đội '+s.timerTeam+' · '+(s.timerType==='timeout'?'Time-out':'Y tế')+'</h3><div class="timerNum">'+fmt(s.timerLeft)+'</div><button class="btn" data-a="stopTimer">'+(s.timerLeft?'Kết thúc sớm':'Tiếp tục trận')+'</button></div></div>';if(s.confirmCancel)h+='<div class="modal"><div class="dialog"><h3>Huỷ trận đấu?</h3><p>Điểm số và diễn biến hiện tại sẽ bị huỷ.</p><div class="dialogActions"><button class="keep" data-a="keepMatch">Tiếp tục trận</button><button class="confirmCancel" data-a="confirmCancel">Huỷ trận</button></div></div></div>';A.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return,a=x.dataset.a;if(/^timeout[AB]$/.test(a))startTimer(a.slice(-1),'timeout',60);else if(/^medical[AB]$/.test(a))startTimer(a.slice(-1),'medical',180);else if(a==='stopTimer')stopTimer();else if(a==='cancelMatch')s.confirmCancel=true;else if(a==='keepMatch')s.confirmCancel=false;else if(a==='confirmCancel')location.reload();else if(a==='nextSet')nextSet();else if(a==='closeResult')location.reload();else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA;sync();checkSet('A')}else{s.b++;s.rightB=1-s.rightB;sync();checkSet('B')}}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;var sc=s.serving==='A'?s.a:s.b,rr=s.serving==='A'?s.rightA:s.rightB;s.serverPlayer=sc%2===0?rr:1-rr}sync()}else if(a==='swap'){snap();s.sideA=s.sideA==='left'?'right':'left'}else if(a==='undo')undo();else if(a==='redo')redo();render()});render()})();</script></body></html>
