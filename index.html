</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),timer=null,s={screen:'splash',type:'double',sets:1,winPoints:11,customWin:21,limitMode:'touch',maxPoints:15,startA:0,startB:0,a:0,b:0,setA:0,setB:0,currentSet:1,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',setupMode:'server',stack:[],redo:[],confirmCancel:false,timerType:'',timerTeam:'',timerLeft:0,used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}},pendingSetWinner:'',matchWinner:'',match:{a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a){return '<button class="primary" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+b+'">‹</button><h2>'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rt(){return s.serving==='A'?'B':'A'}function rn(){return names(s.serving)[s.serverPlayer]}function rec(){return{team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function setPair(t,si,ri){s.serving=t;s.serverPlayer=si;s.receiverPlayer=ri;s.serverNo=2;if(t==='A'){s.rightA=si;s.rightB=ri}else{s.rightB=si;s.rightA=ri}}function sync(){var t=rt(),sr=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=t==='A'?s.rightA:s.rightB;s.receiverPlayer=sr?rr:1-rr}function player(t,i,pos,setup){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i,left=(s.sideA==='left'?t==='A':t==='B');return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'" '+(setup?'data-a="court'+t+i+'"':'')+'><div class="ball">'+t+(i+1)+(sv?'<i class="dot '+(left?'r':'l')+'"></i>':'')+'</div><small>'+names(t)[i]+'</small></div>'}function court(setup){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=function(t){return t==='A'?s.rightA:s.rightB},ti=function(t){return t===l?1-ri(t):ri(t)},bi=function(t){return 1-ti(t)};return '<div class="courtWrap"><div class="court"><div class="nvzL"></div><div class="nvzR"></div><div class="lineL"></div><div class="lineR"></div><div class="net"></div>'+player(l,ti(l),'ar',setup)+player(l,bi(l),'al',setup)+player(r,ti(r),'bl',setup)+player(r,bi(r),'br',setup)+(setup?'':'<button class="swap" data-a="swap">⇄</button>')+'<div class="ref">TT</div></div></div>'}function state(){return{a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}}function snap(){s.stack.push(JSON.stringify(state()));s.redo=[]}function undo(){if(!s.stack.length)return;s.redo.push(JSON.stringify(state()));Object.assign(s,JSON.parse(s.stack.pop()))}function redo(){if(!s.redo.length)return;s.stack.push(JSON.stringify(state()));Object.assign(s,JSON.parse(s.redo.pop()))}function winner(){var w=s.winPoints;if(s.limitMode==='touch'){if(s.a>=w)return'A';if(s.b>=w)return'B'}else if(s.limitMode==='unlimited'){if(s.a>=w&&s.a-s.b>=2)return'A';if(s.b>=w&&s.b-s.a>=2)return'B'}else{if(s.a>=s.maxPoints)return'A';if(s.b>=s.maxPoints)return'B';if(s.a>=w&&s.a-s.b>=2)return'A';if(s.b>=w&&s.b-s.a>=2)return'B'}return''}function checkSet(){var w=winner();if(!w)return;s.pendingSetWinner=w;if(w==='A')s.setA++;else s.setB++;var need=Math.floor(s.sets/2)+1;if((w==='A'?s.setA:s.setB)>=need){s.matchWinner=w;s.screen='result'}else s.screen='setEnd'}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function startTimer(t,type,sec){if(s.used[t][type])return;s.used[t][type]=true;s.timerTeam=t;s.timerType=type;s.timerLeft=sec;clearInterval(timer);timer=setInterval(function(){if(s.timerLeft>0){s.timerLeft--;render()}else clearInterval(timer)},1000)}function scoreCall(){var sv=s.serving==='A'?s.a:s.b,rv=s.serving==='A'?s.b:s.a;return '<div class="calls"><div class="call"><span>ĐIỂM ĐỘI GIAO</span><strong>'+sv+'</strong><small>ĐỘI '+s.serving+'</small></div><div class="call"><span>ĐIỂM ĐỘI NHẬN</span><strong>'+rv+'</strong><small>ĐỘI '+rt()+'</small></div><div class="call"><span>LƯỢT GIAO</span><strong>'+s.serverNo+'</strong><small>&nbsp;</small></div></div>'}function scoreTeam(t){return '<div class="scoreTeam '+(s.serving===t?'on':'')+'"><div class="scoreNames">'+names(t).join(' · ')+'</div><div class="score">'+(t==='A'?s.a:s.b)+'</div></div>'}function breaks(t){return '<div class="breakCol"><div class="breakTitle">ĐỘI '+t+'</div><div class="breakBtns"><button data-a="timeout'+t+'" '+(s.used[t].timeout?'disabled':'')+'>⏱ Time-out<small>1 phút · '+(s.used[t].timeout?'Đã dùng':'Còn 1')+'</small></button><button class="med" data-a="medical'+t+'" '+(s.used[t].medical?'disabled':'')+'>✚ Y tế<small>3 phút · '+(s.used[t].medical?'Đã dùng':'Còn 1')+'</small></button></div></div>'}function info(){return `<main class="screen q4"><header class="q4head"><button data-a="home">‹</button><h2>Thiết lập trận đấu</h2><span></span></header>

<section class="q4card q4rules"><h3><i>3</i>Thể thức</h3><div class="q4row"><label>Số set</label><div class="q4seg three"><button data-a="set1" class="${s.sets===1?'on':''}">1</button><button data-a="set3" class="${s.sets===3?'on':''}">3</button><button data-a="set5" class="${s.sets===5?'on':''}">5</button></div></div><div class="q4row"><label>Điểm thắng</label><div class="q4seg three"><button data-a="win11" class="${s.winPoints===11?'on':''}">11</button><button data-a="win15" class="${s.winPoints===15?'on':''}">15</button><button data-a="win21" class="${s.winPoints===21?'on':''}">21</button></div></div><div class="q4row"><label>Điều kiện</label><div class="q4seg two"><button data-a="touchMode" class="${s.limitMode==='touch'?'on':''}"><b>Chạm</b><small>Chạm điểm là thắng</small></button><button data-a="unlimitedMode" class="${s.limitMode!=='touch'?'on':''}"><b>Cách 2</b><small>Thắng cách biệt 2</small></button></div></div><div class="q4row"><label>Điểm tối đa</label><div class="q4max"><button class="q4switch ${s.limitMode==='maximum'?'on':''}" data-a="maximumMode"><i></i></button>${s.limitMode==='maximum'?`<div class="q4step"><button data-a="maxMinus">−</button><b>${s.maxPoints}</b><button data-a="maxPlus">+</button></div>`:`<span>Tắt</span>`}</div></div></section>
