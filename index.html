<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Pickleball Referee</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#101828}.fallback{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.box{width:100%;max-width:390px;text-align:center}.box h1{font-size:34px;line-height:1.05;margin:0 0 14px}.box p{color:#667085;margin:0 0 28px}.box input{display:block;width:100%;height:54px;margin:12px 0;padding:0 16px;border:1px solid #d0d5dd;border-radius:12px;font-size:17px}.box button{width:100%;height:56px;margin-top:12px;border:0;border-radius:12px;background:#155eef;color:white;font-size:17px;font-weight:700}
  </style>
</head>
<body>
  <div id="root">
    <main class="fallback"><section class="box"><h1>PICKLEBALL<br>REFEREE</h1><p>Chính xác. Công bằng. Phát triển.</p><input placeholder="Số điện thoại" inputmode="tel"><input placeholder="Mật khẩu" type="password"><button type="button">Đăng nhập</button></section></main>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
