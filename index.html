e></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),timer=null,s={screen:'login',type:'double',sets:1,winPoints:11,customPoints:21,startA:0,startB:0,note:'',setupMode:'server',a:0,b:0,setA:0,setB:0,currentSet:1,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],redo:[],confirmCancel:false,timerType:'',timerTeam:'',timerLeft:0,pendingSetWinner:'',matchWinner:'',used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}},match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a){return '<button class="btn" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+b+'">‹</button><h2>'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rn(){return names(s.serving)[s.serverPlayer]}function rt(){return s.serving==='A'?'B':'A'}function rec(){return {team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function player(t,i,pos,setup){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i,left=(s.sideA==='left'?t==='A':t==='B'),dot=left?'toRight':'toLeft';return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'" '+(setup?'data-a="court'+t+i+'"':'')+'><div class="ball">'+t+(i+1)+(sv?'<span class="serveDot '+dot+'"></span>':'')+'</div><small>'+names(t)[i]+'</small></div>'}function court(setup){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=function(t){return t==='A'?s.rightA:s.rightB},ti=function(t){return t===l?1-ri(t):ri(t)},bi=function(t){return 1-ti(t)},swap=setup?'':'<button class="swapCourt" data-a="swap">⇄</button>',hist=setup?'':'<div class="historyTools"><button data-a="undo" '+(!s.stack.length?'disabled':'')+'>↶ Hoàn tác</button><button data-a="redo" '+(!s.redo.length?'disabled':'')+'>↷ Làm lại</button></div>';return '<div class="courtWrap"><div class="court"><div class="nvzL"></div><di
