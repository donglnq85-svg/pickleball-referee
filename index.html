<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081a30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}body{overscroll-behavior:none}button,input{font:inherit;touch-action:manipulation}.screen{max-width:430px;width:100%;height:100dvh;margin:auto;overflow:hidden;background:#0b1f3a;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.splash,.login,.home,.result{justify-content:center}.splash{text-align:center;align-items:center;background:#081a30}.logo{width:86px;height:86px;border:3px solid #5b8cff;border-radius:25px;display:grid;place-items:center;font-size:42px;margin-bottom:20px}.brand{font-size:27px;font-weight:950}.muted{color:#b8c6d9;font-size:12px}.login h1,.home h1{margin:0 0 6px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:#d7e0ec}.input{width:100%;height:49px;border:1px solid #52677f;border-radius:11px;background:#fff;color:#101828;padding:12px}.primary{width:100%;height:53px;border:0;border-radius:13px;background:#155eef;color:#fff;font-size:17px;font-weight:900}.secondary{width:100%;height:45px;border:0;background:transparent;color:#9bbcff;font-weight:800}.error{min-height:20px;color:#ffb4ad;font-size:12px;text-align:center;margin-top:8px}.homeHead{text-align:center;margin-bottom:22px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{aspect-ratio:1/1;border-radius:18px;border:1px solid #5b8cff;background:#155eef;color:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}.mode strong{font-size:20px;line-height:1.05}.mode small{font-size:11px;color:#dbe7ff;margin-top:7px}.mode.off{background:#132b49;border-color:#52677f;color:#8394aa}.mode.off small{color:#8394aa}.top{height:42px;display:flex;align-items:center;gap:7px;flex:0 0 42px}.top h2{font-size:20px;margin:0}.back{width:38px;height:38px;border:0;background:transparent;color:#fff;font-size:30px}.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg.two{grid-template-columns:1fr 1fr}.seg button,.setupbar button,.swapSetup{height:43px;border:1px solid #52677f;border-radius:10px;background:#fff;color:#101828;font-weight:800}.seg button.on,.setupbar button.on{border:2px solid #5b8cff;background:#eaf1ff;color:#155eef}.rule{background:#132b49;border:1px solid #52677f;border-radius:10px;padding:8px 10px;color:#d7e0ec;font-size:11px}.setupbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:5px 0}.swapSetup{width:100%;margin:5px 0}.match{gap:5px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.call{aspect-ratio:1.08/1;border-radius:14px;background:#eef4ff;color:#1849a9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.call:first-child{background:#155eef;color:#fff}.call:last-child{background:#fffaeb;color:#7a5b00}.call span,.call small{font-size:9px;font-weight:950;color:inherit}.call strong{font-size:46px;line-height:.95}.teams{display:grid;grid-template-columns:1fr 1fr;gap:6px}.team{text-align:center;background:#eef4ff;color:#101828;border-radius:10px;padding:4px}.team.on{outline:2px solid #5b8cff}.names{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:30px;font-weight:950;line-height:1}.status{text-align:center;background:#fff;color:#101828;border-radius:8px;padding:4px;font-size:12px}.court{position:relative;width:100%;aspect-ratio:2.2/1;background:#168b88;border:2px solid #d9ffff;border-radius:8px;margin-bottom:17px}.net{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#081a30}.nvzL,.nvzR{position:absolute;top:0;bottom:0;width:15.91%;background:#1aa29e}.nvzL{right:50%;border-left:2px solid #d9ffff}.nvzR{left:50%;border-right:2px solid #d9ffff}.lineL,.lineR{position:absolute;top:50%;height:2px;background:#d9ffff}.lineL{left:0;right:65.91%}.lineR{left:65.91%;right:0}.p{position:absolute;width:72px;text-align:center;transform:translate(-50%,-50%);z-index:3}.ball{position:relative;width:30px;height:30px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:9px;font-weight:900;color:#101828}.server .ball{background:#155eef;color:#fff;border-color:#fff}.receiver .ball{border:3px solid #fdb022}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#fdb022;border:2px solid #fff;top:50%;transform:translateY(-50%)}.dot.r{right:-8px}.dot.l{left:-8px}.p small{display:block;background:#fff;color:#101828;font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.al{left:13%;top:72%}.ar{left:13%;top:28%}.bl{left:87%;top:28%}.br{left:87%;top:72%}.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#155eef;color:#fff;font-size:20px}.ref{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#081a30;border:2px solid #fff;display:grid;place-items:center;font-size:8px;font-weight:950}.rally{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:64px}.rally button{border:0;border-radius:12px;font-size:15px;font-weight:900}.won{background:#155eef;color:#fff}.lost{background:#e8eef8;color:#1849a9}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools button{height:34px;border:1px solid #5b8cff;background:#eaf1ff;color:#155eef;border-radius:9px;font-weight:800}.tools button:disabled{opacity:.4}.breaks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.breakCol{background:#132b49;border:1px solid #52677f;border-radius:10px;padding:4px}.breakTitle{text-align:center;font-size:9px;font-weight:900}.breakBtns{display:grid;grid-template-columns:1fr 1fr;gap:4px}.breakBtns button{height:43px;border:1px solid #e6c66b;background:#fffaeb;color:#7a5b00;border-radius:8px;font-size:9px;font-weight:900}.breakBtns button.med{background:#fff1f0;color:#b42318;border-color:#f7b4ae}.breakBtns button:disabled{opacity:.4}.tip{background:#132b49;border:1px solid #52677f;border-radius:9px;padding:6px 9px;font-size:10px;color:#d7e0ec}.cancel{height:29px;border:1px solid #f97066;border-radius:8px;background:#132b49;color:#ffb4ad;font-size:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.dialog{width:100%;max-width:390px;background:#fff;color:#101828;border-radius:18px;padding:20px;text-align:center}.timer{font-size:60px;font-weight:950;margin:15px}.result{text-align:center}.resultScore{font-size:52px;font-weight:950;color:#78a5ff;margin:15px}</style></head><body><div id="app"></div><script>(function(){var API='https://brlyzsprmaxxgqotglmt.supabase.co/functions/v1/referee-api',A=document.getElementById('app'),timer=null,session=null;try{session=JSON.parse(localStorage.getItem('pr_session')||'null')}catch(e){}var s={screen:'splash',loginStep:'email',email:'',authError:'',type:'double',sets:1,winPoints:11,maxPoints:11,startA:0,startB:0,a:0,b:0,setA:0,setB:0,currentSet:1,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',setupMode:'server',stack:[],redo:[],timerType:'',timerTeam:'',timerLeft:0,used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}},pendingSetWinner:'',matchWinner:'',historyId:'',match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function api(body,auth){return fetch(API,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth&&session?{'Authorization':'Bearer '+session.access_token}:{}),body:JSON.stringify(body)}).then(async function(r){var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Có lỗi xảy ra');return d})}function B(t,a,c){return '<button class="'+(c||'primary')+'" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+b+'">‹</button><h2>'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rn(){return names(s.serving)[s.serverPlayer]}function rt(){return s.serving==='A'?'B':'A'}function rec(){return{team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function setPair(t,si,ri){s.serving=t;s.serverPlayer=si;s.receiverPlayer=ri;s.serverNo=2;if(t==='A'){s.rightA=si;s.rightB=ri}else{s.rightB=si;s.rightA=ri}}function sync(){var t=rt(),sr=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=t==='A'?s.rightA:s.rightB;s.receiverPlayer=sr?rr:1-rr}function player(t,i,pos,setup){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i,left=(s.sideA==='left'?t==='A':t==='B');return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'" '+(setup?'data-a="court'+t+i+'"':'')+'><div class="ball">'+t+(i+1)+(sv?'<i class="dot '+(left?'r':'l')+'"></i>':'')+'</div><small>'+names(t)[i]+'</small></div>'}function court(setup){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=function(t){return t==='A'?s.rightA:s.rightB},ti=function(t){return t===l?1-ri(t):ri(t)},bi=function(t){return 1-ti(t)};return '<div class="court"><div class="nvzL"></div><div class="nvzR"></div><div class="lineL"></div><div class="lineR"></div><div class="net"></div>'+player(l,ti(l),'ar',setup)+player(l,bi(l),'al',setup)+player(r,ti(r),'bl',setup)+player(r,bi(r),'br',setup)+(setup?'':'<button class="swap" data-a="swap">⇄</button>')+'<div class="ref">TT</div></div>'}function state(){return{a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}}function snap(){s.stack.push(JSON.stringify(state()));s.redo=[]}function undo(){if(!s.stack.length)return;s.redo.push(JSON.stringify(state()));Object.assign(s,JSON.parse(s.stack.pop()))}function redo(){if(!s.redo.length)return;s.stack.push(JSON.stringify(state()));Object.assign(s,JSON.parse(s.redo.pop()))}function winner(){var w=s.winPoints,m=s.maxPoints;if(m===w){if(s.a>=w)return'A';if(s.b>=w)return'B';return''}if(s.a>=m)return'A';if(s.b>=m)return'B';if(s.a>=w&&s.a-s.b>=2)return'A';if(s.b>=w&&s.b-s.a>=2)return'B';return''}function checkSet(){var w=winner();if(!w)return;s.pendingSetWinner=w;if(w==='A')s.setA++;else s.setB++;var need=Math.floor(s.sets/2)+1;if((w==='A'?s.setA:s.setB)>=need){s.matchWinner=w;s.screen='result';finishHistory()}else s.screen='setEnd'}function startHistory(){if(!session)return;api({action:'start_history',court:s.match.court,team_a:names('A').join(' / '),team_b:names('B').join(' / '),sets:s.sets,win_points:s.winPoints,max_points:s.maxPoints},true).then(function(d){s.historyId=d.id||''}).catch(function(){})}function finishHistory(){if(!s.historyId)return;api({action:'finish_history',id:s.historyId,final_set_a:s.setA,final_set_b:s.setB,winner:s.matchWinner},true).catch(function(){})}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function startTimer(t,type,sec){if(s.used[t][type])return;s.used[t][type]=true;s.timerTeam=t;s.timerType=type;s.timerLeft=sec;clearInterval(timer);timer=setInterval(function(){if(s.timerLeft>0){s.timerLeft--;render()}else clearInterval(timer)},1000);render()}function stopTimer(){clearInterval(timer);s.timerType='';s.timerTeam='';s.timerLeft=0;render()}function nextSet(){s.currentSet++;s.a=s.startA;s.b=s.startB;s.stack=[];s.redo=[];s.pendingSetWinner='';s.used={A:{timeout:false,medical:false},B:{timeout:false,medical:false}};s.setupMode='server';setPair('A',0,0);s.screen='setup'}function reset(){clearInterval(timer);Object.assign(s,{screen:'home',a:0,b:0,setA:0,setB:0,currentSet:1,stack:[],redo:[],timerType:'',timerTeam:'',timerLeft:0,pendingSetWinner:'',matchWinner:'',historyId:'',used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}}})}function scoreCall(){var sv=s.serving==='A'?s.a:s.b,rv=s.serving==='A'?s.b:s.a;return '<div class="calls"><div class="call"><span>ĐIỂM ĐỘI GIAO</span><strong>'+sv+'</strong><small>ĐỘI '+s.serving+'</small></div><div class="call"><span>ĐIỂM ĐỘI NHẬN</span><strong>'+rv+'</strong><small>ĐỘI '+rt()+'</small></div><div class="call"><span>LƯỢT GIAO</span><strong>'+s.serverNo+'</strong><small>&nbsp;</small></div></div>'}function team(t){return '<div class="team '+(s.serving===t?'on':'')+'"><div class="names">'+names(t).join(' · ')+'</div><div class="score">'+(t==='A'?s.a:s.b)+'</div></div>'}function breaks(t){return '<div class="breakCol"><div class="breakTitle">ĐỘI '+t+'</div><div class="breakBtns"><button data-a="timeout'+t+'" '+(s.used[t].timeout?'disabled':'')+'>⏱ Time-out<br>1 phút</button><button class="med" data-a="medical'+t+'" '+(s.used[t].medical?'disabled':'')+'>✚ Y tế<br>3 phút</button></div></div>'}function render(){var h='';if(s.screen==='splash')h='<main class="screen splash"><div class="logo">◉</div><div class="brand">PICKLEBALL REFEREE</div><div class="muted">Trợ lý điều hành dành cho trọng tài</div></main>';else if(s.screen==='login')h='<main class="screen login"><div><h1>Đăng nhập</h1><div class="muted">Mỗi trọng tài có tài khoản và lịch sử bắt trận riêng.</div>'+(s.loginStep==='email'?'<div class="field"><label>Email</label><input class="input" id="email" type="email" value="'+s.email+'"></div>'+B('Gửi mã đăng nhập','sendOtp'):'<div class="field"><label>Mã 6 số đã gửi tới '+s.email+'</label><input class="input" id="otp" inputmode="numeric" maxlength="6"></div>'+B('Xác nhận đăng nhập','verifyOtp')+B('Dùng email khác','changeEmail','secondary'))+'<div class="error">'+s.authError+'</div></div></main>';else if(s.screen==='home')h='<main class="screen home"><div class="homeHead"><h1>Chào mừng, Trọng tài</h1><div class="muted">Chọn chế độ làm việc</div></div><div class="modeGrid"><button class="mode" data-a="quick"><strong>Tạo trận nhanh</strong><small>Trận giao lưu thông thường</small></button><button class="mode off" data-a="tournament"><strong>Giải đấu</strong><small>Sắp ra mắt</small></button></div></main>';else if(s.screen==='info')h='<main class="screen">'+top('Tạo trận nhanh','home')+'<div class="body"><div class="field"><label>Hình thức</label><div class="seg two"><button data-a="double" class="'+(s.type==='double'?'on':'')+'">Đánh đôi</button><button data-a="single" class="'+(s.type==='single'?'on':'')+'">Đánh đơn</button></div></div><div class="field"><label>Số set</label><div class="seg"><button data-a="set1" class="'+(s.sets===1?'on':'')+'">1 set</button><button data-a="set3" class="'+(s.sets===3?'on':'')+'">3 set</button><button data-a="set5" class="'+(s.sets===5?'on':'')+'">5 set</button></div></div><div class="row"><div class="field"><label>Điểm thắng</label><input class="input" id="winPoints" type="number" min="1" value="'+s.winPoints+'"></div><div class="field"><label>Điểm tối đa</label><input class="input" id="maxPoints" type="number" min="1" value="'+s.maxPoints+'"></div></div><div class="rule">Bằng nhau: chạm điểm là thắng. Điểm tối đa lớn hơn: cách 2; nếu kéo dài, chạm điểm tối đa là thắng.</div><div class="row"><div class="field"><label>Điểm đầu A</label><input class="input" id="startA" type="number" min="0" value="'+s.startA+'"></div><div class="field"><label>Điểm đầu B</label><input class="input" id="startB" type="number" min="0" value="'+s.startB+'"></div></div></div>'+B('Tiếp tục','saveInfo')+'</main>';else if(s.screen==='create')h='<main class="screen">'+top('VĐV & sân','info')+'<div class="body"><div class="field"><label>Sân</label><input class="input" id="court" value="'+s.match.court+'"></div><div class="row"><div class="field"><label>Đội A · VĐV 1</label><input class="input" id="a1" value="'+s.match.a1+'"></div><div class="field"><label>Đội A · VĐV 2</label><input class="input" id="a2" value="'+s.match.a2+'"></div></div><div class="row"><div class="field"><label>Đội B · VĐV 1</label><input class="input" id="b1" value="'+s.match.b1+'"></div><div class="field"><label>Đội B · VĐV 2</label><input class="input" id="b2" value="'+s.match.b2+'"></div></div></div>'+B('Setup vị trí trên sân','toSetup')+'</main>';else if(s.screen==='setup')h='<main class="screen">'+top('Setup vị trí','create')+'<div class="setupbar"><button data-a="modeServer" class="'+(s.setupMode==='server'?'on':'')+'">GIAO · '+rn()+'</button><button data-a="modeReceiver" class="'+(s.setupMode==='receiver'?'on':'')+'">ĐỠ · '+rec().name+'</button></div><div style="flex:1;display:flex;align-items:center">'+court(true)+'</div><button class="swapSetup" data-a="swapSetup">⇄ Đổi bên hai đội</button>'+B('Bắt đầu điều hành','begin')+'</main>';else if(s.screen==='setEnd')h='<main class="screen result"><h1>Đội '+s.pendingSetWinner+' thắng set '+s.currentSet+'</h1><div class="resultScore">'+s.a+' – '+s.b+'</div><p>Tỷ số set: '+s.setA+' – '+s.setB+'</p>'+B('Setup set '+(s.currentSet+1),'nextSet')+'</main>';else if(s.screen==='result')h='<main class="screen result"><h1>Đội '+s.matchWinner+' thắng trận</h1><div class="resultScore">'+s.setA+' – '+s.setB+'</div><p>Đã lưu vào lịch sử tài khoản trọng tài.</p>'+B('Về trang chủ','finish')+'</main>';else{var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A';h='<main class="screen match">'+scoreCall()+'<div class="teams">'+team(l)+team(r)+'</div><div class="status"><b>'+rn()+'</b> GIAO → <b>'+rec().name+'</b> ĐỠ</div>'+court(false)+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo" '+(!s.stack.length?'disabled':'')+'>↶ Hoàn tác</button><button data-a="redo" '+(!s.redo.length?'disabled':'')+'>↷ Làm lại</button></div><div class="breaks">'+breaks(l)+breaks(r)+'</div><div class="tip">💡 '+(s.serverNo===2?'Kiểm tra đúng người giao và người đỡ trước khi xướng điểm.':'Xướng đủ 3 số, rõ ràng; quan sát người nhận đã sẵn sàng.')+'</div><button class="cancel" data-a="cancel">Huỷ trận đấu</button></main>';if(s.timerType)h+='<div class="modal"><div class="dialog"><h3>Đội '+s.timerTeam+' · '+(s.timerType==='timeout'?'Time-out':'Y tế')+'</h3><div class="timer">'+fmt(s.timerLeft)+'</div>'+B('Tiếp tục trận','stopTimer')+'</div></div>'}A.innerHTML=h}async function sendOtp(){s.authError='';s.email=(document.getElementById('email').value||'').trim();if(!s.email){s.authError='Nhập email của trọng tài.';render();return}try{await api({action:'request_otp',email:s.email},false);s.loginStep='otp';render()}catch(e){s.authError=e.message;render()}}async function verifyOtp(){var token=(document.getElementById('otp').value||'').trim();try{var d=await api({action:'verify_otp',email:s.email,token:token},false);session=d.session;localStorage.setItem('pr_session',JSON.stringify(session));s.screen='home';render()}catch(e){s.authError=e.message;render()}}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='sendOtp'){sendOtp();return}else if(a==='verifyOtp'){verifyOtp();return}else if(a==='changeEmail'){s.loginStep='email';s.authError=''}else if(a==='quick')s.screen='info';else if(a==='tournament')return;else if(['home','info','create'].includes(a))s.screen=a;else if(a==='double'||a==='single')s.type=a;else if(/^set[135]$/.test(a))s.sets=+a.slice(3);else if(a==='saveInfo'){s.winPoints=Math.max(1,+document.getElementById('winPoints').value||11);s.maxPoints=Math.max(s.winPoints,+document.getElementById('maxPoints').value||s.winP
