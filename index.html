<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Pickleball Referee</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin-top:0}h1{font-size:32px;line-height:1.05}h2{font-size:25px}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,select,button{font:inherit}input,select{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px;background:#fff;font-size:16px}label{font-size:14px;font-weight:700}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px;padding:12px}.secondary{background:#f2f4f7;color:#344054}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{border:0;background:none;font-size:28px;padding:0 8px 0 0}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.menu{width:100%;border:0;border-bottom:1px solid #eaecf0;background:#fff;padding:19px 2px;text-align:left;font-weight:650;font-size:17px}.menu span{float:right}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:15px;margin:15px 0}.scorecall small{color:#d0d5dd}.scorecall strong{display:block;font-size:38px;margin-top:4px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin:12px 0}.team{border:1px solid #e4e7ec;border-radius:16px;padding:13px 7px}.team.active{border:2px solid #155eef;background:#f9fbff}.score{display:block;font-size:66px;line-height:1;font-weight:800;margin:10px 0}.serve{display:inline-block;background:#eff4ff;color:#155eef;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:750}.players{font-size:12px;line-height:1.5;min-height:38px;color:#667085}.rally{display:grid;gap:10px;margin:15px 0}.rally button{min-height:66px;border:0;border-radius:15px;font-weight:750;font-size:16px}.won{background:#155eef;color:#fff}.lost{background:#f2f4f7;color:#344054}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{height:52px;border:0;border-radius:12px;background:#f2f4f7;font-weight:650}.status{text-align:center;font-size:13px;color:#475467;margin:8px 0 14px}.actions{display:grid;gap:10px;margin-top:18px}.games{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{background:#f2f4f7;border-radius:9px;padding:7px 9px;font-size:12px}.winner{text-align:center;padding:30px 0}.winner strong{font-size:52px}.notice{background:#ecfdf3;color:#027a48;padding:12px;border-radius:10px;margin-bottom:16px;font-size:14px}.court{position:relative;width:100%;aspect-ratio:1/1.55;background:#1d75c9;border:8px solid #e7eef6;border-radius:14px;margin:18px 0;overflow:hidden}.court:before{content:'';position:absolute;left:0;right:0;top:50%;height:5px;background:#172b4d;box-shadow:0 0 0 2px #fff}.court:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff}.kitchen1,.kitchen2{position:absolute;left:0;right:0;height:22%;border-top:3px solid #fff;border-bottom:3px solid #fff}.kitchen1{top:28%}.kitchen2{top:50%}.pos{position:absolute;z-index:3;width:76px;text-align:center;transform:translate(-50%,-50%)}.dot{width:38px;height:38px;border-radius:50%;margin:auto;display:grid;place-items:center;color:#fff;font-weight:800;border:3px solid #fff;box-shadow:0 2px 7px #0003}.red{background:#e5484d}.blue{background:#2878e8}.pos small{display:block;background:#fff;color:#101828;border-radius:8px;padding:4px;margin-top:4px;font-size:10px;font-weight:700;box-shadow:0 1px 5px #0002}.p1{left:28%;top:12%}.p2{left:72%;top:12%}.p3{left:28%;top:88%}.p4{left:72%;top:88%}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}.legend .card{margin:0;padding:12px;font-size:13px}.hint{background:#f2f4f7;border-radius:12px;padding:13px;font-size:13px;color:#475467;margin-top:14px}
</style></head><body><div id="app"></div><script>
(function(){var app=document.getElementById('app');var s={screen:'login',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,rightA:0,rightB:0,game:1,games:[],history:[],stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy',win:11}};
function load(){try{var x=JSON.parse(localStorage.getItem('pr-v2'));if(x&&x.history)s.history=x.history}catch(e){}}function save(){try{localStorage.setItem('pr-v2',JSON.stringify({history:s.history}))}catch(e){}}load();function B(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t){return '<div class="top"><button class="back" data-a="home">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(team){return team==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function serverName(){return names(s.serving)[s.serverPlayer]}function receiverName(){var other=s.serving==='A'?'B':'A',right=other==='A'?s.rightA:s.rightB;var serverRight=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer;return names(other)[serverRight?1-right:right]}function call(){return s.serving==='A'?(s.a+' – '+s.b+' – '+s.serverNo):(s.b+' – '+s.a+' – '+s.serverNo)}function won(){return (s.a>=s.match.win||s.b>=s.match.win)&&Math.abs(s.a-s.b)>=2}function snapshot(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,rightA:s.rightA,rightB:s.rightB}));if(s.stack.length>30)s.stack.shift()}function restore(){if(!s.stack.length)return;var x=JSON.parse(s.stack.pop());Object.assign(s,x)}
function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p><input placeholder="Số điện thoại" inputmode="tel"><input placeholder="Mật khẩu" type="password">'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><p class="muted" style="margin-bottom:5px">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><small>CORE MATCH V2</small><h3 style="margin:10px 0">Điều hành theo lượt giao bóng</h3><p class="muted">Ứng dụng tự quản lý điểm, Server 1/2 và side-out.</p>'+B('Tạo trận đấu','create')+'</div><button class="menu" data-a="positions">Sơ đồ vị trí đứng VĐV <span>›</span></button><button class="menu" data-a="history">Lịch sử trận đấu <span>›</span></button></main>';else if(s.screen==='positions')h='<main class="app">'+top('Sơ đồ vị trí VĐV')+'<p class="muted">Vị trí đứng cơ bản trong đánh đôi. Trái / phải được xác định theo hướng nhìn từ cuối sân của mỗi đội.</p><div class="court"><div class="kitchen1"></div><div class="kitchen2"></div><div class="pos p1"><div class="dot red">1</div><small>Đội A · Trái</small></div><div class="pos p2"><div class="dot red">2</div><small>Đội A · Phải</small></div><div class="pos p3"><div class="dot blue">3</div><small>Đội B · Trái</small></div><div class="pos p4"><div class="dot blue">4</div><small>Đội B · Phải</small></div></div><div class="legend"><div class="card"><b>🔴 Đội A</b><br><small>VĐV 1 · Trái sân<br>VĐV 2 · Phải sân</small></div><div class="card"><b>🔵 Đội B</b><br><small>VĐV 3 · Trái sân<br>VĐV 4 · Phải sân</small></div></div><div class="hint"><b>Lưu ý</b><br>Sơ đồ giúp trọng tài kiểm tra vị trí trước khi giao bóng và theo dõi đổi vị trí sau mỗi điểm.</div></main>';else if(s.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân</label><input id="court" value="'+s.match.court+'"><label>Đội A · VĐV 1</label><input id="a1" value="'+s.match.a1+'"><label>Đội A · VĐV 2</label><input id="a2" value="'+s.match.a2+'"><label>Đội B · VĐV 1</label><input id="b1" value="'+s.match.b1+'"><label>Đội B · VĐV 2</label><input id="b2" value="'+s.match.b2+'"><label>Điểm thắng game</label><select id="win"><option>11</option><option>15</option><option>21</option></select>'+B('Bắt đầu trận','start')+'</main>';else if(s.screen==='match'){var ga=s.games.map(function(g,i){return '<span class="pill">G'+(i+1)+': '+g.a+'–'+g.b+'</span>'}).join('');h='<main class="app">'+top('Điều hành trận')+'<div class="row"><small>'+s.match.court+' · Game '+s.game+'</small><small>Đôi · Side-out</small></div><div class="games">'+ga+'</div><div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+call()+'</strong></div><div class="teams"><div class="team '+(s.serving==='A'?'active':'')+'"><b>ĐỘI A</b><div class="players">'+s.match.a1+'<br>'+s.match.a2+'</div><strong class="score">'+s.a+'</strong>'+(s.serving==='A'?'<span class="serve">GIAO BÓNG · S'+s.serverNo+'</span>':'')+'</div><div class="team '+(s.serving==='B'?'active':'')+'"><b>ĐỘI B</b><div class="players">'+s.match.b1+'<br>'+s.match.b2+'</div><strong class="score">'+s.b+'</strong>'+(s.serving==='B'?'<span class="serve">GIAO BÓNG · S'+s.serverNo+'</span>':'')+'</div></div><div class="status"><b>'+serverName()+'</b> giao bóng → <b>'+receiverName()+'</b> nhận bóng</div><div class="rally"><button class="won" data-a="serverwin">Đội giao bóng thắng rally<br><small style="color:#dbe7ff">+1 điểm · tiếp tục giao</small></button><button class="lost" data-a="serverlose">Đội giao bóng thua rally<br><small>Chuyển lượt giao / Side-out</small></button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="positions">Vị trí VĐV</button></div><div class="actions">'+B('Kết thúc game','endgame','secondary')+B('Kết thúc trận','endmatch','danger')+'</div></main>'}else if(s.screen==='gameend')h='<main class="app center"><div class="full winner"><p class="muted">KẾT THÚC GAME '+s.game+'</p><strong>'+s.a+' – '+s.b+'</strong><h2 style="margin-top:20px">'+(s.a>s.b?'Đội A thắng':s.b>s.a?'Đội B thắng':'Chưa xác định')+'</h2><div class="actions">'+B('Xác nhận · Game tiếp theo','nextgame')+B('Quay lại','match','secondary')+'</div></div></main>';else if(s.screen==='history')h='<main class="app">'+top('Lịch sử trận đấu')+(s.history.length?s.history.slice().reverse().map(function(x){return '<div class="card"><b>'+x.a+' vs '+x.b+'</b><p class="muted" style="margin:8px 0 0">'+x.result+' · '+x.court+'</p></div>'}).join(''):'<div class="card"><p class="muted" style="margin:0">Chưa có trận đấu.</p></div>')+'</main>';else{var wa=0,wb=0;s.games.forEach(function(g){if(g.a>g.b)wa++;else if(g.b>g.a)wb++});h='<main class="app center"><div class="full winner"><div class="notice">Đã lưu trận đấu</div><p class="muted">KẾT THÚC TRẬN</p><strong>'+wa+' – '+wb+'</strong><h2 style="margin-top:20px">'+(wa>wb?'Đội A thắng':wb>wa?'Đội B thắng':'Chưa phân thắng bại')+'</h2>'+B('Về trang chủ','home')+'</div></main>'}app.innerHTML=h}
function resetGame(){s.a=0;s.b=0;s.serving='A';s.serverNo=2;s.serverPlayer=0;s.rightA=0;s.rightB=0;s.stack=[]}document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a');if(['home','create','history','match','positions'].indexOf(a)>=0){s.screen=a;render();return}if(a==='start'){s.match.court=document.getElementById('court').value||'Sân 1';['a1','a2','b1','b2'].forEach(function(k){s.match[k]=document.getElementById(k).value||k.toUpperCase()});s.match.win=+document.getElementById('win').value;s.game=1;s.games=[];resetGame();s.screen='match'}else if(a==='serverwin'){snapshot();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}}else if(a==='serverlose'){snapshot();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;s.serverPlayer=s.serving==='A'?s.rightA:s.rightB}}else if(a==='undo')restore();else if(a==='endgame')s.screen='gameend';else if(a==='nextgame'){s.games.push({a:s.a,b:s.b});s.game++;resetGame();s.screen='match'}else if(a==='endmatch'){if(s.a||s.b)s.games.push({a:s.a,b:s.b});var wa=0,wb=0;s.games.forEach(function(g){if(g.a>g.b)wa++;else if(g.b>g.a)wb++});s.history.push({a:s.match.a1+' / '+s.match.a2,b:s.match.b1+' / '+s.match.b2,court:s.match.court,result:wa+'–'+wb});save();s.screen='matchend'}if(won()&&s.screen==='match')s.screen='gameend';render()});render()})();
</script></body></html>
