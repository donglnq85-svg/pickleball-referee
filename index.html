ểm</button></div><div class="seg subseg" style="margin-top:7px"><button data-a="touch" class="'+on(s.limitMode,'touch')+'">Chạm</button><button data-a="unlimited" class="'+on(s.limitMode,'unlimited')+'">Không giới hạn</button><button data-a="maximum" class="'+on(s.limitMode,'maximum')+'">Điểm tối đa</button></div>'+(s.limitMode==='maximum'?'<div class="maxrow"><button class="step" data-a="maxMinus">−</button><div class="value">'+s.maxPoints+'</div><button class="step" data-a="maxPlus">+</button></div>':'')+'<div class="hint">'+(s.limitMode==='touch'?'Chạm '+s.winPoints+' điểm là thắng.':s.limitMode==='unlimited'?'Từ '+s.winPoints+' điểm phải thắng cách 2, không giới hạn điểm.':'Từ '+s.winPoints+' điểm phải thắng cách 2; chạm '+s.maxPoints+' là thắng.')+'</div></div><div class="divider"></div><div class="section"><div class="label">Điểm bắt đầu</div><div class="startgrid"><div class="startbox"><b>ĐỘI A</b><div class="counter"><button class="step" data-a="aMinus">−</button><div class="value">'+s.startA+'</div><button class="step" data-a="aPlus">+</button></div></div><div class="startbox"><b>ĐỘI B</b><div class="counter"><button class="step" data-a="bMinus">−</button><div class="value">'+s.startB+'</div><button class="step" data-a="bPlus">+</button></div></div></div></div></div><button class="primary" data-a="continue">Tiếp tục</button></main>'}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='enter')s.screen='home';else if(a==='quick')s.screen='info';else if(a==='home')s.screen='home';else if(a==='double'||a==='single')s.type=a;else if(/^set[135]$/.test(a))s.sets=+a.slice(3);else if(/^win(11|15|21)$/.test(a)){s.winPoints=+a.slice(3);if(s.maxPoints<s.winPoints)s.maxPoints=s.winPoints}else if(['touch','unlimited','maximum'].includes(a))s.limitMode=a;else if(a==='maxMinus')s.maxPoints=Math.max(s.winPoints,s.maxPoints-1);else if(a==='maxPlus')s.maxPoints++;else if(a==='aMinus')s.startA=Math.max(0,s.startA-1);else if(a==='aPlus')s.startA++;else if(a==='bMinus')s.startB=Math.max(0,s.startB-1);else if(a==='bPlus')s.startB++;render()});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});render();setTimeout(function(){s.screen='login';render()},1300)})();</script></body></html>
