<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,button{font:inherit}input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;background:none;font-size:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:13px;margin:12px 0}.scorecall strong{display:block;font-size:38px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:16px;padding:10px 7px}.team.active{border:2px solid #155eef}.score{display:block;font-size:58px;font-weight:800}.players{font-size:12px;color:#667085}.status{text-align:center;font-size:13px;margin:9px}.courtTitle{display:flex;justify-content:space-between;align-items:center;margin:16px 1px 8px;font-size:13px}.legend{font-size:11px;color:#667085}.court{position:relative;width:100%;height:210px;background:#eaf2ff;border:2px solid #155eef;border-radius:12px;overflow:hidden}.court:before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;background:#101828;z-index:2}.mid{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #8fb4ef}.kitchen1,.kitchen2{position:absolute;left:0;right:0;height:22%;border-bottom:2px solid #8fb4ef}.kitchen1{top:28%}.kitchen2{top:50%;border-bottom:0;border-top:2px solid #8fb4ef}.p{position:absolute;width:88px;text-align:center;transform:translate(-50%,-50%);z-index:4}.ball{width:34px;height:34px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:12px;font-weight:800}.p.server .ball{background:#155eef;color:#fff;border-color:#155eef;box-shadow:0 0 0 4px #dbe7ff}.p.receiver .ball{border:3px solid #12b76a;box-shadow:0 0 0 3px #d1fadf}.p small{display:block;font-size:9px;font-weight:700;color:#344054;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:8px;font-weight:800;margin-top:2px}.server .tag{color:#155eef}.receiver .tag{color:#027a48}.tl{left:25%;top:18%}.tr{left:75%;top:18%}.bl{left:25%;top:82%}.br{left:75%;top:82%}.rally{display:grid;gap:9px;margin:14px 0}.rally button{min-height:62px;border:0;border-radius:15px;font-weight:750}.won{background:#155eef;color:white}.lost,.tools button{background:#f2f4f7;color:#344054}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{height:50px;border:0;border-radius:12px;font-weight:650}.actions{margin-top:14px}</style></head><body><div id="app"></div><script>(function(){var app=document.getElementById('app'),s={screen:'login',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,rightA:0,rightB:0,stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t){return '<div class="top"><button class="back" data-a="home">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function serverName(){return names(s.serving)[s.serverPlayer]}function receiver(){var other=s.serving==='A'?'B':'A',ri=other==='A'?s.rightA:s.rightB,serverRight=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer;return {team:other,index:serverRight?1-ri:ri,name:names(other)[serverRight?1-ri:ri]}}function call(){return s.serving==='A'?s.a+' – '+s.b+' – '+s.serverNo:s.b+' – '+s.a+' – '+s.serverNo}function player(team,i,pos){var serv=s.serving===team&&s.serverPlayer===i,rec=receiver(),recv=rec.team===team&&rec.index===i;return '<div class="p '+pos+(serv?' server':'')+(recv?' receiver':'')+'"><div class="ball">'+team+(i+1)+'</div><small>'+names(team)[i]+'</small>'+(serv?'<div class="tag">GIAO BÓNG</div>':recv?'<div class="tag">ĐỠ BÓNG</div>':'')+'</div>'}function diagram(){var aR=s.rightA,aL=1-aR,bR=s.rightB,bL=1-bR;return '<div class="courtTitle"><b>VỊ TRÍ VĐV</b><span class="legend">● Giao bóng · ◯ Đỡ bóng</span></div><div class="court"><div class="mid"></div><div class="kitchen1"></div><div class="kitchen2"></div>'+player('B',bL,'tl')+player('B',bR,'tr')+player('A',aR,'bl')+player('A',aL,'br')+'</div>'}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,rightA:s.rightA,rightB:s.rightB}))}function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p>'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><p class="muted">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><h3>Điều hành trận đấu</h3>'+B('Tạo trận đấu','create')+'</div></main>';else if(s.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân</label><input id="court" value="'+s.match.court+'"><label>Đội A · VĐV 1</label><input id="a1" value="'+s.match.a1+'"><label>Đội A · VĐV 2</label><input id="a2" value="'+s.match.a2+'"><label>Đội B · VĐV 1</label><input id="b1" value="'+s.match.b1+'"><label>Đội B · VĐV 2</label><input id="b2" value="'+s.match.b2+'">'+B('Bắt đầu trận','start')+'</main>';else if(s.screen==='match')h='<main class="app">'+top('Điều hành trận')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+call()+'</strong></div><div class="teams"><div class="team '+(s.serving==='A'?'active':'')+'"><b>ĐỘI A</b><div class="players">'+s.match.a1+'<br>'+s.match.a2+'</div><strong class="score">'+s.a+'</strong></div><div class="team '+(s.serving==='B'?'active':'')+'"><b>ĐỘI B</b><div class="players">'+s.match.b1+'<br>'+s.match.b2+'</div><strong class="score">'+s.b+'</strong></div></div><div class="status"><b>'+serverName()+'</b> giao bóng → <b>'+receiver().name+'</b> đỡ bóng</div>'+diagram()+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="swap">⇄ Đổi sân</button></div><div class="actions">'+B('Kết thúc trận','home','danger')+'</div></main>';app.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='home'||a==='create'||a==='match')s.screen=a;else if(a==='start'){['court','a1','a2','b1','b2'].forEach(function(k){s.match[k]=document.getElementById(k).value||s.match[k]});s.screen='match'}else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;s.serverPlayer=s.serving==='A'?s.rightA:s.rightB}}else if(a==='swap'){snap();s.rightA=1-s.rightA;s.rightB=1-s.rightB}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
