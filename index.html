<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,button{font:inherit}input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;background:none;font-size:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:13px;margin:12px 0}.scorecall strong{display:block;font-size:38px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:16px;padding:10px 7px}.team.active{border:2px solid #155eef}.score{display:block;font-size:58px;font-weight:800}.players{font-size:12px;color:#667085}.status{text-align:center;font-size:13px;margin:9px}.courtTitle{display:flex;justify-content:space-between;align-items:center;margin:12px 1px 8px;font-size:12px}.legend{font-size:9px;color:#667085}.courtStage{position:relative;padding-bottom:30px}.court{position:relative;width:100%;height:185px;background:#f0f6ff;border:2px solid #155eef;border-radius:10px;overflow:hidden}.net{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#101828;z-index:2}.centerA,.centerB{position:absolute;top:50%;height:2px;background:#8fb4ef}.centerA{left:0;right:68%}.centerB{left:68%;right:0}.kA,.kB{position:absolute;top:0;bottom:0;width:18%;border-left:2px solid #8fb4ef;border-right:2px solid #8fb4ef}.kA{left:32%}.kB{left:50%}.teamLabel{position:absolute;top:7px;font-size:10px;font-weight:800;color:#667085}.la{left:8px}.lb{right:8px}.p{position:absolute;width:82px;text-align:center;transform:translate(-50%,-50%);z-index:4}.ball{width:38px;height:38px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:12px;font-weight:800}.p.server .ball{background:#155eef;color:#fff;border-color:#155eef;box-shadow:0 0 0 4px #dbe7ff}.p.receiver .ball{border:3px solid #12b76a;box-shadow:0 0 0 3px #d1fadf}.p small{display:block;background:#fff;border-radius:5px;padding:1px 3px;font-size:9px;font-weight:700;color:#344054;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:8px;font-weight:900;margin-top:1px}.server .tag{color:#155eef}.receiver .tag{color:#027a48}.al{left:13%;top:72%}.ar{left:13%;top:30%}.bl{left:87%;top:30%}.br{left:87%;top:72%}.referee{position:absolute;left:50%;bottom:0;transform:translateX(-50%);text-align:center;font-size:10px;font-weight:800}.refDot{width:22px;height:22px;border-radius:50%;background:#101828;color:#fff;display:grid;place-items:center;margin:auto;font-size:10px}.refLine{position:absolute;left:50%;bottom:22px;height:15px;border-left:1px dashed #667085}.setupHint{text-align:center;color:#667085;font-size:12px;margin:0 0 8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}.pairBox{border:1px solid #e4e7ec;border-radius:13px;padding:10px;text-align:center;font-size:11px;color:#667085}.pairBox b{display:block;color:#101828;font-size:14px;margin-top:3px}.swapSides{width:100%;height:46px;border:1px solid #d0d5dd;background:#fff;border-radius:12px;font-weight:700;margin:0 0 14px}.setupPlayer{cursor:pointer}.setupPlayer .ball{transition:.1s}.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}.modebar button{height:44px;border:1px solid #d0d5dd;background:#fff;border-radius:11px;font-weight:750}.modebar button.on{border:2px solid #155eef;color:#155eef;background:#eef4ff}.rally{display:grid;gap:9px;margin:12px 0}.rally button{min-height:62px;border:0;border-radius:15px;font-weight:750}.won{background:#155eef;color:white}.lost,.tools button{background:#f2f4f7;color:#344054}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{height:50px;border:0;border-radius:12px;font-weight:650}.actions{margin-top:14px}</style></head><body><div id="app"></div><script>(function(){var app=document.getElementById('app'),s={screen:'login',setupMode:'server',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+(b||'home')+'">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function serverName(){return names(s.serving)[s.serverPlayer]}function receivingTeam(){return s.serving==='A'?'B':'A'}function receiver(){var t=receivingTeam();return {team:t,index:s.receiverPlayer,name:names(t)[s.receiverPlayer]}}function call(){return s.serving==='A'?s.a+' – '+s.b+' – '+s.serverNo:s.b+' – '+s.a+' – '+s.serverNo}function player(team,i,pos,setup){var serv=s.serving===team&&s.serverPlayer===i,rec=receiver(),recv=rec.team===team&&rec.index===i;return '<div class="p '+pos+(serv?' server':'')+(recv?' receiver':'')+(setup?' setupPlayer':'')+'"'+(setup?' data-a="court'+team+i+'"':'')+'><div class="ball">'+team+(i+1)+'</div><small>'+names(team)[i]+'</small>'+(serv?'<div class="tag">GIAO</div>':recv?'<div class="tag">ĐỠ</div>':'')+'</div>'}function diagram(setup){var leftTeam=s.sideA==='left'?'A':'B',rightTeam=leftTeam==='A'?'B':'A';function ri(t){return t==='A'?s.rightA:s.rightB}function ti(t){return t===leftTeam?1-ri(t):ri(t)}function bi(t){return 1-ti(t)}return '<div class="courtTitle"><b>GÓC NHÌN TRỌNG TÀI CHÍNH</b><span class="legend">Xanh: giao · Xanh lá: đỡ</span></div><div class="courtStage"><div class="court"><div class="net"></div><div class="centerA"></div><div class="centerB"></div><div class="kA"></div><div class="kB"></div><span class="teamLabel la">ĐỘI '+leftTeam+'</span><span class="teamLabel lb">ĐỘI '+rightTeam+'</span>'+player(leftTeam,ti(leftTeam),'ar',setup)+player(leftTeam,bi(leftTeam),'al',setup)+player(rightTeam,ti(rightTeam),'bl',setup)+player(rightTeam,bi(rightTeam),'br',setup)+'</div><div class="refLine"></div><div class="referee"><div class="refDot">TT</div>TRỌNG TÀI</div></div>'}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}))}function setPair(t,si,ri){s.serving=t;s.serverPlayer=si;s.receiverPlayer=ri;s.serverNo=2;if(t==='A'){s.rightA=si;s.rightB=ri}else{s.rightB=si;s.rightA=ri}}function syncReceiver(){var rt=receivingTeam(),serverRight=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=rt==='A'?s.rightA:s.rightB;s.receiverPlayer=serverRight?rr:1-rr}function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p>'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><p class="muted">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><h3>Điều hành trận đấu</h3>'+B('Tạo trận đấu','create')+'</div></main>';else if(s.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân</label><input id="court" value="'+s.match.court+'"><label>Đội A · VĐV 1</label><input id="a1" value="'+s.match.a1+'"><label>Đội A · VĐV 2</label><input id="a2" value="'+s.match.a2+'"><label>Đội B · VĐV 1</label><input id="b1" value="'+s.match.b1+'"><label>Đội B · VĐV 2</label><input id="b2" value="'+s.match.b2+'">'+B('Setup trận đấu','toSetup')+'</main>';else if(s.screen==='setup')h='<main class="app">'+top('Setup trận đấu','create')+'<div class="pair"><div class="pairBox">GIAO BÓNG<b>'+serverName()+'</b></div><div class="pairBox">ĐỠ BÓNG<b>'+receiver().name+'</b></div></div><div class="modebar"><button data-a="modeServer" class="'+(s.setupMode==='server'?'on':'')+'">Chọn GIAO</button><button data-a="modeReceiver" class="'+(s.setupMode==='receiver'?'on':'')+'">Chọn ĐỠ</button></div><p class="setupHint">Chạm trực tiếp vào VĐV trên sân</p>'+diagram(true)+'<button class="swapSides" data-a="swapSetup">⇄ Đổi bên hai đội</button>'+B('Bắt đầu điều hành','beginMatch')+'</main>';else if(s.screen==='match')h='<main class="app">'+top('Điều hành trận')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+call()+'</strong></div><div class="teams"><div class="team '+(s.serving==='A'?'active':'')+'"><b>ĐỘI A</b><div class="players">'+s.match.a1+'<br>'+s.match.a2+'</div><strong class="score">'+s.a+'</strong></div><div class="team '+(s.serving==='B'?'active':'')+'"><b>ĐỘI B</b><div class="players">'+s.match.b1+'<br>'+s.match.b2+'</div><strong class="score">'+s.b+'</strong></div></div><div class="status"><b>'+serverName()+'</b> GIAO → <b>'+receiver().name+'</b> ĐỠ</div>'+diagram(false)+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="swap">⇄ Đổi sân</button></div><div class="actions">'+B('Kết thúc trận','home','danger')+'</div></main>';app.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='home'||a==='create')s.screen=a;else if(a==='toSetup'){['court','a1','a2','b1','b2'].forEach(function(k){s.match[k]=document.getElementById(k).value||s.match[k]});s.a=0;s.b=0;s.stack=[];s.sideA='left';s.setupMode='server';setPair('A',0,0);s.screen='setup'}else if(a==='modeServer')s.setupMode='server';else if(a==='modeReceiver')s.setupMode='receiver';else if(/^court[AB][01]$/.test(a)){var t=a.charAt(5),i=+a.charAt(6);if(s.setupMode==='server'){var oldReceiver=receiver();setPair(t,i,oldReceiver.team===t?0:oldReceiver.index);s.setupMode='receiver'}else if(t===receivingTeam()){s.receiverPlayer=i;if(t==='A')s.rightA=i;else s.rightB=i}}else if(a==='swapSetup')s.sideA=s.sideA==='left'?'right':'left';else if(a==='beginMatch')s.screen='match';else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}syncReceiver()}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;s.serverPlayer=s.serving==='A'?s.rightA:s.rightB}syncReceiver()}else if(a==='swap'){snap();s.sideA=s.sideA==='left'?'right':'left'}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
