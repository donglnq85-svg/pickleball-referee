<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,button{font:inherit}input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;background:none;font-size:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:7px 0 17px}.choice button{min-height:54px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;font-weight:700;padding:8px}.choice button.on{background:#eaf2ff;border:2px solid #155eef;color:#155eef}.summary{background:#f8fafc;border-radius:14px;padding:14px;margin:14px 0;font-size:13px}.setupCourt{margin:12px 0 18px}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:13px;margin:12px 0}.scorecall strong{display:block;font-size:38px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:16px;padding:10px 7px}.team.active{border:2px solid #155eef}.score{display:block;font-size:58px;font-weight:800}.players{font-size:12px;color:#667085}.status{text-align:center;font-size:13px;margin:9px}.courtTitle{display:flex;justify-content:space-between;align-items:center;margin:16px 1px 8px;font-size:13px}.legend{font-size:10px;color:#667085}.courtStage{position:relative;padding-bottom:30px}.court{position:relative;width:100%;height:185px;background:#f0f6ff;border:2px solid #155eef;border-radius:10px;overflow:hidden}.net{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#101828;z-index:2}.centerA,.centerB{position:absolute;top:50%;height:2px;background:#8fb4ef}.centerA{left:0;right:60%}.centerB{left:60%;right:0}.kA,.kB{position:absolute;top:0;bottom:0;width:18%;border-left:2px solid #8fb4ef;border-right:2px solid #8fb4ef}.kA{left:32%}.kB{left:50%}.teamLabel{position:absolute;top:7px;font-size:10px;font-weight:800;color:#667085}.la{left:8px}.lb{right:8px}.p{position:absolute;width:78px;text-align:center;transform:translate(-50%,-50%);z-index:4}.ball{width:34px;height:34px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:12px;font-weight:800}.p.server .ball{background:#155eef;color:#fff;border-color:#155eef;box-shadow:0 0 0 4px #dbe7ff}.p.receiver .ball{border:3px solid #12b76a;box-shadow:0 0 0 3px #d1fadf}.p small{display:block;background:#fff;border-radius:5px;padding:1px 3px;font-size:9px;font-weight:700;color:#344054;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:8px;font-weight:900;margin-top:1px}.server .tag{color:#155eef}.receiver .tag{color:#027a48}.al{left:13%;top:72%}.ar{left:13%;top:30%}.bl{left:87%;top:30%}.br{left:87%;top:72%}.referee{position:absolute;left:50%;bottom:0;transform:translateX(-50%);text-align:center;font-size:10px;font-weight:800}.refDot{width:22px;height:22px;border-radius:50%;background:#101828;color:#fff;display:grid;place-items:center;margin:auto;font-size:10px}.refLine{position:absolute;left:50%;bottom:22px;height:15px;border-left:1px dashed #667085}.rally{display:grid;gap:9px;margin:12px 0}.rally button{min-height:62px;border:0;border-radius:15px;font-weight:750}.won{background:#155eef;color:white}.lost,.tools button{background:#f2f4f7;color:#344054}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{height:50px;border:0;border-radius:12px;font-weight:650}.actions{margin-top:14px}</style></head><body><div id="app"></div><script>(function(){var app=document.getElementById('app'),s={screen:'login',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+(b||'home')+'">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function serverName(){return names(s.serving)[s.serverPlayer]}function receivingTeam(){return s.serving==='A'?'B':'A'}function receiver(){var t=receivingTeam();return {team:t,index:s.receiverPlayer,name:names(t)[s.receiverPlayer]}}function call(){return s.serving==='A'?s.a+' – '+s.b+' – '+s.serverNo:s.b+' – '+s.a+' – '+s.serverNo}function player(team,i,pos){var serv=s.serving===team&&s.serverPlayer===i,rec=receiver(),recv=rec.team===team&&rec.index===i;return '<div class="p '+pos+(serv?' server':'')+(recv?' receiver':'')+'"><div class="ball">'+team+(i+1)+'</div><small>'+names(team)[i]+'</small>'+(serv?'<div class="tag">GIAO</div>':recv?'<div class="tag">ĐỠ</div>':'')+'</div>'}function diagram(){var leftTeam=s.sideA==='left'?'A':'B',rightTeam=leftTeam==='A'?'B':'A';function rightIdx(t){return t==='A'?s.rightA:s.rightB}function topIdx(t){return t===leftTeam?1-rightIdx(t):rightIdx(t)}function bottomIdx(t){return 1-topIdx(t)}return '<div class="courtTitle"><b>GÓC NHÌN TRỌNG TÀI CHÍNH</b><span class="legend">Xanh: giao · Viền xanh lá: đỡ</span></div><div class="courtStage"><div class="court"><div class="net"></div><div class="centerA"></div><div class="centerB"></div><div class="kA"></div><div class="kB"></div><span class="teamLabel la">ĐỘI '+leftTeam+'</span><span class="teamLabel lb">ĐỘI '+rightTeam+'</span>'+player(leftTeam,topIdx(leftTeam),'ar')+player(leftTeam,bottomIdx(leftTeam),'al')+player(rightTeam,topIdx(rightTeam),'bl')+player(rightTeam,bottomIdx(rightTeam),'br')+'</div><div class="refLine"></div><div class="referee"><div class="refDot">TT</div>TRỌNG TÀI</div></div>'}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}))}function setPair(serverTeam,si,ri){s.serving=serverTeam;s.serverPlayer=si;s.receiverPlayer=ri;s.serverNo=2;if(serverTeam==='A'){s.rightA=si;s.rightB=ri}else{s.rightB=si;s.rightA=ri}}function syncReceiver(){var rt=receivingTeam(),serverRight=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=rt==='A'?s.rightA:s.rightB;s.receiverPlayer=serverRight?rr:1-rr}function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p>'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><p class="muted">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><h3>Điều hành trận đấu</h3>'+B('Tạo trận đấu','create')+'</div></main>';else if(s.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân</label><input id="court" value="'+s.match.court+'"><label>Đội A · VĐV 1</label><input id="a1" value="'+s.match.a1+'"><label>Đội A · VĐV 2</label><input id="a2" value="'+s.match.a2+'"><label>Đội B · VĐV 1</label><input id="b1" value="'+s.match.b1+'"><label>Đội B · VĐV 2</label><input id="b2" value="'+s.match.b2+'">'+B('Tiếp tục setup trận','toSetup')+'</main>';else if(s.screen==='setup'){var rt=receivingTeam(),rn=names(rt);h='<main class="app">'+top('Setup trận đấu','create')+'<p class="muted">Thiết lập đúng những gì trọng tài chính nhìn thấy trước điểm đầu tiên.</p><label><b>Người giao bóng</b></label><div class="choice"><button data-a="srvA0" class="'+(s.serving==='A'&&s.serverPlayer===0?'on':'')+'">'+s.match.a1+'</button><button data-a="srvA1" class="'+(s.serving==='A'&&s.serverPlayer===1?'on':'')+'">'+s.match.a2+'</button><button data-a="srvB0" class="'+(s.serving==='B'&&s.serverPlayer===0?'on':'')+'">'+s.match.b1+'</button><button data-a="srvB1" class="'+(s.serving==='B'&&s.serverPlayer===1?'on':'')+'">'+s.match.b2+'</button></div><label><b>Người đỡ bóng</b> · Đội '+rt+'</label><div class="choice"><button data-a="rec0" class="'+(s.receiverPlayer===0?'on':'')+'">'+rn[0]+'</button><button data-a="rec1" class="'+(s.receiverPlayer===1?'on':'')+'">'+rn[1]+'</button></div><label><b>Vị trí hai đội theo góc nhìn trọng tài</b></label><div class="choice"><button data-a="sideALeft" class="'+(s.sideA==='left'?'on':'')+'">Đội A bên trái<br>Đội B bên phải</button><button data-a="sideARight" class="'+(s.sideA==='right'?'on':'')+'">Đội B bên trái<br>Đội A bên phải</button></div><div class="setupCourt">'+diagram()+'</div><div class="summary"><b>Kiểm tra trước trận</b><br><b>'+serverName()+'</b> giao → <b>'+receiver().name+'</b> đỡ<br>Điểm bắt đầu: <b>0 – 0 – 2</b></div>'+B('Bắt đầu điều hành','beginMatch')+'</main>'}else if(s.screen==='match')h='<main class="app">'+top('Điều hành trận')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+call()+'</strong></div><div class="teams"><div class="team '+(s.serving==='A'?'active':'')+'"><b>ĐỘI A</b><div class="players">'+s.match.a1+'<br>'+s.match.a2+'</div><strong class="score">'+s.a+'</strong></div><div class="team '+(s.serving==='B'?'active':'')+'"><b>ĐỘI B</b><div class="players">'+s.match.b1+'<br>'+s.match.b2+'</div><strong class="score">'+s.b+'</strong></div></div><div class="status"><b>'+serverName()+'</b> GIAO → <b>'+receiver().name+'</b> ĐỠ</div>'+diagram()+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="swap">⇄ Đổi sân</button></div><div class="actions">'+B('Kết thúc trận','home','danger')+'</div></main>';app.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(a==='home'||a==='create'||a==='match'||a==='setup')s.screen=a;else if(a==='toSetup'){['court','a1','a2','b1','b2'].forEach(function(k){s.match[k]=document.getElementById(k).value||s.match[k]});s.a=0;s.b=0;s.stack=[];s.sideA='left';setPair('A',0,0);s.screen='setup'}else if(/^srv[AB][01]$/.test(a)){var t=a.charAt(3),i=+a.charAt(4);setPair(t,i,0)}else if(a==='rec0'||a==='rec1'){s.receiverPlayer=a==='rec0'?0:1;var rt=receivingTeam();if(rt==='A')s.rightA=s.receiverPlayer;else s.rightB=s.receiverPlayer}else if(a==='sideALeft')s.sideA='left';else if(a==='sideARight')s.sideA='right';else if(a==='beginMatch')s.screen='match';else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}syncReceiver()}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;s.serverPlayer=s.serving==='A'?s.rightA:s.rightB}syncReceiver()}else if(a==='swap'){snap();s.sideA=s.sideA==='left'?'right':'left'}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
