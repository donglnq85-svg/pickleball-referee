<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overscroll-behavior:none}.app{max-width:430px;height:100dvh;margin:auto;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));overflow:hidden;display:grid;grid-template-rows:auto auto auto auto auto auto auto auto 1fr;gap:7px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}button{font:inherit}.btn{width:100%;min-height:52px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px}.top{display:flex;align-items:center}.top h2{font-size:22px;line-height:1.1;margin:0}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:13px;padding:7px;margin:0}.scorecall small{font-size:11px}.scorecall strong{display:block;font-size:34px;line-height:1.05}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:13px;padding:6px}.team.active{border:2px solid #155eef}.team b{font-size:13px}.score{display:block;font-size:44px;line-height:1;font-weight:800}.players{font-size:11px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{text-align:center;font-size:13px;margin:0}.courtWrap{padding:0 20px 18px}.court{position:relative;width:100%;aspect-ratio:2.2/1;background:#f0f6ff;border:2px solid #155eef;border-radius:8px;margin:0}.net{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#101828;z-index:2}.nvzL,.nvzR{position:absolute;top:0;bottom:0;width:15.91%;background:rgba(21,94,239,.05)}.nvzL{right:50%;border-left:2px solid #8fb4ef}.nvzR{left:50%;border-right:2px solid #8fb4ef}.centerL,.centerR{position:absolute;top:50%;height:2px;background:#8fb4ef}.centerL{left:0;right:65.91%}.centerR{left:65.91%;right:0}.p{position:absolute;width:82px;text-align:center;transform:translate(-50%,-50%);z-index:3}.ball{width:36px;height:36px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:11px;font-weight:800}.server .ball{background:#155eef;color:#fff;border-color:#155eef}.receiver .ball{border:3px solid #12b76a}.p small{display:block;background:#fff;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:8px;font-weight:900}.al{left:13%;top:72%}.ar{left:13%;top:28%}.bl{left:87%;top:28%}.br{left:87%;top:72%}.ref{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:9px;font-weight:800;white-space:nowrap}.rally{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rally button{height:52px;border:0;border-radius:12px;font-size:13px;font-weight:750;padding:5px 8px}.won{background:#155eef;color:#fff}.lost{background:#f2f4f7}.teamBreaks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.breakCol{border:1px solid #e4e7ec;border-radius:10px;padding:5px}.breakTitle{text-align:center;font-size:11px;font-weight:800;color:#667085;margin-bottom:4px}.breakBtns{display:grid;grid-template-columns:1fr;gap:4px}.breakBtns button{height:32px;padding:0 4px;border:1px solid #d0d5dd;background:#fff;border-radius:7px;font-size:11px;font-weight:750;color:#475467}.breakBtns button.used{background:#f2f4f7;color:#98a2b3;text-decoration:line-through}.medicalIcon{color:#d92d20;font-weight:900}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{height:40px;border:1px solid #d0d5dd;background:#fff;border-radius:9px;font-size:13px;font-weight:700}.cancel{width:100%;height:36px;border:1px solid #f04438;border-radius:9px;background:#fff;color:#d92d20;font-size:12px;font-weight:750}.modal{position:fixed;inset:0;background:rgba(16,24,40,.48);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.dialog{width:100%;max-width:394px;background:#fff;border-radius:18px;padding:20px}.dialog h3{margin-bottom:8px}.dialog p{font-size:14px;color:#667085}.timerNum{text-align:center;font-size:64px;font-weight:850;margin:18px 0}.dialogActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogActions button{height:52px;border-radius:12px;font-weight:750}.keep{border:1px solid #d0d5dd;background:#fff}.confirmCancel{border:0;background:#d92d20;color:#fff}@media(max-height:760px){.app{gap:5px;padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:calc(7px + env(safe-area-inset-bottom))}.top h2{font-size:19px}.scorecall{padding:5px}.scorecall strong{font-size:30px}.score{font-size:38px}.players{font-size:10px}.status{font-size:11px}.courtWrap{padding:0 30px 15px}.ball{width:32px;height:32px;font-size:10px}.p small{font-size:9px}.rally button{height:45px;font-size:11px}.breakTitle{font-size:10px}.breakBtns button{height:27px;font-size:10px}.tools button{height:34px;font-size:11px}.cancel{height:30px;font-size:11px}}</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),timer=null,s={a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],confirmCancel:false,timerType:'',timerTeam:'',timerLeft:0,used:{A:{timeout:false,medical:false},B:{timeout:false,medical:false}},match:{a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rn(){return names(s.serving)[s.serverPlayer]}function rt(){return s.serving==='A'?'B':'A'}function rec(){return {team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function player(t,i,pos){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i;return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'"><div class="ball">'+t+(i+1)+'</div><small>'+names(t)[i]+'</small>'+(sv?'<div class="tag">GIAO</div>':rv?'<div class="tag">ĐỠ</div>':'')+'</div>'}function court(){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=function(t){return t==='A'?s.rightA:s.rightB},ti=function(t){return t===l?1-ri(t):ri(t)},bi=function(t){return 1-ti(t)};return '<div class="courtWrap"><div class="court"><div class="nvzL"></div><div class="nvzR"></div><div class="centerL"></div><div class="centerR"></div><div class="net"></div>'+player(l,ti(l),'ar')+player(l,bi(l),'al')+player(r,ti(r),'bl')+player(r,bi(r),'br')+'<div class="ref">TRỌNG TÀI CHÍNH</div></div></div>'}function teamCard(t){return '<div class="team '+(s.serving===t?'active':'')+'"><b>ĐỘI '+t+'</b><div class="players">'+names(t).join(' · ')+'</div><strong class="score">'+(t==='A'?s.a:s.b)+'</strong></div>'}function sync(){var t=rt(),sr=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=t==='A'?s.rightA:s.rightB;s.receiverPlayer=sr?rr:1-rr}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA,used:s.used}))}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function startTimer(team,type,sec){if(s.used[team][type])return;s.used[team][type]=true;clearInterval(timer);s.timerTeam=team;s.timerType=type;s.timerLeft=sec;render();timer=setInterval(function(){if(s.timerLeft>0){s.timerLeft--;render()}else clearInterval(timer)},1000)}function stopTimer(){clearInterval(timer);timer=null;s.timerType='';s.timerTeam='';s.timerLeft=0;render()}function breakCol(t){function b(type,label){var u=s.used[t][type],icon=type==='timeout'?'⏱':'<span class="medicalIcon">✚</span>';return '<button class="'+(u?'used':'')+'" '+(u?'disabled':'data-a="'+type+t+'"')+'>'+icon+' '+label+(u?' · Đã dùng':'')+'</button>'}return '<div class="breakCol"><div class="breakTitle">ĐỘI '+t+'</div><div class="breakBtns">'+b('timeout','Time-out (1 phút)')+b('medical','Y tế (3 phút)')+'</div></div>'}function render(){var left=s.sideA==='left'?'A':'B',right=left==='A'?'B':'A',h='<main class="app"><div class="top"><h2>Điều hành trận</h2></div><div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+(s.serving==='A'?s.a+' – '+s.b:s.b+' – '+s.a)+' – '+s.serverNo+'</strong></div><div class="teams">'+teamCard(left)+teamCard(right)+'</div><div class="status"><b>'+rn()+'</b> GIAO → <b>'+rec().name+'</b> ĐỠ</div>'+court()+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="teamBreaks">'+breakCol(left)+breakCol(right)+'</div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="swap">⇄ Đổi sân</button></div><button class="cancel" data-a="cancelMatch">Huỷ trận đấu</button></main>';if(s.timerType)h+='<div class="modal"><div class="dialog"><h3>Đội '+s.timerTeam+' · '+(s.timerType==='timeout'?'Time-out':'Y tế')+'</h3><p>'+(s.timerType==='timeout'?'Thời gian nghỉ 1 phút':'Thời gian y tế 3 phút')+'</p><div class="timerNum">'+fmt(s.timerLeft)+'</div><button class="btn" data-a="stopTimer">'+(s.timerLeft?'Kết thúc sớm':'Tiếp tục trận')+'</button></div></div>';if(s.confirmCancel)h+='<div class="modal"><div class="dialog"><h3>Huỷ trận đấu?</h3><p>Điểm số và diễn biến hiện tại sẽ bị huỷ.</p><div class="dialogActions"><button class="keep" data-a="keepMatch">Tiếp tục trận</button><button class="confirmCancel" data-a="confirmCancel">Huỷ trận</button></div></div></div>';A.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(/^timeout[AB]$/.test(a))startTimer(a.slice(-1),'timeout',60);else if(/^medical[AB]$/.test(a))startTimer(a.slice(-1),'medical',180);else if(a==='stopTimer')stopTimer();else if(a==='cancelMatch')s.confirmCancel=true;else if(a==='keepMatch')s.confirmCancel=false;else if(a==='confirmCancel'){clearInterval(timer);location.reload()}else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}sync()}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;var sc=s.serving==='A'?s.a:s.b,rr=s.serving==='A'?s.rightA:s.rightB;s.serverPlayer=sc%2===0?rr:1-rr}sync()}else if(a==='swap'){snap();s.sideA=s.sideA==='left'?'right':'left'}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
