<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}h1,h2,h3,p{margin-top:0}small,.muted{color:#667085}button,input,textarea{font:inherit}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:none;font-size:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.field{margin:0 0 18px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:13px;background:#fff}.input{height:52px}textarea{height:92px;resize:none}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg.three{grid-template-columns:repeat(3,1fr)}.seg button{min-height:48px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font-weight:700}.seg button.on{border:2px solid #155eef;background:#eef4ff;color:#155eef}.hint{font-size:12px;color:#667085;margin:7px 0 0}.step{font-size:12px;color:#667085;margin-bottom:5px}.scoreStart{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.scoreStart .dash{font-weight:800}.mini>label{text-align:center}.stepper{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border:1px solid #d0d5dd;border-radius:12px;overflow:hidden;height:54px}.stepper button{height:100%;border:0;background:#f2f4f7;font-size:26px;font-weight:700;color:#344054}.stepper input{width:100%;height:100%;border:0;text-align:center;font-size:22px;font-weight:800;outline:none;padding:0}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}.scorecall{text-align:center;background:#101828;color:#fff;border-radius:16px;padding:13px;margin:12px 0}.scorecall strong{display:block;font-size:38px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.team{border:1px solid #e4e7ec;border-radius:16px;padding:10px}.team.active{border:2px solid #155eef}.score{display:block;font-size:58px;font-weight:800}.players{font-size:12px;color:#667085}.status{text-align:center;font-size:13px;margin:10px}.court{position:relative;height:185px;background:#f0f6ff;border:2px solid #155eef;border-radius:10px;margin:12px 0 42px}.net{position:absolute;left:50%;top:0;bottom:0;width:4px;background:#101828}.mid{position:absolute;top:50%;left:0;right:0;border-top:2px solid #8fb4ef}.p{position:absolute;width:82px;text-align:center;transform:translate(-50%,-50%)}.ball{width:38px;height:38px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;border:2px solid #98a2b3;font-size:12px;font-weight:800}.server .ball{background:#155eef;color:#fff;border-color:#155eef}.receiver .ball{border:3px solid #12b76a}.p small{display:block;background:#fff;font-size:9px;font-weight:700}.tag{font-size:8px;font-weight:900}.al{left:13%;top:72%}.ar{left:13%;top:30%}.bl{left:87%;top:30%}.br{left:87%;top:72%}.ref{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);font-size:10px;font-weight:800}.setupbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.setupbar button,.swap,.tools button{height:48px;border:1px solid #d0d5dd;background:#fff;border-radius:11px;font-weight:700}.setupbar button.on{border:2px solid #155eef;color:#155eef;background:#eef4ff}.swap{width:100%;margin-bottom:16px}.rally{display:grid;gap:9px;margin:12px 0}.rally button{min-height:62px;border:0;border-radius:15px;font-weight:750}.won{background:#155eef;color:#fff}.lost{background:#f2f4f7}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),s={screen:'login',type:'double',sets:1,winPoints:11,customPoints:21,startA:0,startB:0,note:'',setupMode:'server',a:0,b:0,serving:'A',serverNo:2,serverPlayer:0,receiverPlayer:0,rightA:0,rightB:0,sideA:'left',stack:[],match:{court:'Sân 1',a1:'Nguyễn An',a2:'Trần Bình',b1:'Lê Minh',b2:'Phạm Huy'}};function B(t,a){return '<button class="btn" data-a="'+a+'">'+t+'</button>'}function top(t,b){return '<div class="top"><button class="back" data-a="'+b+'">‹</button><h2 style="margin:0">'+t+'</h2></div>'}function names(t){return t==='A'?[s.match.a1,s.match.a2]:[s.match.b1,s.match.b2]}function rn(){return names(s.serving)[s.serverPlayer]}function rt(){return s.serving==='A'?'B':'A'}function rec(){return {team:rt(),index:s.receiverPlayer,name:names(rt())[s.receiverPlayer]}}function player(t,i,pos,setup){var sv=s.serving===t&&s.serverPlayer===i,r=rec(),rv=r.team===t&&r.index===i;return '<div class="p '+pos+(sv?' server':'')+(rv?' receiver':'')+'"'+(setup?' data-a="court'+t+i+'"':'')+'><div class="ball">'+t+(i+1)+'</div><small>'+names(t)[i]+'</small>'+(sv?'<div class="tag">GIAO</div>':rv?'<div class="tag">ĐỠ</div>':'')+'</div>'}function court(setup){var l=s.sideA==='left'?'A':'B',r=l==='A'?'B':'A',ri=function(t){return t==='A'?s.rightA:s.rightB},ti=function(t){return t===l?1-ri(t):ri(t)},bi=function(t){return 1-ti(t)};return '<div class="court"><div class="net"></div><div class="mid"></div>'+player(l,ti(l),'ar',setup)+player(l,bi(l),'al',setup)+player(r,ti(r),'bl',setup)+player(r,bi(r),'br',setup)+'<div class="ref">TRỌNG TÀI CHÍNH</div></div>'}function setPair(t,si,ri){s.serving=t;s.serverPlayer=si;s.receiverPlayer=ri;s.serverNo=2;if(t==='A'){s.rightA=si;s.rightB=ri}else{s.rightB=si;s.rightA=ri}}function sync(){var t=rt(),sr=(s.serving==='A'?s.rightA:s.rightB)===s.serverPlayer,rr=t==='A'?s.rightA:s.rightB;s.receiverPlayer=sr?rr:1-rr}function snap(){s.stack.push(JSON.stringify({a:s.a,b:s.b,serving:s.serving,serverNo:s.serverNo,serverPlayer:s.serverPlayer,receiverPlayer:s.receiverPlayer,rightA:s.rightA,rightB:s.rightB,sideA:s.sideA}))}function stepper(team,val){return '<div class="stepper"><button data-a="minus'+team+'">−</button><input id="start'+team+'" type="number" min="0" value="'+val+'"><button data-a="plus'+team+'">+</button></div>'}function teamCard(t){var active=s.serving===t,score=t==='A'?s.a:s.b;return '<div class="team '+(active?'active':'')+'"><b>ĐỘI '+t+'</b><div class="players">'+names(t).join(' · ')+'</div><strong class="score">'+score+'</strong></div>'}function render(){var h='';if(s.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Trợ lý điều hành trận đấu</p>'+B('Đăng nhập','home')+'</div></main>';else if(s.screen==='home')h='<main class="app"><h1>Trọng tài</h1><div class="card"><h3>Điều hành trận đấu</h3>'+B('Tạo trận đấu','info')+'</div></main>';else if(s.screen==='info')h='<main class="app">'+top('Thông tin trận đấu','home')+'<div class="step">SETUP 1/2</div><div class="field"><label>Hình thức thi đấu</label><div class="seg"><button data-a="double" class="'+(s.type==='double'?'on':'')+'">Đánh đôi</button><button data-a="single" class="'+(s.type==='single'?'on':'')+'">Đánh đơn</button></div></div><div class="field"><label>1. Số set</label><div class="seg three"><button data-a="set1" class="'+(s.sets===1?'on':'')+'">1 set</button><button data-a="set3" class="'+(s.sets===3?'on':'')+'">3 set</button><button data-a="set5" class="'+(s.sets===5?'on':'')+'">5 set</button></div></div><div class="field"><label>2. Điểm thắng</label><div class="seg three"><button data-a="p11" class="'+(s.winPoints===11?'on':'')+'">11</button><button data-a="p15" class="'+(s.winPoints===15?'on':'')+'">15</button><button data-a="pOther" class="'+(s.winPoints==='other'?'on':'')+'">Khác</button></div>'+(s.winPoints==='other'?'<input class="input" id="customPoints" type="number" min="1" value="'+s.customPoints+'" style="margin-top:8px" placeholder="Nhập điểm thắng">':'')+'</div><div class="field"><label>3. Điểm khởi đầu</label><div class="scoreStart"><div class="mini"><label>Đội A</label>'+stepper('A',s.startA)+'</div><div class="dash">–</div><div class="mini"><label>Đội B</label>'+stepper('B',s.startB)+'</div></div><p class="hint">Dùng khi một bên được chấp điểm. Ví dụ: Đội A 0 – Đội B 3.</p></div><div class="field"><label>Ghi chú</label><textarea id="note" placeholder="Ghi chú cho trận đấu...">'+s.note+'</textarea></div>'+B('Tiếp tục','saveInfo')+'</main>';else if(s.screen==='create')h='<main class="app">'+top('VĐV & sân','info')+'<div class="step">SETUP 2/2</div><div class="field"><label>Sân</label><input class="input" id="court" value="'+s.match.court+'"></div><div class="field"><label>Đội A</label><input class="input" id="a1" value="'+s.match.a1+'"><input class="input" id="a2" value="'+s.match.a2+'"></div><div class="field"><label>Đội B</label><input class="input" id="b1" value="'+s.match.b1+'"><input class="input" id="b2" value="'+s.match.b2+'"></div>'+B('Setup vị trí trên sân','toSetup')+'</main>';else if(s.screen==='setup')h='<main class="app">'+top('Setup vị trí','create')+'<div class="setupbar"><button data-a="modeServer" class="'+(s.setupMode==='server'?'on':'')+'">GIAO · '+rn()+'</button><button data-a="modeReceiver" class="'+(s.setupMode==='receiver'?'on':'')+'">ĐỠ · '+rec().name+'</button></div>'+court(true)+'<button class="swap" data-a="swapSetup">⇄ Đổi bên hai đội</button>'+B('Bắt đầu điều hành','begin')+'</main>';else if(s.screen==='match'){var left=s.sideA==='left'?'A':'B',right=left==='A'?'B':'A';h='<main class="app">'+top('Điều hành trận','home')+'<div class="scorecall"><small>XƯỚNG ĐIỂM</small><strong>'+(s.serving==='A'?s.a+' – '+s.b:s.b+' – '+s.a)+' – '+s.serverNo+'</strong></div><div class="teams">'+teamCard(left)+teamCard(right)+'</div><div class="status"><b>'+rn()+'</b> GIAO → <b>'+rec().name+'</b> ĐỠ</div>'+court(false)+'<div class="rally"><button class="won" data-a="win">Đội giao bóng thắng rally</button><button class="lost" data-a="lose">Đội giao bóng thua rally</button></div><div class="tools"><button data-a="undo">↶ Hoàn tác</button><button data-a="swap">⇄ Đổi sân</button></div></main>'}A.innerHTML=h}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;var a=x.dataset.a;if(['home','info','create'].indexOf(a)>=0)s.screen=a;else if(a==='double'||a==='single')s.type=a;else if(a==='set1')s.sets=1;else if(a==='set3')s.sets=3;else if(a==='set5')s.sets=5;else if(a==='p11')s.winPoints=11;else if(a==='p15')s.winPoints=15;else if(a==='pOther')s.winPoints='other';else if(a==='minusA'||a==='plusA'||a==='minusB'||a==='plusB'){var team=a.slice(-1),el=document.getElementById('start'+team),v=Math.max(0,(+el.value||0)+(a.indexOf('plus')===0?1:-1));if(team==='A')s.startA=v;else s.startB=v;el.value=v;return}else if(a==='saveInfo'){if(s.winPoints==='other')s.customPoints=Math.max(1,+document.getElementById('customPoints').value||1);s.startA=Math.max(0,+document.getElementById('startA').value||0);s.startB=Math.max(0,+document.getElementById('startB').value||0);s.note=document.getElementById('note').value;s.screen='create'}else if(a==='toSetup'){['court','a1','a2','b1','b2'].forEach(function(k){var el=document.getElementById(k);if(el&&el.value)s.match[k]=el.value});s.a=s.startA;s.b=s.startB;s.stack=[];s.sideA='left';s.setupMode='server';setPair('A',0,0);s.screen='setup'}else if(a==='modeServer')s.setupMode='server';else if(a==='modeReceiver')s.setupMode='receiver';else if(/^court[AB][01]$/.test(a)){var t=a.charAt(5),i=+a.charAt(6);if(s.setupMode==='server'){setPair(t,i,0);s.setupMode='receiver'}else if(t===rt()){s.receiverPlayer=i;if(t==='A')s.rightA=i;else s.rightB=i}}else if(a==='swapSetup')s.sideA=s.sideA==='left'?'right':'left';else if(a==='begin')s.screen='match';else if(a==='win'){snap();if(s.serving==='A'){s.a++;s.rightA=1-s.rightA}else{s.b++;s.rightB=1-s.rightB}sync()}else if(a==='lose'){snap();if(s.serverNo===1){s.serverNo=2;s.serverPlayer=1-s.serverPlayer}else{s.serving=s.serving==='A'?'B':'A';s.serverNo=1;var sc=s.serving==='A'?s.a:s.b,rr=s.serving==='A'?s.rightA:s.rightB;s.serverPlayer=sc%2===0?rr:1-rr}sync()}else if(a==='swap'){snap();s.sideA=s.sideA==='left'?'right':'left'}else if(a==='undo'&&s.stack.length)Object.assign(s,JSON.parse(s.stack.pop()));render()});render()})();</script></body></html>
