<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Pickleball Referee</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin-top:0}h1{font-size:32px;line-height:1.05}h2{font-size:26px}small,.muted{color:#667085}.center{display:flex;min-height:85vh;align-items:center}.full{width:100%}input,select,button{font:inherit}input,select{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 14px;margin:7px 0 16px;background:#fff;font-size:16px}label{font-size:14px;font-weight:700}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#155eef;color:#fff;font-weight:750;font-size:17px;padding:12px}.secondary{background:#f2f4f7;color:#344054}.danger{background:#fff;color:#b42318;border:1px solid #fecdca}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{border:0;background:none;font-size:28px;padding:0 8px 0 0}.card{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.menu{width:100%;border:0;border-bottom:1px solid #eaecf0;background:#fff;padding:19px 2px;text-align:left;font-weight:650;font-size:17px}.menu span{float:right}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin:20px 0 10px}.team{border:1px solid #e4e7ec;border-radius:16px;padding:14px 8px}.team.active{border:2px solid #155eef}.score{display:block;font-size:76px;line-height:1;font-weight:800;margin:14px 0}.serve{display:inline-block;background:#eff4ff;color:#155eef;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700}.scorebuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.scorebuttons button{height:76px;border:0;border-radius:16px;background:#f2f4f7;font-size:34px;font-weight:700}.scorebuttons small{display:block;font-size:12px}.actions{display:grid;gap:10px;margin-top:16px}.games{display:flex;gap:8px;margin:12px 0}.pill{background:#f2f4f7;border-radius:9px;padding:8px 10px;font-size:13px}.winner{text-align:center;padding:30px 0}.winner strong{font-size:52px}.notice{background:#ecfdf3;color:#027a48;padding:12px;border-radius:10px;margin-bottom:16px;font-size:14px}
</style>
</head><body><div id="app"></div>
<script>
(function(){
var app=document.getElementById('app');var state={screen:'login',a:0,b:0,server:'A',game:1,games:[],history:[],undo:null,match:{court:'Sân 1',type:'Đôi',a:'Nguyễn An / Trần Bình',b:'Lê Minh / Phạm Huy',win:11}};
function save(){try{localStorage.setItem('pr-v1',JSON.stringify({history:state.history}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem('pr-v1'));if(x&&x.history)state.history=x.history}catch(e){}}load();
function btn(t,a,c){return '<button class="btn '+(c||'')+'" data-a="'+a+'">'+t+'</button>'}function top(t){return '<div class="top"><button class="back" data-a="home">‹</button><h2 style="margin:0">'+t+'</h2></div>'}
function render(){var h='';
if(state.screen==='login')h='<main class="app center"><div class="full"><h1>PICKLEBALL<br>REFEREE</h1><p class="muted">Công cụ điều hành trận đấu cho trọng tài</p><input placeholder="Số điện thoại" inputmode="tel"><input placeholder="Mật khẩu" type="password">'+btn('Đăng nhập','home')+'<p class="muted" style="text-align:center;margin-top:14px;font-size:13px">Bản thử nghiệm Core Match</p></div></main>';
else if(state.screen==='home')h='<main class="app"><p class="muted" style="margin-bottom:5px">PICKLEBALL REFEREE</p><h1>Trọng tài</h1><div class="card"><small>SẴN SÀNG ĐIỀU HÀNH</small><h3 style="margin:10px 0">Tạo một trận mới</h3><p class="muted">Thiết lập trận đấu và bắt đầu ghi điểm.</p>'+btn('Tạo trận đấu','create')+'</div><button class="menu" data-a="history">Lịch sử trận đấu <span>›</span></button><button class="menu" data-a="profile">Hồ sơ trọng tài <span>›</span></button></main>';
else if(state.screen==='create')h='<main class="app">'+top('Tạo trận đấu')+'<label>Sân thi đấu</label><input id="court" value="'+state.match.court+'"><label>Hình thức</label><select id="type"><option>Đôi</option><option>Đơn</option></select><label>Đội A</label><input id="ta" value="'+state.match.a+'"><label>Đội B</label><input id="tb" value="'+state.match.b+'"><label>Điểm thắng game</label><select id="win"><option value="11">11 điểm</option><option value="15">15 điểm</option><option value="21">21 điểm</option></select>'+btn('Bắt đầu trận','start')+'</main>';
else if(state.screen==='match'){var ga=state.games.map(function(g,i){return '<span class="pill">G'+(i+1)+': '+g.a+'–'+g.b+'</span>'}).join('');h='<main class="app">'+top('Điều hành trận')+'<div class="row"><small>'+state.match.court+' · Game '+state.game+'</small><small>'+state.match.type+'</small></div><div class="games">'+ga+'</div><div class="teams"><div class="team '+(state.server==='A'?'active':'')+'"><b>ĐỘI A</b><p class="muted" style="font-size:13px">'+state.match.a+'</p><strong class="score">'+state.a+'</strong>'+(state.server==='A'?'<span class="serve">● GIAO BÓNG</span>':'')+'</div><div class="team '+(state.server==='B'?'active':'')+'"><b>ĐỘI B</b><p class="muted" style="font-size:13px">'+state.match.b+'</p><strong class="score">'+state.b+'</strong>'+(state.server==='B'?'<span class="serve">● GIAO BÓNG</span>':'')+'</div></div><div class="scorebuttons"><button data-a="a+">＋<small>Điểm A</small></button><button data-a="b+">＋<small>Điểm B</small></button></div><div class="scorebuttons"><button data-a="serve">⇄<small>Đổi giao bóng</small></button><button data-a="undo">↶<small>Hoàn tác</small></button></div><div class="actions">'+btn('Kết thúc game','endgame','secondary')+btn('Kết thúc trận','endmatch','danger')+'</div></main>'}
else if(state.screen==='gameend')h='<main class="app center"><div class="full winner"><p class="muted">KẾT THÚC GAME '+state.game+'</p><strong>'+state.a+' – '+state.b+'</strong><h2 style="margin-top:22px">'+(state.a>state.b?'Đội A':state.b>state.a?'Đội B':'Chưa có đội thắng')+'</h2><div class="actions">'+btn('Xác nhận & chơi game tiếp','nextgame')+btn('Quay lại điều hành','match','secondary')+'</div></div></main>';
else if(state.screen==='matchend'){var sa=0,sb=0;state.games.forEach(function(g){if(g.a>g.b)sa++;else if(g.b>g.a)sb++});h='<main class="app center"><div class="full winner"><div class="notice">Trận đấu đã được lưu vào lịch sử</div><p class="muted">KẾT THÚC TRẬN</p><strong>'+sa+' – '+sb+'</strong><h2 style="margin-top:20px">'+(sa>sb?'Đội A thắng':sb>sa?'Đội B thắng':'Trận chưa phân thắng bại')+'</h2><div class="actions">'+btn('Về trang chủ','home')+'</div></div></main>'}
else if(state.screen==='history')h='<main class="app">'+top('Lịch sử trận đấu')+(state.history.length?state.history.slice().reverse().map(function(x){return '<div class="card"><b>'+x.a+' vs '+x.b+'</b><p class="muted" style="margin:8px 0 0">'+x.result+' · '+x.court+'</p></div>'}).join(''):'<div class="card"><p class="muted" style="margin:0">Chưa có trận đấu nào.</p></div>')+'</main>';
else h='<main class="app">'+top('Hồ sơ trọng tài')+'<div class="card"><h3>Trọng tài</h3><p class="muted">Phiên bản thử nghiệm PICKLEBALL REFEREE</p></div></main>';app.innerHTML=h}
function snap(){state.undo={a:state.a,b:state.b,server:state.server}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a');if(a==='home'||a==='create'||a==='history'||a==='profile'||a==='match'){state.screen=a;render();return}if(a==='start'){state.match.court=document.getElementById('court').value||'Sân 1';state.match.type=document.getElementById('type').value;state.match.a=document.getElementById('ta').value||'Đội A';state.match.b=document.getElementById('tb').value||'Đội B';state.match.win=+document.getElementById('win').value;state.a=0;state.b=0;state.game=1;state.games=[];state.server='A';state.screen='match'}else if(a==='a+'){snap();state.a++}else if(a==='b+'){snap();state.b++}else if(a==='serve'){snap();state.server=state.server==='A'?'B':'A'}else if(a==='undo'&&state.undo){state.a=state.undo.a;state.b=state.undo.b;state.server=state.undo.server;state.undo=null}else if(a==='endgame'){state.screen='gameend'}else if(a==='nextgame'){state.games.push({a:state.a,b:state.b});state.a=0;state.b=0;state.game++;state.server=state.game%2?'A':'B';state.undo=null;state.screen='match'}else if(a==='endmatch'){if(state.a||state.b)state.games.push({a:state.a,b:state.b});var sa=0,sb=0;state.games.forEach(function(g){if(g.a>g.b)sa++;else if(g.b>g.a)sb++});state.history.push({a:state.match.a,b:state.match.b,court:state.match.court,result:sa+'–'+sb});save();state.screen='matchend'}render()});render();
})();
</script></body></html>
