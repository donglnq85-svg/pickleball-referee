<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pickleball Referee</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081a30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}body{overscroll-behavior:none}button,input{font:inherit;touch-action:manipulation}.screen{max-width:430px;width:100%;height:100dvh;margin:auto;overflow:hidden;background:#0b1f3a;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.splash,.login,.home{justify-content:center}.splash{text-align:center;align-items:center;background:#081a30}.logo{width:86px;height:86px;border:3px solid #5b8cff;border-radius:25px;display:grid;place-items:center;font-size:42px;margin-bottom:20px}.brand{font-size:27px;font-weight:950}.muted{color:#b8c6d9;font-size:12px}.maker{margin-top:12px;color:#8fa8c7;font-size:11px;font-weight:700;letter-spacing:.04em}.maker strong{color:#dbe7ff;font-weight:900}.loginBox{text-align:center}.loginBox h1{margin:0 0 8px}.primary{width:100%;height:56px;border:0;border-radius:14px;background:#155eef;color:#fff;font-size:17px;font-weight:900;margin-top:24px}.loginMaker{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;color:#8fa8c7;font-size:11px}.login{position:relative}.homeHead{text-align:center;margin-bottom:22px}.homeHead h1{margin:0 0 6px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{aspect-ratio:1/1;border-radius:18px;border:1px solid #5b8cff;background:#155eef;color:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}.mode strong{font-size:20px;line-height:1.05}.mode small{font-size:11px;color:#dbe7ff;margin-top:7px}.mode.off{background:#132b49;border-color:#52677f;color:#8394aa}.mode.off small{color:#8394aa}</style></head><body><div id="app"></div><script>(function(){var A=document.getElementById('app'),s={screen:'splash'};function render(){if(s.screen==='splash')A.innerHTML='<main class="screen splash"><div class="logo">◉</div><div class="brand">PICKLEBALL REFEREE</div><div class="muted">Trợ lý điều hành dành cho trọng tài</div><div class="maker">A product by <strong>THOC Software</strong></div></main>';else if(s.screen==='login')A.innerHTML='<main class="screen login"><div class="loginBox"><div class="logo" style="margin:0 auto 18px">◉</div><h1>Đăng nhập</h1><div class="muted">Chế độ trải nghiệm · chưa cần tài khoản</div><button class="primary" data-a="enter">Vào ứng dụng</button></div><div class="loginMaker">Developed by <strong>THOC Software</strong></div></main>';else A.innerHTML='<main class="screen home"><div class="homeHead"><h1>PICKLEBALL REFEREE</h1><div class="muted">Chọn chế độ làm việc</div></div><div class="modeGrid"><button class="mode" data-a="quick"><strong>Tạo trận nhanh</strong><small>Trận giao lưu thông thường</small></button><button class="mode off"><strong>Giải đấu</strong><small>Sắp ra mắt</small></button></div></main>'}document.addEventListener('click',function(e){var x=e.target.closest('[data-a]');if(!x)return;if(x.dataset.a==='enter'){s.screen='home';render()}});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});render();setTimeout(function(){s.screen='login';render()},1300)})();</script></body></html>
