name: Execute Corrected Page 04
on:
  push:
    paths: ['page04-execute-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/page04-direct-rebuild.yml').read_text()
          block=wf.split('      - shell: python\n        run: |\n',1)[1].split('\n      - run:',1)[0]
          script=textwrap.dedent(block)
          script=script.replace("b=x.find('function create()',a)","import re as _re\nm=_re.search(r'function\\s+[A-Za-z_$][\\w$]*\\s*\\(',x[a+16:]); b=(a+16+m.start()) if m else -1")
          exec(compile(script,'page04_rebuild','exec'))
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Replace Page 04 with fresh minimal layout"
          git push
