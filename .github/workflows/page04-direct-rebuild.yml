name: Page 04 Direct Rebuild
on:
  push:
    paths: ['page04-direct-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); x=p.read_text()
          a=x.find('function info(){')
          b=x.find('function create()',a)
          if a<0 or b<0: raise SystemExit(f'anchors not found {a} {b}')
          new='''function info(){
          var custom=s.winPoints!==11&&s.winPoints!==15,maxOn=s.limitMode==='maximum';
          app.innerHTML=`<div class="screen fresh04"><div class="fhead"><button onclick="home()">‹</button><h2>Thiết lập trận đấu</h2><i></i></div><section><h3><i>1</i>Hình thức</h3><div class="fchoices two"><button class="${s.type==='double'?'on':''}" onclick="s.type='double';render()"><b>Đánh đôi</b><small>2 vs 2</small></button><button class="${s.type==='single'?'on':''}" onclick="s.type='single';render()"><b>Đánh đơn</b><small>1 vs 1</small></button></div></section><section><h3><i>2</i>Vận động viên</h3><div class="fplayers"><div><label>ĐỘI A</label><input value="${s.names.A[0]}" oninput="s.names.A[0]=this.value">${s.type==='double'?`<input value="${s.names.A[1]}" oninput="s.names.A[1]=this.value">`:''}</div><div><label>ĐỘI B</label><input value="${s.names.B[0]}" oninput="s.names.B[0]=this.value">${s.type==='double'?`<input value="${s.names.B[1]}" oninput="s.names.B[1]=this.value">`:''}</div></div></section><section class="frules"><h3><i>3</i>Thể thức</h3><div class="fline"><label>Số set</label><div class="fchoices three">${[1,3,5].map(v=>`<button class="${s.sets===v?'on':''}" onclick="s.sets=${v};render()">${v}</button>`).join('')}</div></div><div class="fline"><label>Điểm thắng</label><div class="fchoices three"><button class="${s.winPoints===11?'on':''}" onclick="s.winPoints=11;render()">11</button><button class="${s.winPoints===15?'on':''}" onclick="s.winPoints=15;render()">15</button><button class="${custom?'on':''}" onclick="if(!${custom})s.winPoints=21;render()">Khác</button></div></div>${custom?`<div class="fline"><label>Điểm tùy chỉnh</label><div class="fstep"><button onclick="s.winPoints=Math.max(1,s.winPoints-1);render()">−</button><b>${s.winPoints}</b><button onclick="s.winPoints++;render()">+</button></div></div>`:''}<div class="fline"><label>Điều kiện</label><div class="fchoices two cond"><button class="${s.limitMode==='touch'?'on':''}" onclick="s.limitMode='touch';render()"><b>Chạm</b><small>Chạm điểm là thắng</small></button><button class="${s.limitMode!=='touch'?'on':''}" onclick="s.limitMode='unlimited';render()"><b>Cách 2</b><small>Thắng cách biệt 2</small></button></div></div><div class="fline"><label>Điểm tối đa</label><div class="fmax"><button class="ftoggle ${maxOn?'on':''}" onclick="s.limitMode=${maxOn}?'unlimited':'maximum';if(s.limitMode==='maximum'&&s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()"><i></i></button>${maxOn?`<div class="fstep"><button onclick="s.maxPoints=Math.max(s.winPoints+1,s.maxPoints-1);render()">−</button><b>${s.maxPoints}</b><button onclick="s.maxPoints++;render()">+</button></div>`:`<small>Tắt</small>`}</div></div></section><section><h3><i>4</i>Điểm bắt đầu <small>Điểm chấp</small></h3><div class="fstarts"><div><label>ĐỘI A</label><div class="fstep"><button onclick="s.startA=Math.max(0,s.startA-1);s.startB=0;render()">−</button><b>${s.startA}</b><button onclick="s.startA++;s.startB=0;render()">+</button></div></div><strong>${s.startA} – ${s.startB}</strong><div><label>ĐỘI B</label><div class="fstep"><button onclick="s.startB=Math.max(0,s.startB-1);s.startA=0;render()">−</button><b>${s.startB}</b><button onclick="s.startB++;s.startA=0;render()">+</button></div></div></div></section><section class="fnotes"><h3><i>5</i>Ghi chú <small>Tùy chọn</small></h3><textarea placeholder="Ghi chú cho trận đấu..." oninput="s.note=this.value">${s.note||''}</textarea></section><button class="fnext" onclick="create()">TIẾP TỤC</button></div>`
          }
          '''
          x=x[:a]+new+x[b:]
          css='''/* FRESH04 */.fresh04{height:100dvh!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;display:grid!important;grid-template-rows:44px 88px 132px minmax(220px,1fr) 100px 68px 50px!important;gap:8px!important;overflow:hidden!important}.fhead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;color:#fff}.fhead button{border:0;background:none;color:#fff;font-size:30px}.fhead h2{margin:0;text-align:center;font-size:20px}.fresh04>section{height:100%;background:#fff;border-radius:15px;padding:9px 10px;overflow:hidden}.fresh04 h3{height:25px;margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:15px}.fresh04 h3>i{width:24px;height:24px;border-radius:50%;background:#155eef;color:#fff;display:grid;place-items:center;font-size:11px;font-style:normal}.fresh04 h3 small{margin-left:auto;color:#98a2b3;font-size:9px}.fchoices{display:grid;gap:6px}.fchoices.two{grid-template-columns:1fr 1fr}.fchoices.three{grid-template-columns:repeat(3,1fr)}.fchoices button{min-width:0;height:33px;border:1px solid #d0d5dd;border-radius:9px;background:#f8fafc;color:#344054;font-size:12px;font-weight:850}.fchoices button.on{border:2px solid #3976f6;background:#eef4ff;color:#155eef}.fresh04>section:first-of-type .fchoices button{height:45px}.fchoices b{display:block}.fchoices small{display:block;font-size:8px;color:#667085}.fplayers{height:91px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.fplayers label,.fstarts label{display:block;text-align:center;font-size:10px;font-weight:900;color:#475467;margin-bottom:3px}.fplayers input{display:block;width:100%;height:34px;margin-bottom:5px;padding:0 8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#101828;font-size:12px}.frules{display:flex!important;flex-direction:column}.fline{min-height:38px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:7px;align-items:center}.fline>label{font-size:11px;font-weight:900;color:#475467}.cond,.cond button{height:40px}.fstep{height:33px;display:grid;grid-template-columns:34px minmax(36px,1fr) 34px;border:1px solid #b2ccff;border-radius:8px;overflow:hidden;background:#fff}.fstep button{border:0;background:#eef4ff;color:#155eef;font-size:18px;font-weight:950}.fstep b{display:grid;place-items:center;border-left:1px solid #d5e1f5;border-right:1px solid #d5e1f5}.fmax{display:flex;align-items:center;justify-content:flex-end;gap:8px}.fmax .fstep{width:126px}.fmax>small{width:126px;color:#98a2b3}.ftoggle{width:44px;height:26px;border:0;border-radius:99px;padding:3px;background:#d0d5dd;display:flex;align-items:center;justify-content:flex-start}.ftoggle i{width:20px;height:20px;border-radius:50%;background:#fff}.ftoggle.on{background:#155eef;justify-content:flex-end}.fstarts{height:57px;display:grid;grid-template-columns:1fr 54px 1fr;gap:7px;align-items:center}.fstarts>strong{text-align:center;color:#155eef;font-size:16px}.fstarts .fstep{height:34px;grid-template-columns:30px 1fr 30px}.fnotes textarea{width:100%;height:31px;padding:6px 8px;border:1px solid #d0d5dd;border-radius:8px;background:#f8fafc;color:#101828;font-size:12px;resize:none}.fnext{height:50px;width:100%;border:0;border-radius:13px;background:#155eef;color:#fff;font-size:17px;font-weight:950}@media(max-height:800px){.fresh04{grid-template-rows:40px 80px 114px minmax(190px,1fr) 88px 60px 44px!important;gap:6px!important}.fresh04>section{padding:6px 8px}.fresh04 h3{height:22px;margin-bottom:3px}.fresh04 h3>i{width:21px;height:21px}.fplayers{height:77px}.fplayers input{height:28px}.fline{min-height:32px;grid-template-columns:78px minmax(0,1fr)}.fchoices button{height:28px}.cond,.cond button{height:35px}.fstep{height:28px}.fstarts{height:48px}.fstarts .fstep{height:28px}.fnotes textarea{height:25px}.fnext{height:44px}}'''
          x=x.replace('</style>',css+'</style>',1);p.write_text(x)
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Replace Page 04 with fresh minimal layout"
          git push
