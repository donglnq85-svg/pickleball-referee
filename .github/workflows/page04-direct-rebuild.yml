name: Page 04 Direct Rebuild
on:
  push:
    paths: ['page04-direct-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); x=p.read_text()
          a=x.find('function info(){')
          b=x.find('function render(){',a)
          if a<0 or b<0: raise SystemExit(f'anchors not found {a} {b}')
          new='''function info(){return `<main class="screen q4blank"><header class="q4blankHead"><button data-a="home">‹</button><h2>Thiết lập trận đấu</h2><span></span></header><div class="q4blankCanvas"><div class="q4blankMessage"><strong>Trang 04</strong><span>Thiết kế mới đang được xây dựng</span></div></div></main>`}\n'''
          x=x[:a]+new+x[b:]
          css='''/* PAGE04_BLANK_RESET */.q4blank{height:100dvh!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#fff!important;display:grid!important;grid-template-rows:44px 1fr!important;gap:8px!important;overflow:hidden!important}.q4blankHead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}.q4blankHead button{border:0;background:transparent;color:#fff;font-size:30px;text-align:left}.q4blankHead h2{margin:0;text-align:center;font-size:20px;white-space:nowrap}.q4blankCanvas{background:#eef3f8;border-radius:16px;display:grid;place-items:center;min-height:0}.q4blankMessage{text-align:center;color:#667085}.q4blankMessage strong{display:block;font-size:18px;color:#344054;margin-bottom:6px}.q4blankMessage span{font-size:12px}'''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Reset Page 04 to blank design workspace"
          git push
