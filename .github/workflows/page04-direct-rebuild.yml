name: Page 04 Direct Rebuild
on:
  push:
    paths: ['page04-direct-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); x=p.read_text()
          a=x.find('function info(){')
          b=x.find('function render(){',a)
          if a<0 or b<0: raise SystemExit(f'anchors not found {a} {b}')
          new='''function info(){return `<main class="screen q4"><header class="q4head"><button data-a="home">‹</button><h2>Thiết lập trận đấu</h2><span></span></header>
          <section class="q4card q4type"><h3><i>1</i>Hình thức</h3><div class="q4two"><button data-a="double" class="${s.type==='double'?'on':''}"><b>Đánh đôi</b><small>2 vs 2</small></button><button data-a="single" class="${s.type==='single'?'on':''}"><b>Đánh đơn</b><small>1 vs 1</small></button></div></section>
          <section class="q4card q4players"><h3><i>2</i>Vận động viên</h3><div class="q4teams"><div><label>ĐỘI A</label><input id="a1" value="${s.match.a1}">${s.type==='double'?`<input id="a2" value="${s.match.a2}">`:''}</div><div><label>ĐỘI B</label><input id="b1" value="${s.match.b1}">${s.type==='double'?`<input id="b2" value="${s.match.b2}">`:''}</div></div></section>
          <section class="q4card q4rules"><h3><i>3</i>Thể thức</h3><div class="q4row"><label>Số set</label><div class="q4seg three"><button data-a="set1" class="${s.sets===1?'on':''}">1</button><button data-a="set3" class="${s.sets===3?'on':''}">3</button><button data-a="set5" class="${s.sets===5?'on':''}">5</button></div></div><div class="q4row"><label>Điểm thắng</label><div class="q4seg three"><button data-a="win11" class="${s.winPoints===11?'on':''}">11</button><button data-a="win15" class="${s.winPoints===15?'on':''}">15</button><button data-a="win21" class="${s.winPoints===21?'on':''}">21</button></div></div><div class="q4row"><label>Điều kiện</label><div class="q4seg two"><button data-a="touchMode" class="${s.limitMode==='touch'?'on':''}"><b>Chạm</b><small>Chạm điểm là thắng</small></button><button data-a="unlimitedMode" class="${s.limitMode!=='touch'?'on':''}"><b>Cách 2</b><small>Thắng cách biệt 2</small></button></div></div><div class="q4row"><label>Điểm tối đa</label><div class="q4max"><button class="q4switch ${s.limitMode==='maximum'?'on':''}" data-a="maximumMode"><i></i></button>${s.limitMode==='maximum'?`<div class="q4step"><button data-a="maxMinus">−</button><b>${s.maxPoints}</b><button data-a="maxPlus">+</button></div>`:`<span>Tắt</span>`}</div></div></section>
          <section class="q4card q4start"><h3><i>4</i>Điểm bắt đầu <small>Điểm chấp</small></h3><div class="q4starts"><div><label>ĐỘI A</label><div class="q4step"><button data-a="aMinus">−</button><b>${s.startA}</b><button data-a="aPlus">+</button></div></div><strong>${s.startA} – ${s.startB}</strong><div><label>ĐỘI B</label><div class="q4step"><button data-a="bMinus">−</button><b>${s.startB}</b><button data-a="bPlus">+</button></div></div></div></section>
          <section class="q4card q4note"><h3><i>5</i>Ghi chú <small>Tùy chọn</small></h3><textarea id="note" maxlength="200" placeholder="Ghi chú cho trận đấu...">${s.note}</textarea><input id="court" value="${s.match.court}" type="hidden"></section>
          <button class="q4next" data-a="saveInfo">TIẾP TỤC</button></main>`}
          '''
          x=x[:a]+new+x[b:]
          css='''/* Q4_REBUILD_V1 */
          .q4{height:100dvh!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;display:grid!important;grid-template-rows:44px 90px 132px minmax(224px,1fr) 100px 66px 50px!important;gap:8px!important;overflow:hidden!important}.q4head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;color:#fff}.q4head button{border:0;background:transparent;color:#fff;font-size:30px;text-align:left}.q4head h2{margin:0;text-align:center;font-size:20px;white-space:nowrap}.q4card{height:100%;min-width:0;background:#fff;border-radius:15px;padding:9px 10px;overflow:hidden}.q4card h3{height:25px;margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:15px}.q4card h3>i{width:24px;height:24px;border-radius:50%;background:#155eef;color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}.q4card h3>small{margin-left:auto;color:#98a2b3;font-size:9px}.q4two,.q4seg{display:grid;gap:7px}.q4two{grid-template-columns:1fr 1fr;height:49px}.q4two button,.q4seg button{border:1px solid #d0d5dd;border-radius:9px;background:#f8fafc;color:#344054;font-weight:850;min-width:0}.q4two button.on,.q4seg button.on{border:2px solid #3976f6;background:#eef4ff;color:#155eef}.q4two b{display:block;font-size:13px}.q4two small{display:block;font-size:9px;color:#667085}.q4teams{height:91px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.q4teams>div{min-width:0}.q4teams label,.q4starts label{display:block;text-align:center;font-size:10px;font-weight:900;color:#475467;margin-bottom:3px}.q4teams input{display:block;width:100%;height:34px;margin-bottom:5px;padding:0 8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#101828;font-size:12px}.q4rules{display:flex;flex-direction:column}.q4row{min-height:39px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:7px;align-items:center}.q4row>label{font-size:11px;font-weight:900;color:#475467}.q4seg.three{grid-template-columns:repeat(3,1fr);height:33px}.q4seg.two{grid-template-columns:1fr 1fr;height:41px}.q4seg button{font-size:12px}.q4seg.two b{display:block;font-size:11px}.q4seg.two small{display:block;font-size:8px;line-height:9px;color:#667085}.q4max{height:34px;display:flex;align-items:center;justify-content:flex-end;gap:8px}.q4max>span{width:126px;color:#98a2b3;font-size:10px}.q4switch{width:44px;height:26px;border:0;border-radius:99px;padding:3px;background:#d0d5dd;display:flex;align-items:center;justify-content:flex-start}.q4switch i{width:20px;height:20px;border-radius:50%;background:#fff}.q4switch.on{background:#155eef;justify-content:flex-end}.q4step{height:34px;display:grid;grid-template-columns:32px minmax(34px,1fr) 32px;border:1px solid #b2ccff;border-radius:8px;overflow:hidden;background:#fff}.q4max .q4step{width:126px}.q4step button{border:0;background:#eef4ff;color:#155eef;font-size:18px;font-weight:950}.q4step b{display:grid;place-items:center;border-left:1px solid #d5e1f5;border-right:1px solid #d5e1f5}.q4starts{height:57px;display:grid;grid-template-columns:1fr 54px 1fr;gap:7px;align-items:center}.q4starts>strong{text-align:center;color:#155eef;font-size:16px}.q4starts .q4step{width:100%}.q4note textarea{width:100%;height:31px;padding:6px 8px;border:1px solid #d0d5dd;border-radius:8px;background:#f8fafc;color:#101828;font-size:12px;resize:none}.q4next{height:50px;width:100%;border:0;border-radius:13px;background:#155eef;color:#fff;font-size:17px;font-weight:950}@media(max-height:800px){.q4{grid-template-rows:40px 80px 114px minmax(190px,1fr) 88px 58px 44px!important;gap:6px!important}.q4card{padding:6px 8px}.q4card h3{height:22px;margin-bottom:3px}.q4card h3>i{width:21px;height:21px}.q4two{height:43px}.q4teams{height:77px}.q4teams input{height:28px}.q4row{min-height:32px;grid-template-columns:78px minmax(0,1fr)}.q4seg.three{height:28px}.q4seg.two{height:35px}.q4max,.q4step{height:28px}.q4starts{height:48px}.q4note textarea{height:25px}.q4next{height:44px}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 04 against live app architecture"
          git push
