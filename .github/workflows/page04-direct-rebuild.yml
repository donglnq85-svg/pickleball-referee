name: Page 04 Direct Rebuild
on:
  push:
    paths: ['page04-direct-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); x=p.read_text()
          a=x.find('function info(){')
          b=x.find('function render(){',a)
          if a<0 or b<0: raise SystemExit(f'anchors not found {a} {b}')
          new='''function info(){return `<main class="screen q4minimal"><header class="q4mHead"><button data-a="home">‹</button><div><h2>Thiết lập trận đấu</h2><p>Tạo trận nhanh</p></div><span></span></header><div class="q4mBody"><section class="q4mSection"><div class="q4mTitle"><span>1</span><div><b>Hình thức thi đấu</b><small>Chọn loại trận</small></div></div><div class="q4mChoices"><button data-a="double" class="${s.type==='double'?'on':''}"><b>Đánh đôi</b><small>2 vs 2</small></button><button data-a="single" class="${s.type==='single'?'on':''}"><b>Đánh đơn</b><small>1 vs 1</small></button></div></section><div class="q4mPlaceholder"><span>2</span><b>Mục tiếp theo</b><small>Mình sẽ thiết kế cùng nhau sau khi chốt Mục 1</small></div></div></main>`}\n'''
          x=x[:a]+new+x[b:]
          css='''/* PAGE04_MINIMAL_DEMO_FOUNDATION */.q4minimal{height:100dvh!important;max-width:430px!important;margin:auto!important;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;overflow:hidden!important}.q4mHead{height:62px;display:grid;grid-template-columns:38px 1fr 38px;align-items:center;color:#fff}.q4mHead>button{border:0;background:transparent;color:#fff;font-size:32px;text-align:left;padding:0}.q4mHead>div{text-align:center}.q4mHead h2{margin:0;font-size:20px;line-height:24px}.q4mHead p{margin:2px 0 0;font-size:10px;color:#b8c6d9}.q4mBody{height:calc(100% - 62px);background:#f5f7fa;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}.q4mSection{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}.q4mTitle{display:flex;align-items:center;gap:10px;margin-bottom:14px}.q4mTitle>span,.q4mPlaceholder>span{width:28px;height:28px;flex:none;border-radius:50%;background:#155eef;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.q4mTitle b{display:block;font-size:16px;line-height:19px}.q4mTitle small{display:block;margin-top:2px;color:#98a2b3;font-size:10px}.q4mChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q4mChoices button{height:64px;border:1px solid #e1e6ee;border-radius:12px;background:#f8fafc;color:#344054}.q4mChoices button.on{border:2px solid #155eef;background:#eef4ff;color:#155eef}.q4mChoices b{display:block;font-size:14px}.q4mChoices small{display:block;margin-top:3px;font-size:10px;color:#667085}.q4mPlaceholder{min-height:74px;border:1px dashed #cbd5e1;border-radius:16px;padding:12px;display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;color:#667085}.q4mPlaceholder>span{grid-row:1/3;background:#d0d5dd;color:#667085}.q4mPlaceholder>b{font-size:13px}.q4mPlaceholder>small{font-size:10px;color:#98a2b3}.q4minimal button{touch-action:manipulation}'''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build minimal Page 04 foundation and first section"
          git push
