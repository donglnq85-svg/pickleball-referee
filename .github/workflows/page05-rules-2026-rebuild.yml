name: Page 05 Rules 2026 Rebuild
on:
  push:
    paths:
      - page05-rules-2026-trigger.txt
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/page05_rebuild_2026.py
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 05 from scratch on 2026 rules"
          git push
