name: Page 05 Clean V3
on:
  push:
    paths: [page05-clean-v3-trigger.txt]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rebuild_page05_clean_v3.py
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 05 clean V3"
          git push
