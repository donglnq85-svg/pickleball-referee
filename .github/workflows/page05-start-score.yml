name: Page 05 Starting Score
on:
  push:
    paths: [page05-start-score-trigger.txt]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/page05_start_score.py
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show starting handicap score through Page 05 flow"
          git push
