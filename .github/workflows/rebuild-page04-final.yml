name: Page 04 Final Rebuild
on:
  push:
    paths: ['page04-final-trigger.txt']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); x=p.read_text()
          pat=re.compile(r"function info\(\)\{.*?\n\}\nfunction create",re.S)
          new=r'''function info(){
           var custom=s.winPoints!==11&&s.winPoints!==15, maxOn=s.limitMode==='maximum';
           app.innerHTML=`<div class="screen p04"><div class="p04top"><button onclick="home()">‹</button><h2>Thiết lập trận đấu</h2><i></i></div>
           <section><h3><i>1</i>Hình thức</h3><div class="pick two"><button class="${s.type==='double'?'on':''}" onclick="s.type='double';render()"><b>Đánh đôi</b><small>2 vs 2</small></button><button class="${s.type==='single'?'on':''}" onclick="s.type='single';render()"><b>Đánh đơn</b><small>1 vs 1</small></button></div></section>
           <section><h3><i>2</i>Vận động viên</h3><div class="players"><div><label>ĐỘI A</label><input value="${s.names.A[0]}" oninput="s.names.A[0]=this.value">${s.type==='double'?`<input value="${s.names.A[1]}" oninput="s.names.A[1]=this.value">`:''}</div><div><label>ĐỘI B</label><input value="${s.names.B[0]}" oninput="s.names.B[0]=this.value">${s.type==='double'?`<input value="${s.names.B[1]}" oninput="s.names.B[1]=this.value">`:''}</div></div></section>
           <section class="rules"><h3><i>3</i>Thể thức</h3><div class="line"><label>Số set</label><div class="pick three">${[1,3,5].map(v=>`<button class="${s.sets===v?'on':''}" onclick="s.sets=${v};render()">${v}</button>`).join('')}</div></div><div class="line"><label>Điểm thắng</label><div class="pick three"><button class="${s.winPoints===11?'on':''}" onclick="s.winPoints=11;render()">11</button><button class="${s.winPoints===15?'on':''}" onclick="s.winPoints=15;render()">15</button><button class="${custom?'on':''}" onclick="if(!${custom})s.winPoints=21;render()">Khác</button></div></div>${custom?`<div class="line"><label>Điểm tùy chỉnh</label><div class="step"><button onclick="s.winPoints=Math.max(1,s.winPoints-1);render()">−</button><b>${s.winPoints}</b><button onclick="s.winPoints++;render()">+</button></div></div>`:''}<div class="line"><label>Điều kiện</label><div class="pick two condition"><button class="${s.limitMode==='touch'?'on':''}" onclick="s.limitMode='touch';render()"><b>Chạm</b><small>Chạm điểm là thắng</small></button><button class="${s.limitMode!=='touch'?'on':''}" onclick="s.limitMode='unlimited';render()"><b>Cách 2</b><small>Thắng cách biệt 2</small></button></div></div><div class="line"><label>Điểm tối đa</label><div class="max"><button class="toggle ${maxOn?'on':''}" onclick="s.limitMode=${maxOn}?'unlimited':'maximum';if(s.limitMode==='maximum'&&s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()"><i></i></button>${maxOn?`<div class="step"><button onclick="s.maxPoints=Math.max(s.winPoints+1,s.maxPoints-1);render()">−</button><b>${s.maxPoints}</b><button onclick="s.maxPoints++;render()">+</button></div>`:`<small>Tắt</small>`}</div></div></section>
           <section><h3><i>4</i>Điểm bắt đầu <small>Điểm chấp</small></h3><div class="starts"><div><label>ĐỘI A</label><div class="step"><button onclick="s.startA=Math.max(0,s.startA-1);s.startB=0;render()">−</button><b>${s.startA}</b><button onclick="s.startA++;s.startB=0;render()">+</button></div></div><strong>${s.startA} – ${s.startB}</strong><div><label>ĐỘI B</label><div class="step"><button onclick="s.startB=Math.max(0,s.startB-1);s.startA=0;render()">−</button><b>${s.startB}</b><button onclick="s.startB++;s.startA=0;render()">+</button></div></div></div></section>
           <section class="notes"><h3><i>5</i>Ghi chú <small>Tùy chọn</small></h3><textarea placeholder="Ghi chú cho trận đấu..." oninput="s.note=this.value">${s.note||''}</textarea></section><button class="next04" onclick="create()">TIẾP TỤC</button></div>`
          }
          function create'''
          x,n=pat.subn(new,x,count=1)
          if n!=1: raise SystemExit('info not found')
          css=r'''/* PAGE04_FINAL */
          .p04{height:100dvh!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;display:grid!important;grid-template-rows:44px 88px 132px minmax(220px,1fr) 100px 68px 50px!important;gap:8px!important;overflow:hidden!important}.p04top{display:grid!important;grid-template-columns:40px 1fr 40px!important;align-items:center!important;color:#fff!important}.p04top button{border:0!important;background:none!important;color:#fff!important;font-size:30px!important}.p04top h2{margin:0!important;text-align:center!important;font-size:20px!important}.p04>section{height:100%!important;background:#fff!important;border-radius:15px!important;padding:9px 10px!important;overflow:hidden!important}.p04 h3{height:25px!important;margin:0 0 6px!important;display:flex!important;align-items:center!important;gap:8px!important;font-size:15px!important}.p04 h3>i{width:24px!important;height:24px!important;border-radius:50%!important;background:#155eef!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:11px!important;font-style:normal!important}.p04 h3 small{margin-left:auto!important;color:#98a2b3!important;font-size:9px!important}.pick{display:grid!important;gap:6px!important}.pick.two{grid-template-columns:1fr 1fr!important}.pick.three{grid-template-columns:repeat(3,1fr)!important}.pick button{min-width:0!important;height:33px!important;border:1px solid #d0d5dd!important;border-radius:9px!important;background:#f8fafc!important;color:#344054!important;font-size:12px!important;font-weight:850!important}.pick button.on{border:2px solid #3976f6!important;background:#eef4ff!important;color:#155eef!important}.p04>section:first-of-type .pick button{height:45px!important}.pick b{display:block!important}.pick small{display:block!important;font-size:8px!important;color:#667085!important}.players{height:91px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.players label,.starts label{display:block!important;text-align:center!important;font-size:10px!important;font-weight:900!important;color:#475467!important;margin-bottom:3px!important}.players input{display:block!important;width:100%!important;height:34px!important;margin-bottom:5px!important;padding:0 8px!important;border:1px solid #d0d5dd!important;border-radius:8px!important;background:#fff!important;color:#101828!important;font-size:12px!important}.rules{display:flex!important;flex-direction:column!important}.line{min-height:38px!important;display:grid!important;grid-template-columns:84px minmax(0,1fr)!important;gap:7px!important;align-items:center!important}.line>label{font-size:11px!important;font-weight:900!important;color:#475467!important}.condition{height:40px!important}.condition button{height:40px!important}.step{height:33px!important;display:grid!important;grid-template-columns:34px minmax(36px,1fr) 34px!important;border:1px solid #b2ccff!important;border-radius:8px!important;overflow:hidden!important;background:#fff!important}.step button{border:0!important;background:#eef4ff!important;color:#155eef!important;font-size:18px!important;font-weight:950!important}.step b{display:grid!important;place-items:center!important;border-left:1px solid #d5e1f5!important;border-right:1px solid #d5e1f5!important}.max{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important}.max .step{width:126px!important}.max>small{width:126px!important;color:#98a2b3!important}.toggle{width:44px!important;height:26px!important;border:0!important;border-radius:99px!important;padding:3px!important;background:#d0d5dd!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}.toggle i{width:20px!important;height:20px!important;border-radius:50%!important;background:#fff!important}.toggle.on{background:#155eef!important;justify-content:flex-end!important}.starts{height:57px!important;display:grid!important;grid-template-columns:1fr 54px 1fr!important;gap:7px!important;align-items:center!important}.starts>strong{text-align:center!important;color:#155eef!important;font-size:16px!important}.starts .step{height:34px!important;grid-template-columns:30px 1fr 30px!important}.notes textarea{width:100%!important;height:31px!important;padding:6px 8px!important;border:1px solid #d0d5dd!important;border-radius:8px!important;background:#f8fafc!important;color:#101828!important;font-size:12px!important;resize:none!important}.next04{height:50px!important;width:100%!important;border:0!important;border-radius:13px!important;background:#155eef!important;color:#fff!important;font-size:17px!important;font-weight:950!important}@media(max-height:800px){.p04{grid-template-rows:40px 80px 114px minmax(190px,1fr) 88px 60px 44px!important;gap:6px!important}.p04>section{padding:6px 8px!important}.p04 h3{height:22px!important;margin-bottom:3px!important}.p04 h3>i{width:21px!important;height:21px!important}.players{height:77px!important}.players input{height:28px!important}.line{min-height:32px!important;grid-template-columns:78px minmax(0,1fr)!important}.pick button{height:28px!important}.condition,.condition button{height:35px!important}.step{height:28px!important}.starts{height:48px!important}.starts .step{height:28px!important}.notes textarea{height:25px!important}.next04{height:44px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1); p.write_text(x)
      - run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 04 with simple demo system"
          git push
