name: Rebuild Page 04 Demo
on:
  push:
    paths:
      - 'page04-rebuild-trigger.txt'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Page 04
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); x=p.read_text()
          pat=re.compile(r"function info\(\)\{.*?\n\}\nfunction create",re.S)
          new=r'''function info(){
           var custom=s.winPoints!==11&&s.winPoints!==15, maxOn=s.limitMode==='maximum';
           app.innerHTML=`<div class="screen demo04"><div class="dtop"><button onclick="home()">‹</button><h2>Thiết lập trận đấu</h2><i></i></div>
           <section class="dcard"><header><span>1</span><b>Hình thức</b></header><div class="dchoice"><button class="${s.type==='double'?'on':''}" onclick="s.type='double';render()"><b>Đánh đôi</b><small>2 vs 2</small></button><button class="${s.type==='single'?'on':''}" onclick="s.type='single';render()"><b>Đánh đơn</b><small>1 vs 1</small></button></div></section>
           <section class="dcard"><header><span>2</span><b>Vận động viên</b></header><div class="dplayers"><div><label>ĐỘI A</label><input value="${s.names.A[0]}" oninput="s.names.A[0]=this.value">${s.type==='double'?`<input value="${s.names.A[1]}" oninput="s.names.A[1]=this.value">`:''}</div><div><label>ĐỘI B</label><input value="${s.names.B[0]}" oninput="s.names.B[0]=this.value">${s.type==='double'?`<input value="${s.names.B[1]}" oninput="s.names.B[1]=this.value">`:''}</div></div></section>
           <section class="dcard drules"><header><span>3</span><b>Thể thức</b></header><div class="dline"><label>Số set</label><div class="dseg three">${[1,3,5].map(v=>`<button class="${s.sets===v?'on':''}" onclick="s.sets=${v};render()">${v}</button>`).join('')}</div></div><div class="dline"><label>Điểm thắng</label><div class="dseg three"><button class="${s.winPoints===11?'on':''}" onclick="s.winPoints=11;render()">11</button><button class="${s.winPoints===15?'on':''}" onclick="s.winPoints=15;render()">15</button><button class="${custom?'on':''}" onclick="if(!${custom})s.winPoints=21;render()">Khác</button></div></div>${custom?`<div class="dline"><label>Điểm tùy chỉnh</label><div class="dstep"><button onclick="s.winPoints=Math.max(1,s.winPoints-1);render()">−</button><b>${s.winPoints}</b><button onclick="s.winPoints++;render()">+</button></div></div>`:''}<div class="dline"><label>Điều kiện</label><div class="dseg two"><button class="${s.limitMode==='touch'?'on':''}" onclick="s.limitMode='touch';render()"><b>Chạm</b><small>Chạm điểm là thắng</small></button><button class="${s.limitMode!=='touch'?'on':''}" onclick="s.limitMode='unlimited';render()"><b>Cách 2</b><small>Thắng cách biệt 2</small></button></div></div><div class="dline"><label>Điểm tối đa</label><div class="dmax"><button class="dswitch ${maxOn?'on':''}" onclick="s.limitMode=${maxOn}?'unlimited':'maximum';if(s.limitMode==='maximum'&&s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()"><i></i></button>${maxOn?`<div class="dstep"><button onclick="s.maxPoints=Math.max(s.winPoints+1,s.maxPoints-1);render()">−</button><b>${s.maxPoints}</b><button onclick="s.maxPoints++;render()">+</button></div>`:`<small>Tắt</small>`}</div></div></section>
           <section class="dcard"><header><span>4</span><b>Điểm bắt đầu</b><small>Điểm chấp</small></header><div class="dstart"><div><label>ĐỘI A</label><div class="dstep"><button onclick="s.startA=Math.max(0,s.startA-1);s.startB=0;render()">−</button><b>${s.startA}</b><button onclick="s.startA++;s.startB=0;render()">+</button></div></div><strong>${s.startA} – ${s.startB}</strong><div><label>ĐỘI B</label><div class="dstep"><button onclick="s.startB=Math.max(0,s.startB-1);s.startA=0;render()">−</button><b>${s.startB}</b><button onclick="s.startB++;s.startA=0;render()">+</button></div></div></div></section>
           <section class="dcard dnote"><header><span>5</span><b>Ghi chú</b><small>Tùy chọn</small></header><textarea placeholder="Ghi chú cho trận đấu..." oninput="s.note=this.value">${s.note||''}</textarea></section><button class="dcontinue" onclick="create()">TIẾP TỤC</button></div>`
          }
          function create'''
          x,n=pat.subn(new,x,count=1)
          if n!=1: raise SystemExit('Page 04 function not found')
          css=r'''/* PAGE04_DEMO_V2 */
          .demo04{height:100dvh!important;width:100%!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;display:grid!important;grid-template-rows:44px 88px 132px minmax(220px,1fr) 100px 68px 50px!important;gap:8px!important;overflow:hidden!important}.dtop{display:grid!important;grid-template-columns:40px 1fr 40px!important;align-items:center!important;color:#fff!important}.dtop button{border:0!important;background:none!important;color:#fff!important;font-size:30px!important}.dtop h2{margin:0!important;text-align:center!important;font-size:20px!important}.dcard{height:100%!important;background:#fff!important;border-radius:15px!important;padding:9px 10px!important;overflow:hidden!important}.dcard header{height:25px!important;display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:6px!important}.dcard header span{width:24px!important;height:24px!important;border-radius:50%!important;background:#155eef!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:11px!important;font-weight:900!important}.dcard header b{font-size:15px!important}.dcard header small{margin-left:auto!important;color:#98a2b3!important;font-size:9px!important}.dchoice{height:45px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.dchoice button,.dseg button{border:1px solid #d0d5dd!important;border-radius:9px!important;background:#f8fafc!important;color:#344054!important}.dchoice button.on,.dseg button.on{border:2px solid #3976f6!important;background:#eef4ff!important;color:#155eef!important}.dchoice b{display:block!important;font-size:13px!important}.dchoice small,.dseg small{display:block!important;font-size:8px!important;color:#667085!important}.dplayers{height:91px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.dplayers label,.dstart label{display:block!important;text-align:center!important;font-size:10px!important;font-weight:900!important;color:#475467!important;margin-bottom:3px!important}.dplayers input{display:block!important;width:100%!important;height:34px!important;margin-bottom:5px!important;padding:0 8px!important;border:1px solid #d0d5dd!important;border-radius:8px!important;background:#fff!important;color:#101828!important;font-size:12px!important}.drules{display:flex!important;flex-direction:column!important}.dline{min-height:38px!important;display:grid!important;grid-template-columns:84px minmax(0,1fr)!important;gap:7px!important;align-items:center!important}.dline>label{font-size:11px!important;font-weight:900!important;color:#475467!important}.dseg{height:33px!important;display:grid!important;gap:6px!important}.dseg.three{grid-template-columns:repeat(3,1fr)!important}.dseg.two{height:40px!important;grid-template-columns:1fr 1fr!important}.dseg button{min-width:0!important;font-size:12px!important;font-weight:850!important}.dseg.two b{display:block!important;font-size:11px!important}.dstep{height:33px!important;display:grid!important;grid-template-columns:34px minmax(36px,1fr) 34px!important;border:1px solid #b2ccff!important;border-radius:8px!important;overflow:hidden!important;background:#fff!important}.dstep button{border:0!important;background:#eef4ff!important;color:#155eef!important;font-size:18px!important;font-weight:950!important}.dstep b{display:grid!important;place-items:center!important;border-left:1px solid #d5e1f5!important;border-right:1px solid #d5e1f5!important}.dmax{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important}.dmax .dstep{width:126px!important}.dmax>small{width:126px!important;color:#98a2b3!important}.dswitch{width:44px!important;height:26px!important;border:0!important;border-radius:99px!important;padding:3px!important;background:#d0d5dd!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}.dswitch i{width:20px!important;height:20px!important;border-radius:50%!important;background:#fff!important}.dswitch.on{background:#155eef!important;justify-content:flex-end!important}.dstart{height:57px!important;display:grid!important;grid-template-columns:1fr 54px 1fr!important;gap:7px!important;align-items:center!important}.dstart>strong{text-align:center!important;color:#155eef!important;font-size:16px!important}.dstart .dstep{height:34px!important;grid-template-columns:30px 1fr 30px!important}.dnote textarea{width:100%!important;height:31px!important;padding:6px 8px!important;border:1px solid #d0d5dd!important;border-radius:8px!important;background:#f8fafc!important;color:#101828!important;font-size:12px!important;resize:none!important}.dcontinue{height:50px!important;width:100%!important;border:0!important;border-radius:13px!important;background:#155eef!important;color:#fff!important;font-size:17px!important;font-weight:950!important}@media(max-height:800px){.demo04{grid-template-rows:40px 80px 114px minmax(190px,1fr) 88px 60px 44px!important;gap:6px!important}.dcard{padding:6px 8px!important}.dcard header{height:22px!important;margin-bottom:3px!important}.dcard header span{width:21px!important;height:21px!important}.dchoice{height:41px!important}.dplayers{height:77px!important}.dplayers input{height:28px!important}.dline{min-height:32px!important;grid-template-columns:78px minmax(0,1fr)!important}.dseg{height:28px!important}.dseg.two{height:35px!important}.dstep{height:28px!important}.dstart{height:48px!important}.dstart .dstep{height:28px!important}.dnote textarea{height:25px!important}.dcontinue{height:44px!important}}
          */'''
          # fix comment terminator then append before style end
          css=css[:-2]
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Replace Page 04 with simple demo layout"
          git push
