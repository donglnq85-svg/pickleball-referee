name: Smart fixed Page 04 format controls
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement smart fixed format controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          # Replace the Page 04 render fragment so custom values live inside their originating controls.
          old="""<div class=\"formatline\"><div class=\"flabel\">Điểm thắng</div><div class=\"seg\"><button class=\"${s.winChoice===11?'on':''}\" onclick=\"s.winChoice=11;s.winPoints=11;render()\">11</button><button class=\"${s.winChoice===15?'on':''}\" onclick=\"s.winChoice=15;s.winPoints=15;render()\">15</button><button class=\"${s.winChoice==='other'?'on':''}\" onclick=\"s.winChoice='other';render()\">${s.winChoice==='other'?'Khác · '+s.winPoints:'Khác'}</button></div></div>${s.winChoice==='other'?`<div class=\"maxrow\"><span class=\"flabel\">Nhập điểm thắng</span><div class=\"joined\"><button onclick=\"s.winPoints=Math.max(1,s.winPoints-1);render()\">−</button><strong>${s.winPoints}</strong><button onclick=\"s.winPoints++;render()\">+</button></div></div>`:''}<div class=\"flabel\">Điều kiện thắng</div><div class=\"seg ruleRow\"><button class=\"${s.limitMode==='touch'?'on':''}\" onclick=\"s.limitMode='touch';render()\">Chạm<small>Chạm điểm là thắng</small></button><button class=\"${s.limitMode==='unlimited'?'on':''}\" onclick=\"s.limitMode='unlimited';render()\">Không giới hạn<small>Thắng cách 2</small></button><button class=\"${s.limitMode==='maximum'?'on':''}\" onclick=\"s.limitMode='maximum';render()\">Điểm tối đa<small>Thắng cách 2</small></button></div>${s.limitMode==='maximum'?`<div class=\"maxrow\"><span class=\"flabel\">Điểm tối đa</span><div class=\"joined\"><button onclick=\"s.maxPoints=Math.max(s.winPoints,s.maxPoints-1);render()\">−</button><strong>${s.maxPoints}</strong><button onclick=\"s.maxPoints++;render()\">+</button></div></div>`:''}"""
          new="""<div class=\"formatline\"><div class=\"flabel\">Điểm thắng</div><div class=\"seg smartWin\"><button class=\"${s.winChoice===11?'on':''}\" onclick=\"s.winChoice=11;s.winPoints=11;render()\">11</button><button class=\"${s.winChoice===15?'on':''}\" onclick=\"s.winChoice=15;s.winPoints=15;render()\">15</button>${s.winChoice==='other'?`<div class=\"inlineStepper on\"><button onclick=\"s.winPoints=Math.max(1,s.winPoints-1);render()\">−</button><strong>${s.winPoints}</strong><button onclick=\"s.winPoints++;render()\">+</button></div>`:`<button onclick=\"s.winChoice='other';render()\">Khác</button>`}</div></div><div class=\"formatline ruleLine\"><div class=\"flabel\">Điều kiện thắng</div><div class=\"seg ruleRow\"><button class=\"${s.limitMode==='touch'?'on':''}\" onclick=\"s.limitMode='touch';render()\">Chạm<small>Chạm điểm là thắng</small></button><button class=\"${s.limitMode==='unlimited'?'on':''}\" onclick=\"s.limitMode='unlimited';render()\">Không giới hạn<small>Thắng cách 2</small></button>${s.limitMode==='maximum'?`<div class=\"maxChoice on\"><span>Điểm tối đa</span><div class=\"miniStep\"><button onclick=\"s.maxPoints=Math.max(s.winPoints,s.maxPoints-1);render()\">−</button><strong>${s.maxPoints}</strong><button onclick=\"s.maxPoints++;render()\">+</button></div></div>`:`<button onclick=\"s.limitMode='maximum';render()\">Điểm tối đa<small>Thắng cách 2</small></button>`}</div></div>"""
          if old not in x:
              raise SystemExit('Expected Page 04 format fragment not found; aborting instead of patching blindly')
          x=x.replace(old,new,1)
          css='''
          /* Smart fixed-height Page 04 format controls */
          .info .i3{height:158px!important;overflow:hidden!important}.info .i3 .formatline{height:38px!important;min-height:38px!important;margin:4px 0!important;grid-template-columns:94px minmax(0,1fr)!important}.info .i3 .ruleLine{height:50px!important;min-height:50px!important}.info .i3 .seg{height:100%!important}.info .i3 .seg>button{height:100%!important}.info .smartWin{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}.inlineStepper{height:100%;display:grid;grid-template-columns:30px minmax(32px,1fr) 30px;border:2px solid #5b8cff;border-radius:10px;overflow:hidden;background:#eaf1ff;color:#155eef}.inlineStepper button,.miniStep button{border:0;background:transparent;color:#155eef;font-size:17px;font-weight:950;padding:0}.inlineStepper strong{display:grid;place-items:center;background:#fff;border-left:1px solid #b2ccff;border-right:1px solid #b2ccff;color:#101828;font-size:15px}.info .ruleRow{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}.info .ruleRow>button{height:50px!important}.maxChoice{height:50px;border:2px solid #5b8cff;border-radius:10px;background:#eaf1ff;color:#155eef;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 4px;overflow:hidden}.maxChoice>span{font-size:9px;line-height:10px;font-weight:900}.miniStep{width:100%;height:27px;margin-top:2px;display:grid;grid-template-columns:25px 1fr 25px;border:1px solid #b2ccff;border-radius:7px;overflow:hidden;background:#fff}.miniStep strong{display:grid;place-items:center;border-left:1px solid #d5e1f5;border-right:1px solid #d5e1f5;color:#101828;font-size:13px}.info .i4{height:128px!important}.info .i5{height:78px!important}.info .startBtn{height:52px!important;flex-basis:52px!important}.info{gap:9px!important}
          @media(max-height:800px){.info{gap:5px!important}.info .i3{height:137px!important}.info .i3 .formatline{height:30px!important;min-height:30px!important;margin:2px 0!important;grid-template-columns:76px minmax(0,1fr)!important}.info .i3 .ruleLine{height:42px!important;min-height:42px!important}.info .ruleRow>button,.maxChoice{height:42px!important}.inlineStepper{grid-template-columns:24px minmax(28px,1fr) 24px}.miniStep{height:23px;grid-template-columns:21px 1fr 21px}.maxChoice>span{font-size:7px}.info .i4{height:101px!important}.info .i5{height:62px!important}.info .startBtn{height:42px!important;flex-basis:42px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Implement fixed-height smart format controls" || exit 0
          git push
