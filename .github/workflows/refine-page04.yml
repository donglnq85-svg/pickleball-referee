name: Full viewport Page 04 distribution
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Page 04 vertical distribution
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          css='''
          /* Page 04: distribute the whole setup over the available viewport */
          .info{height:100dvh!important;display:grid!important;grid-template-rows:44px minmax(96px,.82fr) minmax(126px,1.08fr) minmax(174px,1.48fr) minmax(104px,.9fr) minmax(66px,.58fr) 52px!important;gap:8px!important;padding:10px 12px 12px!important;overflow:hidden!important;align-content:stretch!important}
          .info .top,.info .icard,.info .startBtn{height:auto!important;min-height:0!important;max-height:none!important;flex:none!important;margin:0!important;box-sizing:border-box!important}.info .top{align-self:stretch!important}.info .icard{display:flex!important;flex-direction:column!important;padding:9px 10px!important;overflow:hidden!important}.info .ititle{flex:0 0 25px!important;margin:0 0 6px!important}.info .i1,.info .i2,.info .i3,.info .i4,.info .i5{height:auto!important;min-height:0!important;max-height:none!important}
          .info .i1 .seg{flex:1!important;min-height:0!important}.info .sportChoice{height:100%!important;min-height:0!important;max-height:76px!important;align-self:center!important}.info .i2 .teamsInput{flex:1!important;height:auto!important;min-height:0!important}.info .i2 .teamInput{height:100%!important;min-height:0!important;display:flex!important;flex-direction:column!important}.info .i2 .teamInput input{flex:1!important;min-height:27px!important;max-height:34px!important}
          .info .i3{justify-content:flex-start!important}.info .i3 .formatline{height:auto!important;min-height:34px!important;flex:1 1 0!important;margin:2px 0!important}.info .i3 .ruleLine{min-height:42px!important}.info .maxToggleLine{min-height:34px!important}.info .i3 .seg>button{height:100%!important;min-height:32px!important}.info .twoRules>button{height:100%!important;min-height:40px!important}.maxToggleWrap{height:100%!important;min-height:32px!important}.maxInput{height:34px!important}.toggle{flex:none!important}
          .info .i4 .hint{flex:0 0 auto!important;margin-bottom:6px!important}.info .startgrid{flex:1!important;height:auto!important;min-height:0!important}.info .startbox,.info .startScore{height:100%!important;min-height:0!important}.info .startbox{display:flex!important;flex-direction:column!important;justify-content:center!important}.info .startbox .joined{height:34px!important;margin-top:5px!important}.info .i5 .note{flex:1!important;height:auto!important;min-height:30px!important;max-height:none!important}.info .startBtn{height:100%!important;min-height:46px!important;align-self:stretch!important}
          @media(max-height:760px){.info{grid-template-rows:36px minmax(76px,.72fr) minmax(104px,1fr) minmax(145px,1.38fr) minmax(84px,.8fr) minmax(52px,.5fr) 42px!important;gap:5px!important;padding:7px 10px 8px!important}.info .icard{padding:6px 8px!important}.info .ititle{flex-basis:21px!important;margin-bottom:3px!important}.info .sportChoice{max-height:58px!important}.info .i2 .teamInput input{min-height:22px!important;max-height:27px!important}.info .i3 .formatline{min-height:27px!important;margin:1px 0!important}.info .i3 .ruleLine{min-height:35px!important}.info .maxToggleLine{min-height:28px!important}.info .startbox .joined{height:27px!important;margin-top:3px!important}.info .i5 .note{min-height:25px!important}.info .startBtn{min-height:38px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Distribute Page 04 across full viewport" || exit 0
          git push
