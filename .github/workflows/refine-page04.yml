name: Clean rebuild Page 04
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove patch cascade and rebuild Page 04
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          x=p.read_text()
          # Remove the accumulated Page 04 override cascade from the first patch marker onward.
          marker='/* Page 04 bright cards + overlap-safe sizing */'
          if marker in x:
              a=x.index(marker)
              b=x.index('</style>',a)
              x=x[:a]+x[b:]
          # Replace old 3-choice condition UI with two conditions + optional max-score toggle.
          old=re.compile(r'<div class="flabel">Điều kiện thắng</div><div class="seg ruleRow">.*?</div>\$\{s\.limitMode===\'maximum\'\?`<div class="maxrow">.*?</div>`:\'\'\}',re.S)
          repl='''<div class="formatline conditionLine"><div class="flabel">Điều kiện thắng</div><div class="seg conditionChoices"><button class="${s.limitMode==='touch'?'on':''}" onclick="s.limitMode='touch';render()">Chạm<small>Chạm điểm là thắng</small></button><button class="${s.limitMode!=='touch'?'on':''}" onclick="s.limitMode='unlimited';render()">Thắng cách 2<small>Không giới hạn</small></button></div></div><div class="formatline maxLine"><div class="flabel">Điểm tối đa</div><div class="maxControl"><button class="maxSwitch ${s.limitMode==='maximum'?'on':''}" onclick="s.limitMode=s.limitMode==='maximum'?'unlimited':'maximum';if(s.limitMode==='maximum'&&s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()"><span></span></button>${s.limitMode==='maximum'?`<div class="maxEntry"><button onclick="s.maxPoints=Math.max(s.winPoints+1,s.maxPoints-1);render()">−</button><strong>${s.maxPoints}</strong><button onclick="s.maxPoints++;render()">+</button></div>`:`<span class="offText">Không giới hạn</span>`}</div></div>'''
          x,n=old.subn(repl,x,count=1)
          if n!=1:
              raise SystemExit('Condition UI fragment not found; no blind rebuild')
          css='''
          /* PAGE04_CLEAN_V1 — single authoritative layout */
          .info{background:#0b1f3a!important;color:#101828!important;height:100dvh!important;width:100%!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;display:grid!important;grid-template-rows:44px 108px 142px 190px 116px 74px 52px!important;gap:8px!important;overflow:hidden!important;align-content:space-between!important}
          .info .top{height:44px!important;width:100%!important;display:grid!important;grid-template-columns:40px 1fr 40px!important;align-items:center!important;color:#fff!important}.info .top .back{grid-column:1!important;color:#fff!important;justify-self:start!important}.info .top h2{grid-column:2!important;margin:0!important;text-align:center!important;font-size:20px!important;white-space:nowrap!important}.info .icard{height:100%!important;width:100%!important;min-width:0!important;margin:0!important;padding:9px 10px!important;border:1px solid #d9e2ec!important;border-radius:14px!important;background:#fff!important;color:#101828!important;overflow:hidden!important;display:flex!important;flex-direction:column!important}.info .ititle{height:27px!important;flex:none!important;margin:0 0 7px!important;color:#101828!important;font-size:15px!important;font-weight:950!important;display:flex!important;align-items:center!important;gap:8px!important}.info .num{width:25px!important;height:25px!important;border-radius:50%!important;background:#155eef!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:12px!important;flex:none!important}
          .info .i1>.seg{flex:1!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;min-height:0!important}.info .sportChoice{height:64px!important;width:100%!important;min-width:0!important;display:grid!important;grid-template-rows:24px 18px 12px!important;place-items:center!important;align-content:center!important;padding:3px!important;overflow:hidden!important}.info .sportIcon{font-size:20px!important;line-height:20px!important}.info .sportName{font-size:13px!important;line-height:16px!important}.info .sportMeta{font-size:9px!important;line-height:10px!important}
          .info .teamsInput{flex:1!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;min-height:0!important}.info .teamInput{height:100%!important;min-width:0!important;padding:5px!important;background:#f8fafc!important;border:1px solid #d9e2ec!important;border-radius:10px!important}.info .teamInput b{height:17px!important;margin:0 0 3px!important;text-align:center!important;color:#155eef!important;font-size:11px!important}.info .teamInput input{display:block!important;width:100%!important;height:31px!important;margin:3px 0 0!important;padding:4px 7px!important;border:1px solid #cbd5e1!important;border-radius:7px!important;background:#fff!important;color:#101828!important;font-size:12px!important}
          .info .i3{padding-bottom:8px!important}.info .formatline{display:grid!important;grid-template-columns:92px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;width:100%!important;margin:2px 0!important;min-height:0!important}.info .flabel{margin:0!important;color:#475467!important;font-size:11px!important;font-weight:900!important}.info .i3 .seg{display:grid!important;gap:6px!important;min-width:0!important}.info .i3 .seg button{height:34px!important;min-width:0!important;padding:2px 4px!important;border:1px solid #cbd5e1!important;border-radius:9px!important;background:#f8fafc!important;color:#344054!important;font-size:12px!important;font-weight:850!important}.info .i3 .seg button.on{background:#eaf1ff!important;color:#155eef!important;border:2px solid #5b8cff!important}.info .conditionChoices{grid-template-columns:1fr 1fr!important}.info .conditionChoices button{height:42px!important}.info .conditionChoices small{display:block!important;font-size:8px!important;line-height:9px!important;margin-top:1px!important}.info .maxLine{height:38px!important}.maxControl{height:34px!important;display:flex!important;align-items:center!important;gap:8px!important;justify-content:flex-end!important;min-width:0!important}.maxSwitch{width:44px!important;height:26px!important;flex:none!important;padding:3px!important;border:0!important;border-radius:99px!important;background:#cbd5e1!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}.maxSwitch span{width:20px!important;height:20px!important;border-radius:50%!important;background:#fff!important}.maxSwitch.on{background:#155eef!important;justify-content:flex-end!important}.maxEntry{width:126px!important;height:34px!important;display:grid!important;grid-template-columns:34px 1fr 34px!important;border:1px solid #b2ccff!important;border-radius:9px!important;overflow:hidden!important}.maxEntry button{border:0!important;background:#eef4ff!important;color:#155eef!important;font-size:18px!important;font-weight:950!important}.maxEntry strong{display:grid!important;place-items:center!important;border-left:1px solid #d5e1f5!important;border-right:1px solid #d5e1f5!important;font-size:16px!important}.offText{width:126px!important;color:#98a2b3!important;font-size:10px!important;font-weight:800!important}
          .info .i4 .hint{margin:0 0 6px!important;color:#667085!important;font-size:9px!important;line-height:11px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.info .startgrid{flex:1!important;display:grid!important;grid-template-columns:1fr 76px 1fr!important;gap:8px!important;min-height:0!important}.info .startbox,.info .startScore{height:66px!important;min-width:0!important;border:1px solid #d9e2ec!important;border-radius:10px!important;background:#f8fafc!important;text-align:center!important}.info .startbox{padding:5px!important}.info .startbox b{font-size:10px!important;color:#475467!important}.info .startbox .joined{width:100%!important;height:34px!important;margin:4px auto 0!important;grid-template-columns:30px 1fr 30px!important}.info .startScore{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;background:#eaf1ff!important;border-color:#b2ccff!important}.info .startScore small{font-size:7px!important;color:#667085!important;font-weight:850!important}.info .startScore strong{font-size:18px!important;color:#155eef!important;margin-top:2px!important}.info .joined{border:1px solid #b2ccff!important;border-radius:8px!important;background:#fff!important;overflow:hidden!important}.info .joined button{border:0!important;background:#eef4ff!important;color:#155eef!important;font-weight:950!important}.info .joined strong{display:grid!important;place-items:center!important;color:#101828!important;border-left:1px solid #d5e1f5!important;border-right:1px solid #d5e1f5!important}
          .info .i5 .ititle{margin-bottom:5px!important}.info .note{flex:1!important;width:100%!important;height:auto!important;min-height:30px!important;padding:7px!important;border:1px solid #cbd5e1!important;border-radius:8px!important;background:#fff!important;color:#101828!important;font-size:12px!important;resize:none!important}.info .startBtn{width:100%!important;height:52px!important;margin:0!important;border:0!important;border-radius:12px!important;background:#155eef!important;color:#fff!important;font-size:17px!important;font-weight:950!important}
          @media(max-height:800px){.info{grid-template-rows:40px 92px 122px 166px 98px 62px 44px!important;gap:6px!important;padding-top:calc(6px + env(safe-area-inset-top))!important;padding-bottom:calc(7px + env(safe-area-inset-bottom))!important}.info .top{height:40px!important}.info .icard{padding:6px 8px!important}.info .ititle{height:22px!important;margin-bottom:4px!important;font-size:13px!important}.info .num{width:22px!important;height:22px!important}.info .sportChoice{height:52px!important;grid-template-rows:18px 16px 10px!important}.info .sportIcon{font-size:17px!important}.info .teamInput input{height:26px!important}.info .formatline{margin:1px 0!important;grid-template-columns:82px minmax(0,1fr)!important}.info .i3 .seg button{height:29px!important}.info .conditionChoices button{height:36px!important}.info .maxLine{height:30px!important}.maxControl{height:29px!important}.maxEntry{height:29px!important}.info .startbox,.info .startScore{height:53px!important}.info .startbox .joined{height:27px!important}.info .startBtn{height:44px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit rebuilt page
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 04 with clean layout system"
          git push
