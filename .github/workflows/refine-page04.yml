name: Polish Page 04 UI
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Page 04 polish
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          extra='''
          /* Page 04 professional visual polish */
          .info{background:#0b1f3a!important;color:#172033!important;gap:5px!important}
          .info .top,.info .back{color:#fff!important}.info .icard{background:#f8fafc!important;border:1px solid #d8e1ec!important;color:#172033!important;box-shadow:0 2px 8px rgba(2,12,27,.12)!important;overflow:hidden!important}
          .info .ititle{color:#172033!important}.info .num{background:#155eef!important;color:#fff!important}.info .flabel{color:#344054!important}.info .hint{color:#667085!important}
          .info .seg button{background:#fff!important;border:1px solid #d0d9e5!important;color:#344054!important}.info .seg button.on{background:#eaf1ff!important;border:2px solid #3973e6!important;color:#1849a9!important}
          .info .sportChoice{height:68px!important;min-height:68px!important;padding:7px 8px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;overflow:hidden!important}
          .info .sportIcon{width:30px!important;height:30px!important;font-size:22px!important;line-height:30px!important;display:block!important;text-align:center!important;flex:none!important}.info .sportName{font-size:12px!important;line-height:14px!important}.info .sportMeta{font-size:9px!important;line-height:10px!important}
          .info .formatline{grid-template-columns:88px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;margin:4px 0!important}.info .formatline .seg{min-width:0!important}.info .ruleRow{gap:4px!important}.info .ruleRow button{height:38px!important;padding:2px 3px!important;font-size:10px!important;line-height:11px!important}.info .ruleRow small{font-size:7px!important;line-height:8px!important}
          .info .maxrow{background:#eef4ff!important;border:1px solid #c7d7f5!important;border-radius:10px!important;padding:5px 7px!important;margin-top:5px!important}.info .maxrow .flabel{margin:0!important}.info .joined{height:38px!important;grid-template-columns:34px 58px 34px!important;max-width:126px!important;background:#fff!important;border:1px solid #b9c9df!important;border-radius:9px!important}.info .joined button{font-size:17px!important;color:#155eef!important;background:#eef4ff!important;padding:0!important}.info .joined strong{font-size:18px!important;color:#172033!important;background:#fff!important;border-left:1px solid #c7d3e2!important;border-right:1px solid #c7d3e2!important;min-width:58px!important}
          .info .startgrid{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr)!important;gap:7px!important;align-items:stretch!important}.info .startbox{background:#fff!important;border:1px solid #d0d9e5!important;border-radius:11px!important;padding:7px 5px!important}.info .startbox b{color:#344054!important;font-size:10px!important}.info .startbox .joined{grid-template-columns:30px minmax(38px,1fr) 30px!important;width:100%!important;max-width:118px!important;height:36px!important;margin:5px auto 0!important}.info .startbox .joined strong{min-width:38px!important;font-size:17px!important}.info .startScore{background:#155eef!important;border:0!important;border-radius:11px!important;box-shadow:0 2px 6px rgba(21,94,239,.2)!important}.info .startScore small{color:#dbe7ff!important;font-size:7px!important;line-height:9px!important;padding:0 3px!important}.info .startScore strong{color:#fff!important;font-size:18px!important;line-height:22px!important;margin-top:2px!important}
          .info .teamInput{background:#fff!important;border-color:#d8e1ec!important}.info .teamInput input,.info .note{background:#fff!important;border-color:#cbd5e1!important;color:#172033!important}.info .teamInput b{color:#1849a9!important}.info .note{font-size:12px!important}.info .startBtn{background:#155eef!important;box-shadow:0 3px 9px rgba(21,94,239,.25)!important}
          @media(max-height:760px){.info .sportChoice{height:58px!important;min-height:58px!important;padding:4px!important}.info .sportIcon{width:25px!important;height:25px!important;font-size:18px!important;line-height:25px!important}.info .formatline{margin:2px 0!important}.info .ruleRow button{height:32px!important}.info .maxrow{padding:3px 5px!important}.info .joined{height:32px!important}.info .startbox{padding:4px!important}.info .startbox .joined{height:31px!important}.info .startScore strong{font-size:16px!important}}
          '''
          x=x.replace('</style>',extra+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Page 04 controls and professional palette" || exit 0
          git push
