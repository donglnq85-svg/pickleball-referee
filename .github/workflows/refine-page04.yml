name: Center Page 04 layout
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and balance Page 04
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          css='''
          /* Page 04 horizontal balance: one centered content axis, symmetric columns */
          .info{width:100%!important;max-width:none!important;margin:0!important;padding-left:max(12px,env(safe-area-inset-left))!important;padding-right:max(12px,env(safe-area-inset-right))!important;box-sizing:border-box!important;justify-items:stretch!important}
          .info>*{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}.info .top{display:grid!important;grid-template-columns:40px 1fr 40px!important;align-items:center!important}.info .top h2{grid-column:2!important;text-align:center!important;margin:0!important}.info .top .back{grid-column:1!important;justify-self:start!important}.info .icard{margin-left:0!important;margin-right:0!important}
          .info .seg,.info .teamsInput,.info .startgrid{width:100%!important;min-width:0!important}.info .i1>.seg{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.info .sportChoice{width:100%!important;max-width:none!important}.info .teamsInput{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important}.info .teamInput{width:100%!important;min-width:0!important}.info .teamInput input{width:100%!important;min-width:0!important;box-sizing:border-box!important}
          .info .i3 .formatline{grid-template-columns:92px minmax(0,1fr)!important;width:100%!important}.info .i3 .seg{width:100%!important;min-width:0!important}.info .smartWin{grid-template-columns:repeat(3,minmax(0,1fr))!important}.info .twoRules{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.maxToggleWrap{width:100%!important;justify-content:flex-end!important}.maxInput{width:min(142px,100%)!important;min-width:0!important}.maxOff{min-width:0!important;width:min(142px,100%)!important;text-align:left!important}
          .info .startgrid{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr)!important;gap:8px!important}.info .startbox,.info .startScore{width:100%!important;min-width:0!important}.info .startbox .joined{width:100%!important;max-width:118px!important;margin-left:auto!important;margin-right:auto!important}.info .note,.info .startBtn{width:100%!important;box-sizing:border-box!important}
          @media(max-width:390px){.info .i3 .formatline{grid-template-columns:82px minmax(0,1fr)!important}.info .startgrid{grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr)!important;gap:6px!important}.info .teamsInput,.info .i1>.seg{gap:6px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Center and balance Page 04 horizontally" || exit 0
          git push
