name: Rebuild Page 04 demo style
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Page 04 from scratch
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          x=p.read_text()
          # Remove every historical Page 04 override from the first known marker onward.
          markers=['/* Page 04 bright cards + overlap-safe sizing */','/* PAGE04_CLEAN_LAYOUT','/* PAGE04_CLEAN_V1']
          hits=[x.find(m) for m in markers if x.find(m)>=0]
          if hits:
              a=min(hits); b=x.find('</style>',a)
              if b<0: raise SystemExit('style end not found')
              x=x[:a]+x[b:]
          # Replace Page 04 render body completely; keep state and next-screen logic.
          pat=re.compile(r"function info\(\)\{.*?\n\}\nfunction create",re.S)
          new=r'''function info(){
 var custom=s.winPoints!==11&&s.winPoints!==15;
 var maxOn=s.limitMode==='maximum';
 app.innerHTML=`<div class="screen info demo04">
  <div class="top"><button class="back" onclick="home()">‹</button><h2>Thiết lập trận đấu</h2><span></span></div>
  <section class="dcard formatCard"><div class="dhead"><span class="dnum">1</span><b>Hình thức</b></div><div class="choice2"><button class="${s.type==='double'?'on':''}" onclick="s.type='double';render()"><strong>Đánh đôi</strong><small>2 vs 2</small></button><button class="${s.type==='single'?'on':''}" onclick="s.type='single';render()"><strong>Đánh đơn</strong><small>1 vs 1</small></button></div></section>
  <section class="dcard playersCard"><div class="dhead"><span class="dnum">2</span><b>Vận động viên</b></div><div class="playerGrid"><div><label>ĐỘI A</label><input value="${s.names.A[0]}" oninput="s.names.A[0]=this.value">${s.type==='double'?`<input value="${s.names.A[1]}" oninput="s.names.A[1]=this.value">`:''}</div><div><label>ĐỘI B</label><input value="${s.names.B[0]}" oninput="s.names.B[0]=this.value">${s.type==='double'?`<input value="${s.names.B[1]}" oninput="s.names.B[1]=this.value">`:''}</div></div></section>
  <section class="dcard rulesCard"><div class="dhead"><span class="dnum">3</span><b>Thể thức</b></div>
   <div class="drow"><label>Số set</label><div class="chips three">${[1,3,5].map(v=>`<button class="${s.sets===v?'on':''}" onclick="s.sets=${v};render()">${v}</button>`).join('')}</div></div>
   <div class="drow"><label>Điểm thắng</label><div class="chips three"><button class="${s.winPoints===11?'on':''}" onclick="s.winPoints=11;render()">11</button><button class="${s.winPoints===15?'on':''}" onclick="s.winPoints=15;render()">15</button><button class="${custom?'on':''}" onclick="if(!${custom})s.winPoints=21;render()">Khác</button></div></div>
   ${custom?`<div class="drow sub"><label>Nhập điểm</label><div class="stepper"><button onclick="s.winPoints=Math.max(1,s.winPoints-1);if(s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()">−</button><strong>${s.winPoints}</strong><button onclick="s.winPoints++;if(s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()">+</button></div></div>`:''}
   <div class="drow"><label>Thắng set</label><div class="chips two"><button class="${s.limitMode==='touch'?'on':''}" onclick="s.limitMode='touch';render()"><strong>Chạm</strong><small>Chạm điểm là thắng</small></button><button class="${s.limitMode!=='touch'?'on':''}" onclick="s.limitMode='unlimited';render()"><strong>Cách 2</strong><small>Thắng cách biệt 2</small></button></div></div>
   <div class="drow maxSimple"><label>Điểm tối đa</label><div class="maxArea"><button class="switch ${maxOn?'on':''}" onclick="s.limitMode=${maxOn}?'unlimited':'maximum';if(s.limitMode==='maximum'&&s.maxPoints<=s.winPoints)s.maxPoints=s.winPoints+2;render()"><span></span></button>${maxOn?`<div class="stepper"><button onclick="s.maxPoints=Math.max(s.winPoints+1,s.maxPoints-1);render()">−</button><strong>${s.maxPoints}</strong><button onclick="s.maxPoints++;render()">+</button></div>`:`<small>Tắt</small>`}</div></div>
  </section>
  <section class="dcard startCard"><div class="dhead"><span class="dnum">4</span><b>Điểm bắt đầu</b><small>Điểm chấp · chỉnh một đội, đội kia về 0</small></div><div class="startSimple"><div><label>ĐỘI A</label><div class="stepper"><button onclick="s.startA=Math.max(0,s.startA-1);s.startB=0;render()">−</button><strong>${s.startA}</strong><button onclick="s.startA++;s.startB=0;render()">+</button></div></div><strong class="versus">${s.startA} – ${s.startB}</strong><div><label>ĐỘI B</label><div class="stepper"><button onclick="s.startB=Math.max(0,s.startB-1);s.startA=0;render()">−</button><strong>${s.startB}</strong><button onclick="s.startB++;s.startA=0;render()">+</button></div></div></div></section>
  <section class="dcard noteCard"><div class="dhead"><span class="dnum">5</span><b>Ghi chú</b><small>Tùy chọn</small></div><textarea placeholder="Ghi chú cho trận đấu..." oninput="s.note=this.value">${s.note||''}</textarea></section>
  <button class="continue04" onclick="create()">TIẾP TỤC</button>
 </div>`
}
function create'''
          x,n=pat.subn(new,x,count=1)
          if n!=1: raise SystemExit('info function not found')
          css=r'''
          /* PAGE04_DEMO_V1 — intentionally simple, one system only */
          .demo04{height:100dvh!important;width:100%!important;max-width:430px!important;margin:auto!important;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))!important;background:#0b1f3a!important;color:#101828!important;display:grid!important;grid-template-rows:44px 92px 134px minmax(218px,1fr) 104px 72px 50px!important;gap:8px!important;overflow:hidden!important}.demo04 .top{height:44px!important;display:grid!important;grid-template-columns:40px 1fr 40px!important;align-items:center!important;color:#fff!important}.demo04 .back{grid-column:1!important;color:#fff!important}.demo04 .top h2{grid-column:2!important;text-align:center!important;margin:0!important;font-size:20px!important;white-space:nowrap!important}.dcard{height:100%!important;min-width:0!important;background:#fff!important;border:0!important;border-radius:16px!important;padding:9px 10px!important;overflow:hidden!important}.dhead{height:27px!important;display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:7px!important}.dhead b{font-size:15px!important}.dhead>small{margin-left:auto!important;color:#98a2b3!important;font-size:9px!important;white-space:nowrap!important}.dnum{width:25px!important;height:25px!important;flex:none!important;border-radius:50%!important;background:#155eef!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:12px!important;font-weight:900!important}
          .choice2{height:49px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.choice2 button,.chips button{border:1px solid #d0d5dd!important;border-radius:10px!important;background:#f8fafc!important;color:#344054!important;font-weight:850!important}.choice2 button.on,.chips button.on{border:2px solid #2e6ff2!important;background:#eef4ff!important;color:#1849a9!important}.choice2 strong{display:block!important;font-size:13px!important}.choice2 small{display:block!important;font-size:9px!important;margin-top:1px!important;color:#667085!important}
          .playerGrid{height:91px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.playerGrid>div{min-width:0!important}.playerGrid label,.startSimple label{display:block!important;text-align:center!important;font-size:10px!important;font-weight:900!important;color:#475467!important;margin-bottom:3px!important}.playerGrid input{display:block!important;width:100%!important;height:35px!important;margin-bottom:5px!important;padding:0 9px!important;border:1px solid #d0d5dd!important;border-radius:9px!important;background:#fff!important;color:#101828!important;font-size:12px!important}
          .rulesCard{display:flex!important;flex-direction:column!important}.drow{min-height:38px!important;display:grid!important;grid-template-columns:88px minmax(0,1fr)!important;gap:7px!important;align-items:center!important}.drow>label{font-size:11px!important;font-weight:900!important;color:#475467!important}.chips{height:34px!important;display:grid!important;gap:6px!important}.chips.three{grid-template-columns:repeat(3,1fr)!important}.chips.two{grid-template-columns:1fr 1fr!important;height:42px!important}.chips button{min-width:0!important;padding:2px 4px!important;font-size:12px!important}.chips.two strong{display:block!important;font-size:11px!important}.chips.two small{display:block!important;font-size:8px!important;line-height:9px!important;color:#667085!important}.drow.sub{background:#f8fafc!important;border-radius:9px!important;padding:2px 5px!important}.stepper{height:34px!important;display:grid!important;grid-template-columns:34px minmax(36px,1fr) 34px!important;border:1px solid #b2ccff!important;border-radius:9px!important;overflow:hidden!important;background:#fff!important}.stepper button{border:0!important;background:#eef4ff!important;color:#155eef!important;font-size:18px!important;font-weight:950!important}.stepper strong{display:grid!important;place-items:center!important;border-left:1px solid #d5e1f5!important;border-right:1px solid #d5e1f5!important;font-size:16px!important}.maxArea{height:34px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important}.maxArea>.stepper{width:126px!important}.maxArea>small{width:126px!important;color:#98a2b3!important;font-size:10px!important}.switch{width:44px!important;height:26px!important;border:0!important;border-radius:99px!important;padding:3px!important;background:#d0d5dd!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}.switch span{width:20px!important;height:20px!important;border-radius:50%!important;background:#fff!important}.switch.on{background:#155eef!important;justify-content:flex-end!important}
          .startSimple{height:61px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr)!important;gap:7px!important;align-items:center!important}.startSimple>div{min-width:0!important}.startSimple .stepper{height:35px!important;width:100%!important;grid-template-columns:30px 1fr 30px!important}.versus{text-align:center!important;color:#155eef!important;font-size:17px!important;white-space:nowrap!important}.noteCard textarea{display:block!important;width:100%!important;height:32px!important;padding:7px 9px!important;border:1px solid #d0d5dd!important;border-radius:9px!important;background:#f8fafc!important;color:#101828!important;font-size:12px!important;resize:none!important}.continue04{width:100%!important;height:50px!important;border:0!important;border-radius:14px!important;background:#155eef!important;color:#fff!important;font-size:17px!important;font-weight:950!important}
          @media(max-height:800px){.demo04{grid-template-rows:40px 82px 116px minmax(190px,1fr) 92px 62px 44px!important;gap:6px!important;padding-top:calc(6px + env(safe-area-inset-top))!important;padding-bottom:calc(7px + env(safe-area-inset-bottom))!important}.demo04 .top{height:40px!important}.dcard{padding:6px 8px!important;border-radius:13px!important}.dhead{height:22px!important;margin-bottom:4px!important}.dhead b{font-size:13px!important}.dnum{width:22px!important;height:22px!important}.choice2{height:44px!important}.playerGrid{height:79px!important}.playerGrid input{height:29px!important;margin-bottom:4px!important}.drow{min-height:32px!important;grid-template-columns:80px minmax(0,1fr)!important}.chips{height:29px!important}.chips.two{height:36px!important}.stepper,.maxArea{height:29px!important}.switch{height:24px!important}.switch span{width:18px!important;height:18px!important}.startSimple{height:52px!important}.startSimple .stepper{height:29px!important}.noteCard textarea{height:27px!important}.continue04{height:44px!important}}
          '''
          x=x.replace('</style>',css+'</style>',1)
          p.write_text(x)
      - name: Commit new Page 04
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 04 from scratch in demo style"
          git push
