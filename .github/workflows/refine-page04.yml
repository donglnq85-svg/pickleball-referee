name: Smart Page 04 format setup
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply smart format panel
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          extra='''
          /* Page 04 smart compact format panel */
          .info{gap:5px!important}.info .icard{padding:8px 10px!important}.info .ititle{margin-bottom:5px!important}.info .i1{flex:0 0 104px!important}.info .i2{flex:1 1 142px!important}.info .i3{flex:0 0 auto!important}.info .i4{flex:0 0 96px!important}.info .i5{flex:0 0 66px!important}
          .info .i3 .formatline{display:grid!important;grid-template-columns:78px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;min-height:34px!important;margin:3px 0!important;padding:0!important}.info .i3 .flabel{font-size:10px!important;font-weight:900!important;color:#475467!important;white-space:nowrap!important}.info .i3 .seg{display:grid!important;grid-auto-flow:column!important;grid-auto-columns:1fr!important;gap:5px!important;width:100%!important}.info .i3 .seg button{height:34px!important;min-width:0!important;padding:2px 4px!important;border-radius:9px!important;font-size:11px!important;line-height:12px!important}.info .i3 .ruleRow{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-flow:initial!important}.info .i3 .ruleRow button{height:42px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important;font-size:10px!important;line-height:11px!important}.info .i3 .ruleRow small{font-size:7px!important;line-height:8px!important;font-weight:700!important;color:#667085!important}.info .i3 .ruleRow button.on small{color:#3973e6!important}
          .info .i3 .maxrow{min-height:38px!important;height:38px!important;display:grid!important;grid-template-columns:78px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;background:#f8fafc!important;border:1px solid #e1e7ef!important;border-radius:9px!important;padding:3px 5px 3px 8px!important;margin:4px 0 0!important}.info .i3 .maxrow .joined{justify-self:end!important;width:112px!important;height:30px!important;grid-template-columns:29px 54px 29px!important}.info .i3 .maxrow .joined strong{min-width:54px!important;font-size:16px!important}.info .i3 .maxrow .joined button{font-size:15px!important}
          .info .i3 .joined{height:30px!important}.info .i3 .joined button{font-size:15px!important}.info .i3 .joined strong{font-size:15px!important}
          .info .sportChoice{height:62px!important;min-height:62px!important}.info .sportIcon{width:24px!important;height:24px!important;font-size:18px!important}.info .teamInput input{height:27px!important}.info .startgrid{grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr)!important}.info .startbox{padding:5px!important}.info .startbox .joined{height:31px!important}.info .note{height:36px!important}.info .startBtn{height:44px!important}
          @media(max-height:760px){.info{gap:3px!important}.info .icard{padding:5px 7px!important}.info .i1{flex:0 0 80px!important}.info .i2{flex:1 1 116px!important}.info .i3 .formatline{grid-template-columns:68px minmax(0,1fr)!important;min-height:27px!important;gap:4px!important;margin:1px 0!important}.info .i3 .flabel{font-size:8px!important}.info .i3 .seg{gap:3px!important}.info .i3 .seg button{height:27px!important;font-size:9px!important}.info .i3 .ruleRow button{height:34px!important;font-size:8px!important}.info .i3 .ruleRow small{font-size:6px!important}.info .i3 .maxrow{height:30px!important;min-height:30px!important;grid-template-columns:68px minmax(0,1fr)!important;gap:4px!important;padding:2px 3px 2px 6px!important;margin-top:2px!important}.info .i3 .maxrow .joined{height:25px!important;width:98px!important;grid-template-columns:25px 48px 25px!important}.info .i3 .maxrow .joined strong{min-width:48px!important;font-size:13px!important}.info .sportChoice{height:48px!important;min-height:48px!important}.info .sportIcon{width:18px!important;height:18px!important;font-size:14px!important}.info .teamInput input{height:22px!important}.info .i4{flex:0 0 73px!important}.info .i5{flex:0 0 48px!important}.info .note{height:27px!important}.info .startBtn{height:37px!important}}
          '''
          x=x.replace('</style>',extra+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Page 04 format setup as compact control panel" || exit 0
          git push
