name: Rebalance Page 04 lower section
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance lower layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          extra='''
          /* Page 04 screenshot correction: remove lower overlap and distribute remaining height */
          .info{gap:8px!important;padding-bottom:14px!important}
          .info .i1{height:106px!important}.info .i2{height:150px!important}.info .i3{height:190px!important}.info .i4{height:124px!important;overflow:hidden!important}.info .i5{height:76px!important;overflow:hidden!important}
          .info .i4 .hint{font-size:9px!important;line-height:12px!important;margin:0 0 7px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.info .startgrid{height:69px!important;gap:8px!important}.info .startbox,.info .startScore{height:69px!important}.info .startbox{padding:6px!important}.info .startbox .joined{height:34px!important;margin-top:5px!important}.info .startScore{min-width:0!important}.info .startScore strong{font-size:18px!important}.info .i5 .ititle{margin-bottom:7px!important}.info .note{height:35px!important;min-height:35px!important;display:block!important}.info .startBtn{flex:0 0 50px!important;height:50px!important;margin-top:1px!important}
          @media(min-height:850px){.info{justify-content:flex-start!important}.info .i1{height:112px!important}.info .i2{height:154px!important}.info .i3{height:194px!important}.info .i4{height:128px!important}.info .i5{height:78px!important}.info .startBtn{height:52px!important;flex-basis:52px!important}}
          @media(max-height:800px){.info{gap:5px!important;padding-bottom:8px!important}.info .i1{height:91px!important}.info .i2{height:125px!important}.info .i3{height:164px!important}.info .i4{height:99px!important}.info .i5{height:61px!important}.info .i4 .hint{font-size:8px!important;line-height:10px!important;margin-bottom:4px!important}.info .startgrid,.info .startbox,.info .startScore{height:54px!important}.info .startbox .joined{height:27px!important;margin-top:3px!important}.info .note{height:29px!important;min-height:29px!important}.info .startBtn{height:41px!important;flex-basis:41px!important}}
          '''
          x=x.replace('</style>',extra+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebalance Page 04 lower section spacing" || exit 0
          git push
