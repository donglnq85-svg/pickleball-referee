name: Minimal Page 04 redesign
on:
  push:
    paths:
      - '.github/workflows/refine-page04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal Page 04 system
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          x=p.read_text()
          extra='''
          /* Page 04 minimal demo-style design system */
          .info{background:#0b1f3a!important;color:#172033!important;gap:7px!important;padding-left:12px!important;padding-right:12px!important}.info .top{height:40px!important;flex:none!important}.info .top h2{font-size:18px!important;letter-spacing:-.2px!important}.info .top,.info .back{color:#fff!important}
          .info .icard{background:#fff!important;border:0!important;border-radius:15px!important;padding:10px 11px!important;color:#172033!important;box-shadow:none!important;overflow:hidden!important;min-height:0!important}.info .ititle{font-size:14px!important;line-height:24px!important;font-weight:900!important;color:#172033!important;margin:0 0 7px!important;gap:8px!important}.info .num{width:24px!important;height:24px!important;background:#155eef!important;color:#fff!important;font-size:11px!important;font-weight:900!important}.info .flabel{font-size:11px!important;font-weight:850!important;color:#475467!important;margin:0!important}.info .hint{font-size:9px!important;line-height:12px!important;color:#667085!important;margin:0 0 6px!important}
          .info .seg{gap:6px!important}.info .seg button{height:38px!important;border:1px solid #d7dee8!important;border-radius:10px!important;background:#f8fafc!important;color:#344054!important;font-size:12px!important;font-weight:850!important;padding:3px 5px!important}.info .seg button.on{background:#edf3ff!important;border:1.5px solid #3973e6!important;color:#1849a9!important;box-shadow:inset 0 0 0 .5px #3973e6!important}
          .info .sportChoice{height:72px!important;min-height:72px!important;padding:7px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important}.info .sportIcon{width:28px!important;height:28px!important;display:grid!important;place-items:center!important;font-size:20px!important;line-height:1!important;flex:none!important}.info .sportName{font-size:12px!important;line-height:14px!important;font-weight:900!important}.info .sportMeta{font-size:9px!important;line-height:11px!important;color:#667085!important;font-weight:700!important}.info .sportChoice.on .sportMeta{color:#3973e6!important}
          .info .teamsInput{gap:8px!important}.info .teamInput{background:#f8fafc!important;border:1px solid #e1e7ef!important;border-radius:11px!important;padding:6px!important}.info .teamInput b{font-size:10px!important;color:#1849a9!important;margin-bottom:3px!important}.info .teamInput input{height:29px!important;margin-top:3px!important;border:1px solid #d7dee8!important;border-radius:8px!important;background:#fff!important;color:#172033!important;padding:4px 7px!important;font-size:11px!important}
          .info .formatline{display:grid!important;grid-template-columns:86px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;margin:5px 0!important}.info .formatline .seg{min-width:0!important}.info .ruleRow{gap:5px!important}.info .ruleRow button{height:38px!important;font-size:10px!important;line-height:11px!important;padding:2px 3px!important}.info .ruleRow small{font-size:7px!important;line-height:8px!important;font-weight:650!important}
          .info .maxrow{height:42px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;background:#f8fafc!important;border:1px solid #e1e7ef!important;border-radius:10px!important;padding:4px 6px 4px 9px!important;margin-top:5px!important}.info .joined{height:32px!important;grid-template-columns:30px 48px 30px!important;max-width:110px!important;margin:0!important;border:1px solid #cbd5e1!important;border-radius:8px!important;background:#fff!important}.info .joined button{border:0!important;background:#f1f5f9!important;color:#155eef!important;font-size:16px!important;font-weight:900!important;padding:0!important}.info .joined strong{display:grid!important;place-items:center!important;min-width:48px!important;background:#fff!important;color:#172033!important;border-left:1px solid #d7dee8!important;border-right:1px solid #d7dee8!important;font-size:16px!important;font-weight:900!important}
          .info .startgrid{display:grid!important;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr)!important;gap:7px!important;align-items:stretch!important}.info .startbox{background:#f8fafc!important;border:1px solid #e1e7ef!important;border-radius:11px!important;padding:6px 5px!important;text-align:center!important}.info .startbox b{font-size:9px!important;color:#475467!important}.info .startbox .joined{width:100%!important;max-width:112px!important;height:34px!important;grid-template-columns:28px minmax(36px,1fr) 28px!important;margin:4px auto 0!important}.info .startbox .joined strong{min-width:36px!important;font-size:16px!important}.info .startScore{background:#edf3ff!important;border:1px solid #b9cef7!important;border-radius:11px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}.info .startScore small{font-size:7px!important;line-height:9px!important;color:#667085!important;font-weight:850!important;padding:0 3px!important}.info .startScore strong{font-size:17px!important;line-height:20px!important;color:#155eef!important;font-weight:950!important;margin-top:2px!important}
          .info .note{width:100%!important;height:42px!important;border:1px solid #d7dee8!important;border-radius:9px!important;padding:7px 8px!important;font-size:12px!important;line-height:16px!important;background:#f8fafc!important;color:#172033!important}.info .startBtn{height:48px!important;border-radius:12px!important;background:#155eef!important;color:#fff!important;font-size:16px!important;font-weight:950!important;box-shadow:none!important}
          .info .i1{flex:0 0 116px!important}.info .i2{flex:1 1 160px!important}.info .i3{flex:1.25 1 190px!important}.info .i4{flex:0 0 105px!important}.info .i5{flex:0 0 76px!important}
          @media(max-height:760px){.info{gap:4px!important}.info .top{height:34px!important}.info .icard{padding:6px 8px!important}.info .ititle{font-size:12px!important;line-height:21px!important;margin-bottom:4px!important}.info .num{width:21px!important;height:21px!important}.info .sportChoice{height:55px!important;min-height:55px!important;padding:3px!important}.info .sportIcon{width:22px!important;height:22px!important;font-size:16px!important}.info .sportName{font-size:10px!important}.info .formatline{margin:2px 0!important}.info .seg button{height:30px!important;font-size:10px!important}.info .ruleRow button{height:31px!important;font-size:8px!important}.info .maxrow{height:34px!important;margin-top:3px!important}.info .joined{height:27px!important}.info .teamInput input{height:24px!important;font-size:10px!important}.info .startgrid{gap:5px!important}.info .startbox{padding:3px!important}.info .startbox .joined{height:27px!important}.info .note{height:31px!important;font-size:10px!important;padding:4px 6px!important}.info .startBtn{height:39px!important;font-size:14px!important}.info .i1{flex:0 0 87px!important}.info .i2{flex:1 1 125px!important}.info .i3{flex:1.2 1 155px!important}.info .i4{flex:0 0 83px!important}.info .i5{flex:0 0 57px!important}}
          '''
          x=x.replace('</style>',extra+'</style>',1)
          p.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "THOC Software Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign Page 04 with minimal demo style" || exit 0
          git push
